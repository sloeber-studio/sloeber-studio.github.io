<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#BFEAFF">
<title>Glimmer Quest</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>💎</text></svg>">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@600;800&family=Nunito:wght@600;800&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#BFEAFF; --bg2:#E6F7FF; --surface:#FFFFFF; --ink:#1D2340; --text:#1D2340; --muted:#4F5A82;
  --gem:#16C5B0; --sun:#FFCF3F; --good:#22A866; --bad:#EF4B55;
  --leaf:#3BB273; --ember:#FF6B35; --tide:#2E86DE; --storm:#8E5CF7; --crystal:#E84FB0;
  --display:'Baloo 2', ui-rounded, 'SF Pro Rounded', 'Arial Rounded MT Bold', system-ui, sans-serif;
  --body:'Nunito', ui-rounded, 'SF Pro Rounded', system-ui, -apple-system, sans-serif;
  color-scheme:light;
  box-sizing:border-box; height:100%;
  padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){ --bg:#18204A; --bg2:#202A5E; --surface:#2C3672; --ink:#090C24; --text:#F2F4FF; --muted:#B8BFEA; color-scheme:dark; }
}
*,*::before,*::after{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%;margin:0}
body{font-family:var(--body);font-weight:600;color:var(--text);background:var(--bg);
  background-image:radial-gradient(color-mix(in srgb,var(--ink) 9%,transparent) 1.6px,transparent 1.7px);background-size:24px 24px;
  overflow:hidden;-webkit-user-select:none;user-select:none;-webkit-text-size-adjust:100%}
h1,h2,h3{font-family:var(--display);font-weight:800;line-height:1.05;margin:0}
p{margin:.4em 0;line-height:1.4}
button{font-family:inherit;color:inherit}
:focus-visible{outline:3px solid var(--gem);outline-offset:3px}
[hidden]{display:none!important}

#app{display:flex;flex-direction:column;height:100%;max-width:860px;margin:0 auto}
.top{display:flex;align-items:center;gap:12px;padding:10px 14px 6px}
.buddy-dot{width:52px;height:52px;border-radius:50%;border:3px solid var(--ink);display:grid;place-items:center;font-size:30px;
  background:color-mix(in srgb,var(--el) 40%,var(--surface));box-shadow:2px 3px 0 var(--ink);padding:0;cursor:pointer}
.who b{font-family:var(--display);font-size:20px;display:block;line-height:1.1}
.who small{color:var(--muted);font-size:13px}
.gems{margin-left:auto;font:800 22px/1 var(--display);background:var(--surface);border:3px solid var(--ink);border-radius:999px;padding:7px 14px 5px;box-shadow:3px 3px 0 var(--ink)}
.gems.bump{animation:bump .5s}
@keyframes bump{40%{transform:scale(1.2)}}
.icon-btn{width:46px;height:46px;border-radius:14px;border:3px solid var(--ink);background:var(--surface);box-shadow:3px 3px 0 var(--ink);font-size:22px;cursor:pointer;padding:0}
#view{flex:1;overflow-y:auto;-webkit-overflow-scrolling:touch;padding-bottom:24px;overscroll-behavior:contain}
.nav{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;padding:8px 12px 12px}
.nav button{position:relative;font:800 17px/1 var(--display);padding:10px 4px 8px;border:3px solid var(--ink);border-radius:16px;background:var(--surface);box-shadow:3px 3px 0 var(--ink);cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:4px}
.nav button span{font-size:24px}
.nav button[aria-current="true"]{background:var(--sun);color:#1D2340}
.dot{position:absolute;top:6px;right:10px;width:14px;height:14px;border-radius:50%;background:var(--bad);border:2px solid var(--ink)}

.btn{font:800 19px/1 var(--display);padding:13px 20px 11px;border:3px solid var(--ink);border-radius:14px;background:var(--surface);color:var(--text);box-shadow:3px 3px 0 var(--ink);cursor:pointer}
.btn:active:not(:disabled){transform:translate(2px,2px);box-shadow:1px 1px 0 var(--ink)}
.btn.go{background:var(--sun);color:#1D2340}
.btn.small{font-size:15px;padding:8px 12px 6px;border-radius:11px}
.btn:disabled{opacity:.45;cursor:default}
.row{display:flex;gap:12px;justify-content:center;flex-wrap:wrap;margin-top:14px}
.page-head{padding:14px 18px 4px}
.page-head h1{font-size:30px}
.page-head p{color:var(--muted);margin:2px 0 0}

/* Map */
.region{margin:18px 14px 26px;border:3px solid var(--ink);border-radius:26px;background:color-mix(in srgb,var(--el) 18%,var(--surface));box-shadow:5px 5px 0 var(--ink);overflow:hidden}
.region-head{display:flex;align-items:center;gap:12px;padding:12px 16px;background:var(--el);color:#fff;border-bottom:3px solid var(--ink)}
.region-head h2{font-size:25px;text-shadow:2px 2px 0 var(--ink)}
.region-head p{margin:0;font-size:14px;font-weight:800}
.region-icon{font-size:32px}
.region-badge{margin-left:auto;font-size:30px}
.trail{position:relative}
.trail svg{position:absolute;inset:0;width:100%;height:100%;overflow:visible}
.trail path{fill:none;stroke:var(--ink);stroke-width:5;stroke-dasharray:1 13;stroke-linecap:round;opacity:.4}
.node{position:absolute;transform:translate(-50%,-50%);width:86px;height:86px;border-radius:50%;border:3px solid var(--ink);background:var(--surface);box-shadow:3px 4px 0 var(--ink);font-size:42px;display:grid;place-items:center;cursor:pointer;padding:0;line-height:1}
.node.gym{width:104px;height:104px;border-radius:30px;font-size:50px}
.node.done{background:color-mix(in srgb,var(--el) 50%,var(--surface))}
.node.locked{background:color-mix(in srgb,var(--ink) 14%,var(--surface));font-size:28px;box-shadow:none}
.node.current::after{content:'';position:absolute;inset:-11px;border-radius:inherit;border:5px solid var(--sun);animation:ring 1.5s ease-out infinite;pointer-events:none}
@keyframes ring{from{transform:scale(.88);opacity:1}to{transform:scale(1.3);opacity:0}}
.node-label{position:absolute;top:100%;left:50%;transform:translateX(-50%);margin-top:7px;white-space:nowrap;font:800 14px/1.15 var(--display);background:var(--surface);border:2px solid var(--ink);border-radius:10px;padding:3px 9px 1px;text-align:center}
.stars{display:block;color:#F2A300;font-size:13px;letter-spacing:1px}
.fog{padding:26px 18px;text-align:center;font-weight:800;color:var(--muted)}
.fog span{font-size:40px;display:block;filter:grayscale(1);opacity:.6}

/* Packs */
.shelf{display:grid;grid-template-columns:repeat(auto-fill,minmax(160px,1fr));gap:22px;padding:16px 18px}
.pack-item{display:flex;flex-direction:column;gap:10px;align-items:stretch}
.pack{aspect-ratio:3/4.1;border:3px solid var(--ink);border-radius:16px;position:relative;overflow:hidden;color:#fff;padding:0;cursor:pointer;
  background:linear-gradient(125deg,var(--el) 0 30%,color-mix(in srgb,var(--el) 45%,#fff) 46%,var(--el) 60%,color-mix(in srgb,var(--el) 70%,#000));
  box-shadow:4px 5px 0 var(--ink);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px;width:100%}
.pack::before,.pack::after{content:'';position:absolute;left:0;right:0;height:14px;background:repeating-linear-gradient(90deg,rgba(0,0,0,.28) 0 6px,transparent 6px 12px)}
.pack::before{top:0}.pack::after{bottom:0}
.pack.pk-rainbow{background:conic-gradient(from 210deg at 50% 45%,var(--leaf),var(--tide),var(--storm),var(--crystal),var(--ember),var(--sun),var(--leaf))}
.pack.pk-mega{background:linear-gradient(135deg,#5B2FD6,#C94FE0 50%,#FF8A3D)}
.pack.pk-legend{background:linear-gradient(135deg,#123E8C,#5CB8FF 50%,#123E8C)}
.pack.pk-shiny{background:linear-gradient(125deg,#C98A00,#FFE27A 35%,#FFFBE6 48%,#F2B705 62%,#A86F00)}
.pack small{text-align:center;line-height:1.25}
.pack .p-icon{font-size:58px;filter:drop-shadow(2px 3px 0 rgba(0,0,0,.35))}
.pack b{font:800 21px/1 var(--display);text-shadow:2px 2px 0 var(--ink)}
.pack small{font-weight:800;text-shadow:1px 1px 0 var(--ink)}
.pack.locked{filter:grayscale(1) brightness(.85);cursor:default}
.shop-note{margin:0 18px;padding:12px 14px;border:3px dashed color-mix(in srgb,var(--ink) 35%,transparent);border-radius:16px;color:var(--muted)}

/* Cards */
.mcard{width:100%;height:100%;border:3px solid var(--ink);border-radius:16px;position:relative;overflow:hidden;color:#1D2340;padding:8px 6px;text-align:center;
  background:linear-gradient(165deg,color-mix(in srgb,var(--el) 28%,#fff),color-mix(in srgb,var(--el) 70%,#fff));
  display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px}
.mcard .m-emoji{font-size:clamp(38px,9vw,62px);line-height:1.1;position:relative;z-index:1}
.mcard b{font:800 clamp(14px,3.2vw,19px)/1.05 var(--display);position:relative;z-index:1}
.mcard .m-rar{font-size:11px;font-weight:800;background:#fff;border:2px solid var(--ink);border-radius:999px;padding:1px 8px;position:relative;z-index:1;white-space:nowrap}
.mcard.r3::after,.mcard.r4::after,.mcard.r5::after{content:'';position:absolute;inset:0;pointer-events:none;
  background:linear-gradient(115deg,transparent 30%,rgba(255,255,255,.65) 45%,transparent 55%,transparent 70%,rgba(255,255,255,.35) 78%,transparent 85%)}
.mcard.r4{background:linear-gradient(165deg,#FFF3B0,#FFC93C 55%,#F29E1F);border-color:#7A4B00}
.mcard.r5{background:conic-gradient(from 0deg,#FFB3E6,#B3D9FF,#C9FFD6,#FFF1A8,#FFB3E6)}
.mcard.shard{background:linear-gradient(165deg,#E9F4FF,#9FD0FF)}
.mcard.shiny{background:linear-gradient(160deg,#FFFBE6,#FFE27A 50%,color-mix(in srgb,var(--el) 45%,#F2B705));border-color:#8A5A00;box-shadow:inset 0 0 0 3px #FFF3B0}
.mcard.shiny::after{content:'';position:absolute;inset:0;pointer-events:none;background:linear-gradient(115deg,transparent 25%,rgba(255,255,255,.8) 42%,transparent 52%,transparent 68%,rgba(255,255,255,.5) 76%,transparent 84%)}
.shiny-mark{position:absolute;top:5px;left:7px;font-size:20px;z-index:2}
.missing .mcard.shiny{background:color-mix(in srgb,#F2B705 18%,var(--surface))}
.album-tabs{display:flex;gap:10px;padding:10px 18px 0}
.album-tabs .btn[aria-pressed="true"]{background:var(--sun);color:#1D2340}
.new{position:absolute;top:6px;right:6px;z-index:2;background:var(--bad);color:#fff;font:800 13px/1 var(--display);border:2px solid var(--ink);border-radius:8px;padding:4px 6px 2px;transform:rotate(8deg);font-style:normal}
.missing .mcard{background:color-mix(in srgb,var(--ink) 9%,var(--surface));color:var(--muted)}
.missing .mcard::after{display:none}
.missing .m-emoji{filter:brightness(0);opacity:.22}
.dark-silhouette .m-emoji{filter:brightness(0)}

/* Album */
.album-sec{margin:12px 16px 22px}
.album-sec h2{font-size:22px;display:flex;align-items:center;gap:8px;margin-bottom:10px}
.album-sec h2 small{font:800 14px var(--body);color:var(--muted);margin-left:auto}
.album-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(104px,1fr));gap:14px}
.slot{aspect-ratio:3/4;padding:0;border:0;background:none;cursor:pointer;position:relative}
.count{position:absolute;bottom:-7px;right:-7px;z-index:3;background:var(--sun);color:#1D2340;border:2px solid var(--ink);border-radius:999px;font:800 14px/1 var(--display);padding:4px 8px 2px}
.buddy-tag{position:absolute;top:-8px;left:-6px;z-index:3;background:var(--gem);color:#fff;border:2px solid var(--ink);border-radius:8px;font:800 12px/1 var(--display);padding:4px 6px 2px}
.progress{margin:8px 18px 0}
.bar{height:18px;border:3px solid var(--ink);border-radius:999px;background:var(--surface);overflow:hidden}
.bar i{display:block;height:100%;background:var(--gem);transition:width .6s}

/* Lab */
.lab-sec{margin:14px 14px 22px;border:3px solid var(--ink);border-radius:22px;background:color-mix(in srgb,var(--el) 14%,var(--surface));box-shadow:4px 4px 0 var(--ink);padding:12px}
.lab-sec h2{font-size:22px;margin:2px 4px 8px}
.line{display:grid;grid-template-columns:1fr auto 1fr auto 1fr;align-items:center;gap:6px;margin-bottom:12px}
.tile{aspect-ratio:3/4;position:relative;max-width:110px;width:100%;justify-self:center}
.fuse{font:800 14px/1.05 var(--display);border:3px solid var(--ink);border-radius:12px;background:var(--surface);box-shadow:2px 2px 0 var(--ink);padding:7px 6px 5px;cursor:pointer;min-width:58px}
.fuse:not(:disabled){background:var(--sun);color:#1D2340;animation:nudge 1.6s ease-in-out infinite}
.fuse:disabled{opacity:.45;cursor:default}
@keyframes nudge{50%{transform:scale(1.08)}}
.shards{display:flex;align-items:center;gap:12px;flex-wrap:wrap;padding:8px 4px}
.pips{display:flex;gap:6px}
.pips i{width:26px;height:26px;border-radius:7px;border:3px solid var(--ink);background:var(--surface);transform:rotate(45deg)}
.pips i.on{background:#5CB8FF}

/* Overlays */
.ov{position:fixed;inset:0;z-index:40;display:flex;flex-direction:column;align-items:center;justify-content:center;
  padding:calc(env(safe-area-inset-top,0px) + 14px) 14px calc(env(safe-area-inset-bottom,0px) + 14px);overflow-y:auto}
.battle-ov{background:var(--bg2);justify-content:flex-start}
.pack-ov{background:radial-gradient(circle at 50% 38%,#4535A8,#141A40 70%);color:#fff}
.pack-ov h2{font-size:30px;text-shadow:2px 2px 0 #000;text-align:center}
.pack-ov p{text-align:center;opacity:.9}
.big-pack{width:min(58vw,250px);font-size:inherit}
.big-pack .p-icon{font-size:90px}
.big-pack b{font-size:28px}
.wiggle{animation:wiggle 1.1s ease-in-out infinite}
@keyframes wiggle{0%,60%,100%{transform:rotate(0)}70%{transform:rotate(-5deg) scale(1.03)}80%{transform:rotate(5deg) scale(1.03)}90%{transform:rotate(-3deg)}}
.burst{animation:burst .55s forwards}
@keyframes burst{to{transform:scale(1.35);opacity:0;filter:brightness(2)}}
.reveal{display:flex;flex-wrap:wrap;gap:14px;justify-content:center;max-width:820px;margin:18px 0}
.reveal.many .flip{width:min(21vw,130px)}
.flip{width:min(27vw,158px);aspect-ratio:3/4;perspective:900px;background:none;border:0;padding:0;cursor:pointer;animation:deal .45s backwards}
@keyframes deal{from{transform:translateY(60px) scale(.6);opacity:0}}
.flip-inner{position:relative;width:100%;height:100%;transition:transform .65s cubic-bezier(.3,1.4,.5,1);transform-style:preserve-3d}
.flip.open .flip-inner{transform:rotateY(180deg)}
.face{position:absolute;inset:0;backface-visibility:hidden;-webkit-backface-visibility:hidden;border-radius:16px}
.face.back{border:3px solid #fff;display:grid;place-items:center;font-size:44px;color:#fff;
  background:repeating-conic-gradient(from 0deg,#5A48C8 0 15deg,#6E5CE0 15deg 30deg)}
.face.back.g2{box-shadow:0 0 22px 6px #57C7FF}
.face.back.g3{box-shadow:0 0 26px 8px #C77DFF}
.face.back.g4{box-shadow:0 0 30px 10px #FFD23F}
.face.front{transform:rotateY(180deg)}

.arena{width:100%;max-width:780px;position:relative;border:3px solid var(--ink);border-radius:24px;box-shadow:5px 5px 0 var(--ink);
  background:linear-gradient(180deg,color-mix(in srgb,var(--en) 28%,var(--surface)) 0 50%,color-mix(in srgb,var(--me) 28%,var(--surface)) 50%);
  display:grid;grid-template-rows:1fr 1fr;padding:14px 16px;height:min(44vh,360px);flex:none}
.side{display:flex;align-items:center;gap:16px;position:relative}
.side.enemy{justify-content:flex-end}
.mon{font-size:clamp(66px,15vw,112px);line-height:1;padding:0 6px 12px;
  background:radial-gradient(ellipse 50% 14% at 50% 92%,rgba(0,0,0,.2) 0 70%,transparent 72%)}
.plate{background:var(--surface);border:3px solid var(--ink);border-radius:14px;padding:8px 12px;min-width:min(46vw,210px);box-shadow:3px 3px 0 var(--ink)}
.plate b{font-family:var(--display);font-size:18px;display:block;line-height:1.1}
.plate small{font-weight:800;color:var(--muted)}
.hp{height:14px;border:2px solid var(--ink);border-radius:999px;overflow:hidden;background:color-mix(in srgb,var(--ink) 12%,var(--surface));margin:5px 0 2px}
.hp i{display:block;height:100%;background:var(--good);transition:width .45s}
.hp i.low{background:var(--bad)}
.hearts{font-size:20px;letter-spacing:1px;margin:3px 0}
.leave{position:absolute;top:12px;left:12px;z-index:2}
.dmg{position:absolute;font:800 34px var(--display);color:var(--bad);text-shadow:2px 2px 0 #fff;animation:rise .9s forwards;pointer-events:none;right:40px;top:0}
@keyframes rise{to{transform:translateY(-50px);opacity:0}}
.lunge-me{animation:lungeMe .45s}
@keyframes lungeMe{45%{transform:translate(40px,-34px) scale(1.1)}}
.lunge-en{animation:lungeEn .45s}
@keyframes lungeEn{45%{transform:translate(-40px,34px) scale(1.1)}}
.hit{animation:hit .45s}
@keyframes hit{20%,60%{transform:translateX(-12px);filter:brightness(2)}40%,80%{transform:translateX(12px)}}
.faint{animation:faint .7s forwards}
@keyframes faint{to{transform:translateY(40px) scale(.4);opacity:0}}
.qcard{width:100%;max-width:780px;margin-top:14px;padding:14px 16px 16px;background:var(--surface);border:3px solid var(--ink);border-radius:22px;box-shadow:5px 5px 0 var(--ink)}
.q-subj{font:800 14px var(--display);color:var(--muted)}
.q-text{font:800 clamp(21px,4.6vw,30px)/1.22 var(--display);margin:4px 0 14px;text-wrap:balance;-webkit-user-select:text;user-select:text}
.answers{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.ans{min-height:66px;font:800 clamp(19px,4vw,26px)/1.1 var(--display);padding:10px;border:3px solid var(--ink);border-radius:16px;background:var(--bg2);color:var(--text);box-shadow:3px 3px 0 var(--ink);cursor:pointer}
.ans:active:not(:disabled){transform:translate(2px,2px);box-shadow:1px 1px 0 var(--ink)}
.ans.right{background:var(--good);color:#fff}
.ans.wrong{background:var(--bad);color:#fff}
.ans:disabled{cursor:default}
.feedback{min-height:30px;margin-top:12px;font-weight:800;font-size:18px;text-align:center}
.feedback .btn{margin-top:10px}
.gem-gain{color:var(--gem)}
.result{text-align:center}
.result h2{font-size:38px}
.big-stars{font-size:46px;color:#F2A300;letter-spacing:4px;margin:4px 0}
.result ul{list-style:none;padding:0;margin:10px 0;font-weight:800}
.result li{margin:3px 0}
.total{font:800 26px var(--display);color:var(--gem)}
.reward-big{font:800 22px/1.2 var(--display);margin:10px 0;padding:10px;border:3px solid var(--ink);border-radius:14px;background:var(--sun);color:#1D2340}

/* Modal */
.modal-wrap{position:fixed;inset:0;z-index:60;background:rgba(18,22,58,.55);display:grid;place-items:center;padding:20px}
.modal{max-width:470px;width:100%;max-height:88vh;overflow:auto;padding:22px;text-align:center;background:var(--surface);border:3px solid var(--ink);border-radius:24px;box-shadow:6px 6px 0 var(--ink);animation:pop .3s}
@keyframes pop{from{transform:scale(.85);opacity:0}}
.modal h3{font-size:27px;margin-bottom:6px}
.vs{display:flex;align-items:center;justify-content:center;gap:12px;margin:14px 0}
.vs .tile{width:118px}
.vs-word{font:800 26px var(--display)}
.adv{font-weight:800;padding:8px 12px;border-radius:12px;border:2px solid var(--ink)}
.adv.strong{background:color-mix(in srgb,var(--good) 30%,var(--surface))}
.adv.weak{background:color-mix(in srgb,var(--bad) 25%,var(--surface))}
.adv.even{background:var(--bg2)}
.leader{font-size:64px;line-height:1}
.detail-card{width:170px;aspect-ratio:3/4;margin:6px auto 12px}
.fuse-show{font-size:54px;margin:10px 0;line-height:1.2}

/* Parent */
.hold{position:relative;overflow:hidden;width:100%;font:800 20px var(--display);padding:16px;border:3px solid var(--ink);border-radius:16px;background:var(--bg2);cursor:pointer;margin-top:10px;touch-action:none}
.hold i{position:absolute;inset:0;width:0;background:var(--sun);transition:width 0s}
.hold.go i{width:100%;transition:width 2s linear}
.hold span{position:relative}
.levels{display:grid;gap:10px;text-align:left;margin:12px 0}
.levels label{display:flex;gap:10px;align-items:flex-start;padding:10px 12px;border:3px solid var(--ink);border-radius:14px;cursor:pointer}
.levels label:has(input:checked){background:color-mix(in srgb,var(--sun) 55%,var(--surface))}
.levels input{width:22px;height:22px;margin-top:2px;flex:none}
.levels b{font-family:var(--display);font-size:18px}
.levels small{display:block;color:var(--muted)}
.stat-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin:10px 0}
.stat-grid div{border:2px solid var(--ink);border-radius:12px;padding:8px 4px}
.stat-grid b{font:800 22px var(--display);display:block}
.setting{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:10px 4px;border-top:2px dashed color-mix(in srgb,var(--ink) 25%,transparent);text-align:left}

/* Intro */
.intro{background:var(--bg);background-image:radial-gradient(color-mix(in srgb,var(--ink) 9%,transparent) 1.6px,transparent 1.7px);background-size:24px 24px}
.intro-inner{max-width:620px;width:100%;text-align:center}
.logo{font:800 clamp(52px,13vw,96px)/.9 var(--display);color:var(--sun);letter-spacing:-1px;
  text-shadow:3px 3px 0 var(--ink),-3px 3px 0 var(--ink),3px -3px 0 var(--ink),-3px -3px 0 var(--ink),0 3px 0 var(--ink),3px 0 0 var(--ink),-3px 0 0 var(--ink),0 -3px 0 var(--ink),7px 8px 0 var(--ink)}
.logo span{display:block;color:#fff;font-size:.62em}
.floaters{font-size:44px;margin:8px 0 4px;display:flex;justify-content:center;gap:16px}
.floaters span{display:inline-block;animation:bob 2.4s ease-in-out infinite}
.floaters span:nth-child(2){animation-delay:.3s}.floaters span:nth-child(3){animation-delay:.6s}.floaters span:nth-child(4){animation-delay:.9s}.floaters span:nth-child(5){animation-delay:1.2s}
@keyframes bob{50%{transform:translateY(-10px)}}
.tagline{font-size:19px;font-weight:800}
.name-in{font:800 24px var(--display);width:100%;max-width:340px;padding:12px 16px 9px;border:3px solid var(--ink);border-radius:14px;text-align:center;background:var(--surface);color:var(--text);box-shadow:3px 3px 0 var(--ink);-webkit-user-select:text;user-select:text}
.starters{display:flex;gap:14px;justify-content:center;margin:12px 0 18px}
.starters .slot{width:min(28vw,140px)}
.starters .slot.picked .mcard{outline:5px solid var(--sun);outline-offset:3px}
.step-label{font:800 20px var(--display);margin:18px 0 8px}

.toast{position:fixed;left:50%;bottom:calc(env(safe-area-inset-bottom,0px) + 104px);transform:translateX(-50%);z-index:90;max-width:90vw;
  background:var(--ink);color:#fff;font-weight:800;padding:12px 18px;border-radius:14px;box-shadow:0 6px 20px rgba(0,0,0,.25);animation:pop .3s;text-align:center}

@media (max-width:520px){
  .answers{gap:9px}.ans{min-height:58px}
  .nav button{font-size:14px}
  .line{grid-template-columns:1fr auto 1fr auto 1fr;gap:3px}
  .fuse{min-width:46px;font-size:12px}
}
@media (prefers-reduced-motion: reduce){
  *,*::before,*::after{animation:none!important;transition:none!important}
}

/* ---------- map ---------- */
function viewMap() {
  const xs = [26, 70, 34, 72, 30];

    } else {

      const nodes = sts.map((s, i) => {
        const un = isUnlocked(s.idx), done = S.cleared[s.id];
        const cur = un && !done;
        const cls = ['node', s.gym ? 'gym' : '', done ? 'done' : '', un ? '' : 'locked', cur ? 'current' : ''].join(' ');
        const face = !un ? '🔒' : s.gym ? reg.leader.emoji : MON[s.enemy].emoji;

}

    fb.innerHTML = `${pick(PRAISE)} ${b.streak >= 3 ? `🔥 ${b.streak} in a row!` : ''} ${m === 'strong' ? 'Super effective!' : ''} <span class="gem-gain">+${g} 💎</span>`;

}

/* ---------- packs ---------- */
function packUnlocked(p) { return p.unlock ? !!p.unlock() : regionReached(REGIONS.findIndex(x => x.id === p.el)); }

const packClass = p => p.el === 'any' ? 'pk-' + p.id : '';
function viewPacks() {
  return `<div class="page-head"><h1>Pack shop</h1><p>Spend gems to open packs. Glowing cards are rare, and golden ones are shiny.</p></div>
  <div class="shelf">${PACKS.map(p => {

    const style = p.el === 'any' ? '' : `style="--el:var(--${p.el})"`;
    return `<div class="pack-item">
      <button class="pack ${packClass(p)} ${un ? '' : 'locked'}" ${style} data-act="buyPack" data-id="${p.id}" ${un ? '' : 'disabled'} aria-label="${p.name}">

      <button class="btn ${un && can ? 'go' : ''}" data-act="buyPack" data-id="${p.id}" ${un && can ? '' : 'disabled'}>${!un ? (p.lockText || 'Reach this land') : can ? `Open · 💎 ${p.cost}` : `Need 💎 ${p.cost}`}</button>
    </div>`;
  }).join('')}</div>
  <p class="shop-note">Legend shards 🔷 hide in packs. Find 4 shards of one element to build a Legendary in the Lab. Shiny Glimmers ✨ are golden and give +1 💎 on every right answer when they are your buddy.</p>`;
}
function rollCard(p, forceStage) {
  const e = p.el === 'any' ? pick(Object.keys(LINES)) : p.el;
  const shardOk = !owned(LEGEND[e]) && S.shards[e] < 4;
  if (!forceStage && shardOk && Math.random() < (p.el === 'any' ? 0.1 : 0.08)) return { shard: e };
  if (p.shinyPack && !forceStage && Math.random() < 0.06) return { mon: LEGEND[e] + '_s' };
  const x = Math.random();
  const stage = forceStage || (p.el === 'any' ? (x < .55 ? 1 : x < .87 ? 2 : 3) : (x < .72 ? 1 : x < .94 ? 2 : 3));
  const shiny = Math.random() < (p.shinyPack ? 0.35 : 0.03);

}
function buyPack(id) {

  const cards = [];
  for (let i = 0; i < p.count; i++) cards.push(rollCard(p));
  const last = cards.length - 1;
  if (p.guarantee && !cards.some(c => c.mon && MON[c.mon].stage >= p.guarantee)) cards[last] = rollCard(p, p.guarantee);
  if (p.legendShard) {
    const need = Object.keys(LEGEND).filter(el => !owned(LEGEND[el]) && S.shards[el] < 4);
    cards[0] = need.length ? { shard: pick(need) } : rollCard(p, 3);

  if (p.shinyPack && !cards.some(c => c.mon && MON[c.mon].shiny)) { const c = rollCard(p, r(1, 3)); cards[last] = { mon: MON[c.mon].shiny ? c.mon : c.mon + '_s' }; }

    else { c.isNew = addMon(c.mon); c.glow = MON[c.mon].shiny ? 4 : MON[c.mon].stage; }

      <button class="flip ${o.opened.has(i) ? 'open' : ''}" data-act="flip" data-i="${i}" style="animation-delay:${i * 0.09}s" aria-label="${o.opened.has(i) ? (c.shard ? 'Legend shard' : MON[c.mon].name) : 'Hidden card'}">

    <div class="row">${all ? `<button class="btn go" data-act="closePack">Put them in my album</button>` : `<button class="btn" data-act="flipAll">Flip all</button>`}</div>`;
}

function howToGet(m) {
  if (m.shiny) {
    if (m.stage === 5) return 'Collect all 4 shiny Legends, then awaken it in the Lab.';
    if (m.stage === 4) return 'Only found in the Shiny Pack, and it is very rare.';
    return `Shiny Glimmers are rare in every pack, and common in the Shiny Pack.${m.prev ? ` You can also fuse 3 shiny ${MON[m.prev].name}.` : ''}`;
  }
  if (m.stage === 5) return 'Build all 4 Legends, then win the Crystal Heart at the top of Crystal Summit.';
  if (m.stage === 4) return `Collect 4 ${m.name} shards from packs and gym wins, then build it in the Lab.`;
  const pack = PACKS.find(p => p.el === m.el).name;
  return m.stage === 1 ? `Found in the ${pack}.` : `Found in the ${pack}, or fuse 3 ${MON[m.prev].name} in the Lab.`;
}
function monInfo(id) {
  const m = MON[id], seen = S.seen[id], have = S.col[id] || 0;
  if (!seen) {
    showModal(`<h3>Not found yet</h3><div class="detail-card missing">${card(id, { hidden: true })}</div><p>${howToGet(m)}</p><div class="row"><button class="btn go" data-act="close">OK</button></div>`);
    return;
  }
  const strong = m.el === 'crystal' ? 'Strong against every element.' : `Strong against ${ELEMENTS[BEATS[m.el]].name}. Weak against ${ELEMENTS[Object.keys(BEATS).find(k => BEATS[k] === m.el)].name}.`;
  showModal(`<h3>${m.name}</h3><div class="detail-card">${card(id)}</div>
    <p>${strong}<br>Hearts: ${maxHearts(m)}${have ? ` · You have ${have}` : ''}${m.shiny ? '<br>✨ Shiny bonus: +1 💎 on every right answer.' : ''}</p>
    ${m.next && have ? `<p>Fuse 3 to make ${S.seen[m.next] ? MON[m.next].name : 'something new'}.</p>` : ''}
    <div class="row"><button class="btn" data-act="close">Close</button>${have && S.buddy !== id ? `<button class="btn go" data-act="setBuddy" data-id="${id}">Make buddy</button>` : ''}</div>`);
}

/* ---------- lab ---------- */
function viewLab() {
  const secs = Object.keys(LINES).map(el => {
    const lines = LINES[el].map(line => {
      const ids = line.map(x => x[0]);
      const tile = id => `<div class="tile ${S.seen[id] ? '' : 'missing'}">${card(id, { hidden: !S.seen[id] })}${(S.col[id] || 0) > 0 ? `<span class="count">×${S.col[id]}</span>` : ''}</div>`;
      const fuseBtn = id => `<button class="fuse" data-act="fuse" data-id="${id}" ${(S.col[id] || 0) >= 3 ? '' : 'disabled'} aria-label="Fuse 3 ${MON[id].name}">3 → 1<br>Fuse</button>`;
      return `<div class="line">${tile(ids[0])}${fuseBtn(ids[0])}${tile(ids[1])}${fuseBtn(ids[1])}${tile(ids[2])}</div>`;
    }).join('');
    const lg = LEGEND[el], n = S.shards[el];
    const legendRow = owned(lg)
      ? `<div class="shards"><b>✨ ${MON[lg].name} built!</b></div>`
      : `<div class="shards"><b>${S.seen[lg] ? MON[lg].name : 'Legend'} shards</b><span class="pips">${[0, 1, 2, 3].map(i => `<i class="${i < n ? 'on' : ''}"></i>`).join('')}</span>
         <button class="btn small ${n >= 4 ? 'go' : ''}" data-act="assemble" data-el="${el}" ${n >= 4 ? '' : 'disabled'}>Build Legend</button></div>`;
    return `<section class="lab-sec" style="--el:var(--${el})"><h2>${ELEMENTS[el].icon} ${ELEMENTS[el].name}</h2>${lines}${legendRow}</section>`;
  }).join('');
  const legendsOwned = Object.values(LEGEND).filter(owned).length;
  const myth = owned('prismara') ? `<p><b>Prismara is yours. You finished the whole album!</b></p>`
    : `<p>Build all 4 Legends (${legendsOwned}/4) and win the Crystal Heart ${S.heart ? '(✅ you have it)' : '(🔒 top of Crystal Summit)'} to awaken the Mythic Glimmer.</p>
       <button class="btn ${mythicReady() ? 'go' : ''}" data-act="mythic" ${mythicReady() ? '' : 'disabled'}>Awaken the Mythic</button>`;
  const shinyLines = Object.keys(LINES).flatMap(el => LINES[el].map(line => line.map(x => x[0] + '_s'))).filter(ids => ids.some(id => S.seen[id]));
  const shinyLegends = Object.values(LEGEND).filter(id => owned(id + '_s')).length;
  const shinySec = (shinyLines.length || shinyLegends) ? `<section class="lab-sec" style="--el:#F2B705"><h2>✨ Shiny fusion</h2>
    ${shinyLines.map(ids => {
      const tile = id => `<div class="tile ${S.seen[id] ? '' : 'missing'}">${card(id, { hidden: !S.seen[id] })}${(S.col[id] || 0) > 0 ? `<span class="count">×${S.col[id]}</span>` : ''}</div>`;
      const fuseBtn = id => `<button class="fuse" data-act="fuse" data-id="${id}" ${(S.col[id] || 0) >= 3 ? '' : 'disabled'} aria-label="Fuse 3 ${MON[id].name}">3 → 1<br>Fuse</button>`;
      return `<div class="line">${tile(ids[0])}${fuseBtn(ids[0])}${tile(ids[1])}${fuseBtn(ids[1])}${tile(ids[2])}</div>`;
    }).join('')}
    <p>${owned('prismara_s') ? '<b>Shiny Prismara is yours!</b>' : `Shiny Legends found: ${shinyLegends}/4. Find all 4 in Shiny Packs to awaken Shiny Prismara.`}</p>
    ${owned('prismara_s') ? '' : `<button class="btn ${shinyMythicReady() ? 'go' : ''}" data-act="shinyMythic" ${shinyMythicReady() ? '' : 'disabled'}>Awaken Shiny Prismara</button>`}
  </section>` : '';
  return `<div class="page-head"><h1>Fusion lab</h1><p>Put 3 of the same Glimmer together to make a bigger, stronger one.</p></div>
    ${secs}<section class="lab-sec" style="--el:var(--crystal)"><h2>💎 The Mythic</h2>${myth}</section>${shinySec}`;
}
function fuse(id) {
  const m = MON[id]; if (!m.next || (S.col[id] || 0) < 3) return;
  S.col[id] -= 3; const isNew = addMon(m.next);
  let buddyMsg = '';
  if (S.buddy === id && !S.col[id]) { S.buddy = m.next; buddyMsg = '<p>Your buddy evolved!</p>'; }
  save(); sfx('fuse');
  const n = MON[m.next];
  showModal(`<h3>${isNew ? 'New Glimmer!' : 'Fusion complete!'}</h3><div class="fuse-show">${m.emoji}${m.emoji}${m.emoji} ➜ ${n.emoji}</div>
    <div class="detail-card">${card(n.id, { isNew })}</div><p>Three ${m.shiny ? 'shiny ' : ''}${m.name} became a ${n.shiny ? 'shiny ' : ''}${n.name}.</p>${buddyMsg}
    <div class="row"><button class="btn" data-act="close">Nice!</button>${S.buddy !== n.id ? `<button class="btn go" data-act="setBuddy" data-id="${n.id}">Make buddy</button>` : ''}</div>`);
  render();
}
function assemble(el) {
  if (S.shards[el] < 4 || owned(LEGEND[el])) return;
  S.shards[el] = 0; addMon(LEGEND[el]); save(); sfx('win');
  const m = MON[LEGEND[el]];
  showModal(`<h3>A Legend appears!</h3><div class="fuse-show">🔷🔷🔷🔷 ➜ ${m.emoji}</div><div class="detail-card">${card(m.id, { isNew: true })}</div>
    <p>${m.name} joined your team. It hits for 5 and has 6 hearts.</p>
    <div class="row"><button class="btn" data-act="close">Wow</button><button class="btn go" data-act="setBuddy" data-id="${m.id}">Make buddy</button></div>`);
  render();
}
function awakenShiny() {
  if (!shinyMythicReady()) return;
  addMon('prismara_s'); save(); sfx('win');
  showModal(`<h3>Shiny Prismara awakens!</h3><div class="detail-card">${card('prismara_s', { isNew: true })}</div>
    <p>The rarest Glimmer of all. Incredible, ${esc(S.name)}!</p>
    <div class="row"><button class="btn go" data-act="setBuddy" data-id="prismara_s">Make buddy</button></div>`);
  render();
}
function awaken() {
  if (!mythicReady()) return;
  addMon('prismara'); save(); sfx('win');
  showModal(`<h3>Prismara awakens!</h3><div class="detail-card">${card('prismara', { isNew: true })}</div>
    <p>You collected every Glimmer and beat every gym. Amazing work, ${esc(S.name)}!</p>
    <div class="row"><button class="btn go" data-act="setBuddy" data-id="prismara">Make buddy</button></div>`);
  render();
}

/* ---------- parent area ---------- */
const LEVELS = [
  [1, 'Grade 3+', 'Times tables, 3-digit add and subtract, rounding, area, perimeter, time, unit fractions'],
  [2, 'Grade 4', '2-digit × 1-digit, division with bigger numbers, equivalent fractions, factors, place value, two-step word problems'],
  [3, 'Grade 5', '2-digit × 2-digit, decimals, fractions of a number, order of operations, volume, percents, negatives']
];
let holdTimer = null;
function openParentGate() {
  showModal(`<h3>Grown-ups only</h3><p>Press and hold the button for 2 seconds.</p>
    <button class="hold" id="hold"><i></i><span>Hold to open settings</span></button>
    <div class="row"><button class="btn" data-act="close">Cancel</button></div>`);
  const h = $('#hold');
  const start = e => { e.preventDefault(); h.classList.add('go'); holdTimer = setTimeout(parentSettings, 2000); };
  const stop = () => { h.classList.remove('go'); clearTimeout(holdTimer); };
  h.addEventListener('pointerdown', start); h.addEventListener('pointerup', stop); h.addEventListener('pointerleave', stop); h.addEventListener('pointercancel', stop);
  h.addEventListener('contextmenu', e => e.preventDefault());
}
function parentSettings() {
  const pc = s => S.stats[s].n ? Math.round(S.stats[s].c / S.stats[s].n * 100) + '%' : '–';
  showModal(`<h3>Parent settings</h3>
    <p style="text-align:left"><b>Challenge level</b> (math, science and geography all follow this)</p>
    <div class="levels">${LEVELS.map(([v, t, d]) => `<label><input type="radio" name="lvl" value="${v}" ${S.level === v ? 'checked' : ''} data-act="setLevel"><span><b>${t}</b><small>${d}</small></span></label>`).join('')}</div>
    <p style="text-align:left"><b>Right answers so far</b></p>
    <div class="stat-grid">${Object.keys(SUBJ).map(s => `<div><b>${pc(s)}</b>${SUBJ[s].label}<br><small>${S.stats[s].c}/${S.stats[s].n}</small></div>`).join('')}</div>
    <div class="setting"><span>Sound effects</span><button class="btn small" data-act="toggleSound">${S.sound ? 'On' : 'Off'}</button></div>
    <div class="setting"><span>Give a reward of 50 gems</span><button class="btn small" data-act="gift">+50 💎</button></div>
    <div class="setting"><span>Start over (erases all progress)</span><button class="btn small" data-act="reset" id="resetBtn">Reset</button></div>
    <div class="row"><button class="btn go" data-act="close">Done</button></div>`);
}

/* ---------- intro ---------- */
function showIntro() {
  const ov = $('#intro'); ov.hidden = false;
  const starters = ['sproutle', 'magmite', 'splishy'];
  ov.innerHTML = `<div class="intro-inner">
    <h1 class="logo">Glimmer<span>Quest</span></h1>
    <div class="floaters" aria-hidden="true"><span>🌱</span><span>🦎</span><span>💎</span><span>🐟</span><span>🐭</span></div>
    <p class="tagline">Solve puzzles. Earn gems. Open packs. Collect every Glimmer.</p>
    <p class="step-label">What’s your trainer name?</p>
    <input class="name-in" id="nameIn" maxlength="14" autocomplete="off" placeholder="Your name" value="${esc(S.name)}">
    <p class="step-label">Pick your first buddy</p>
    <div class="starters">${starters.map(id => `<button class="slot ${introPick === id ? 'picked' : ''}" data-act="pickStarter" data-id="${id}" aria-label="${MON[id].name}">${card(id)}</button>`).join('')}</div>
    <button class="btn go" data-act="begin" id="beginBtn">Start the adventure</button>
  </div>`;
  $('#nameIn').addEventListener('input', e => { S.name = e.target.value; });
}
function begin() {
  const name = ($('#nameIn').value || '').trim();
  if (!name) return toast('Type your trainer name first.');
  if (!introPick) return toast('Pick a buddy to start.');
  S.name = name; S.started = true; S.gems = 25; S.lastDaily = today();
  addMon(introPick); S.buddy = introPick; save();
  $('#intro').hidden = true; $('#intro').innerHTML = '';
  tab = 'map'; render();
  toast(`You got 25 gems! Win battles for more, then open packs in the shop.`, 4200);
}

/* ---------- actions ---------- */
const ACTIONS = {
  tab: b => { tab = b.dataset.tab; closeModal(); render(); $('#view').scrollTop = 0; },
  station: b => openStation(+b.dataset.i),
  fight: b => startBattle(+b.dataset.i),
  retry: b => { const i = +b.dataset.i; battle = null; startBattle(i); },
  changeBuddy: () => { closeModal(); tab = 'album'; render(); toast('Tap a Glimmer you own, then press Make buddy.'); },
  ans: b => answer(+b.dataset.i),
  next: () => nextQ(),
  lose: () => lose(),
  leave: () => endBattle(),
  endBattle: () => endBattle(),
  buyPack: b => buyPack(b.dataset.id),
  tear: () => { sfx('tear'); const bp = $('#bigPack'); bp.classList.remove('wiggle'); bp.classList.add('burst'); setTimeout(() => { packOv.torn = true; renderPackOv(); }, 450); },
  flip: b => flipCard(+b.dataset.i),
  flipAll: () => packOv.cards.forEach((c, i) => setTimeout(() => flipCard(i), i * 160)),
  closePack: () => closePack(),
  monInfo: b => monInfo(b.dataset.id),
  buddyInfo: () => monInfo(S.buddy),
  setBuddy: b => { S.buddy = b.dataset.id; save(); closeModal(); render(); toast(`${MON[S.buddy].name} is your buddy now!`); },
  fuse: b => fuse(b.dataset.id),
  assemble: b => assemble(b.dataset.el),
  mythic: () => awaken(),
  shinyMythic: () => awakenShiny(),
  albumMode: b => { albumMode = b.dataset.mode; render(); $('#view').scrollTop = 0; },
  close: () => closeModal(),
  parent: () => openParentGate(),
  setLevel: b => { S.level = +b.value; save(); setTimeout(parentSettings, 50); },
  toggleSound: () => { S.sound = !S.sound; save(); parentSettings(); },
  gift: () => { S.gems += 50; save(); render(); bumpGems(); toast('+50 gems added.'); },
  reset: b => {
    if (b.dataset.confirm !== '1') { b.dataset.confirm = '1'; b.textContent = 'Tap again to erase'; b.style.background = 'var(--bad)'; b.style.color = '#fff'; return; }
    S = defaultState(); save(); closeModal(); introPick = null; scrolledOnce = false; showIntro();
  },
  pickStarter: b => { introPick = b.dataset.id; document.querySelectorAll('.starters .slot').forEach(s => s.classList.toggle('picked', s.dataset.id === introPick)); sfx('flip'); },
  begin: () => begin()
};
function boot() {
  document.addEventListener('click', e => {
    const b = e.target.closest('[data-act]'); if (!b || b.disabled) return;
    const fn = ACTIONS[b.dataset.act]; if (fn) fn(b);
  });
  $('#modal').addEventListener('click', e => { if (e.target.id === 'modal') closeModal(); });
  if (!S.started || !S.buddy) { showIntro(); return; }
  render();
  if (S.lastDaily !== today()) { S.lastDaily = today(); S.gems += 20; save(); renderTop(); bumpGems(); setTimeout(() => toast('🎁 Daily gift: +20 gems! Come back tomorrow for more.', 3600), 400); }
}
document.addEventListener('DOMContentLoaded', boot);
</script>
</body>
</html>
