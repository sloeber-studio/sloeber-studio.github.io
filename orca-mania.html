<title>Orca-Mania: family trivia</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:wght@400;700&family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,800&display=swap" rel="stylesheet">
<style>
/* Always dark: this is a TV game, usually played in a living room in the evening */
:root{
  --bg:#0F1730; --surface:#1A2546; --surface2:#26335E; --ink:#F3F5FB; --muted:#A5AFCB; --line:#34437A;
  --fb:#239A5F; --geo:#2A86D8; --sci:#8E52DC; --fun:#F2B12A;
  --animals:#8A5A3B; --art:#E0457B; --brain:#13A3A0; --music:#EE7B22;
  --pick:#46507A; --double:#5B4A86; --steal:#A23B4C; --challenge:#8A5A1E;
  --good:#22B46A; --bad:#E5533F; --gold:#F5C542;
  --display:"Bricolage Grotesque", "Avenir Next", "Segoe UI", system-ui, sans-serif;
  --body:"Atkinson Hyperlegible", "Verdana", system-ui, sans-serif;
  color-scheme: dark;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
}
*,*::before,*::after{box-sizing:border-box}
html{height:100%;font-size:clamp(15px, 1.2vw + .7vh, 28px);scroll-padding-top:env(safe-area-inset-top,0px);overscroll-behavior:none}
body{height:100%;margin:0;background:var(--bg);color:var(--ink);font-family:var(--body);line-height:1.35;-webkit-tap-highlight-color:transparent;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none;overflow:hidden;overscroll-behavior:none;touch-action:manipulation}
input{-webkit-user-select:text;user-select:text}
button{font:inherit;color:inherit;cursor:pointer;touch-action:manipulation}
button:focus-visible,input:focus-visible{outline:3px solid var(--geo);outline-offset:3px}
#app{height:100%;display:flex;flex-direction:column}
#app::after{content:"";position:fixed;inset:0;pointer-events:none;z-index:4;box-shadow:inset 0 0 0 .4rem var(--turn,transparent),inset 0 0 3rem color-mix(in srgb,var(--turn,transparent) 40%,transparent);transition:box-shadow .4s}
h1,h2,h3{font-family:var(--display);margin:0;line-height:1.1}

.btn{background:var(--ink);color:var(--bg);border:0;border-radius:999px;padding:.75em 1.6em;font-family:var(--display);font-weight:800;font-size:1.15rem}
.btn:disabled{opacity:.3}
.btn.big{font-size:1.4rem;padding:.8em 2em}
.btn.go{background:var(--gold);color:#1E1A10}
.ghost{background:transparent;border:2px solid var(--line);border-radius:999px;padding:.55em 1.2em;font-weight:700;color:var(--ink)}
.ghost:disabled{opacity:.35}
.btn:active,.ghost:active,.tile:active,.ans:active,.opp:active,.thief:active{transform:scale(.97)}

/* scoreboard */
.top{display:flex;align-items:center;gap:1rem;padding:.55rem 1.1rem;border-bottom:2px solid var(--line);background:var(--surface)}
.board{display:flex;gap:.5rem;flex:1;overflow-x:auto;scrollbar-width:none}
.chip{display:flex;align-items:center;gap:.45rem;padding:.25rem .85rem .25rem .25rem;border-radius:999px;border:3px solid transparent;flex:0 0 auto;transition:border-color .2s}
.chip.on{border-color:var(--pc);background:var(--surface2)}
.chipt{display:flex;flex-direction:column;line-height:1.1}
.chipt b{font-family:var(--display);font-size:1.05rem}
.chipt span{font-size:.72rem;color:var(--muted)}
.pc{width:.65rem;height:.65rem;border-radius:50%;background:var(--pc);display:inline-block;margin-right:.3rem}
.ring .ringn{font-family:var(--display);font-weight:800;font-size:28px;fill:var(--ink)}

#stage{flex:1;min-height:0;display:flex;align-items:flex-start;justify-content:center;padding:2.2vh 3vw;overflow:auto}
#stage>*{margin:auto}

/* home + info screens */
.home{display:grid;grid-template-columns:auto 1fr;gap:4vw;align-items:center;max-width:62rem}
.home h1{font-size:clamp(3rem,8vw,6.5rem);font-weight:800;letter-spacing:-.03em;line-height:.9}
.home p{font-size:1.15rem;color:var(--muted);max-width:32ch;margin:.9rem 0 1.4rem}
.home .row{display:flex;gap:.7rem;flex-wrap:wrap}
.home .tip{font-size:.85rem;margin-top:1.4rem;max-width:44ch}
.logo{width:min(40vh,30vw);height:auto;border-radius:22%}
.bob{animation:bob 2.4s ease-in-out infinite alternate}
@keyframes bob{from{transform:translate(0,3px)}to{transform:translate(0,-5px)}}
.wm span:nth-of-type(1){color:#239A5F}.wm span:nth-of-type(2){color:#2A86D8}.wm span:nth-of-type(3){color:#8E52DC}.wm span:nth-of-type(4){color:#E0457B}.wm span:nth-of-type(5){color:#EE7B22}
.winlogo{width:min(26vh,20vw);height:auto;border-radius:22%}
@keyframes turn{to{transform:rotate(360deg)}}
.sheetpage{width:min(100%,54rem);background:var(--surface);border-radius:24px;padding:1.6rem 2rem;max-height:100%;overflow:auto}
.sheetpage h2{font-size:2.1rem;font-weight:800;margin-bottom:.6rem}
.sheetpage h3{font-size:1.15rem;margin:1rem 0 .3rem}
.sheetpage p,.sheetpage li{max-width:68ch}
.sheetpage ul,.sheetpage ol{padding-left:1.3rem;margin:.3rem 0}
.sheetpage li{margin:.35rem 0}

/* setup */
.setup{width:min(100%,58rem);display:flex;flex-direction:column;gap:.9rem}
.setup .h1{font-size:2.3rem;font-weight:800}
.setup .row{display:flex;align-items:center;gap:1rem;flex-wrap:wrap}
.setup h3{font-size:1.05rem;min-width:8.5rem}
.seg{display:inline-flex;background:var(--surface2);border-radius:14px;padding:4px;gap:4px;flex-wrap:wrap}
.seg button{border:0;background:transparent;border-radius:10px;padding:.5em .95em;font-weight:700;color:var(--muted)}
.seg button.on{background:var(--ink);color:var(--bg)}
.seg button small{display:block;font-weight:400;font-size:.68rem}
.plist{display:flex;flex-direction:column;gap:.6rem;background:var(--surface);border-radius:20px;padding:1rem}
.prow{display:flex;align-items:center;gap:.7rem;flex-wrap:wrap}
.prow .dot{width:1.1rem;height:1.1rem;border-radius:50%;background:var(--pc);flex:0 0 auto}
.pname{flex:1 1 9rem;min-width:8rem;font:inherit;font-size:1.1rem;padding:.55em .8em;border-radius:12px;border:2px solid var(--line);background:var(--bg);color:var(--ink)}
.x{border:0;background:transparent;color:var(--muted);font-size:1.1rem;padding:.4em}
.note{font-size:.85rem;color:var(--muted);margin:0}
.actions{display:flex;justify-content:space-between;align-items:center;gap:1rem}
.cats{display:flex;flex-wrap:wrap;gap:.5rem}
.catbtn{border:3px solid var(--line);background:var(--surface);border-radius:999px;padding:.45em 1em;font-weight:700;color:var(--ink)}
.catbtn.on{background:var(--cc);border-color:var(--cc);color:#fff}
.catbtn.on.fun{color:#1E1A10}

/* turn + wheel */
.turnwrap{display:grid;grid-template-columns:auto minmax(14rem,26rem);gap:5vw;align-items:center}
.wheelbox{position:relative;width:min(62vh,46vw);aspect-ratio:1}
.wheelbox svg{width:100%;height:100%;display:block}
#wheel{transform-box:fill-box;transform-origin:center}
.pointer{position:absolute;left:50%;top:-4%;transform:translateX(-50%);width:0;height:0;border-left:1.1rem solid transparent;border-right:1.1rem solid transparent;border-top:2rem solid var(--ink);z-index:2;filter:drop-shadow(0 2px 0 var(--bg))}
.wl{font-family:var(--display);font-weight:800;font-size:8px}
.wi{font-size:13px}
.whose{font-family:var(--display);font-weight:800;font-size:clamp(2.2rem,4.6vw,4rem);line-height:1;margin:0 0 .5rem;letter-spacing:-.02em}
.whose::before{content:"";display:inline-block;width:.42em;height:.42em;border-radius:50%;background:var(--pc);margin-right:.25em;vertical-align:.12em}
.sub{color:var(--muted);font-size:1.05rem;margin:.2rem 0}
.pill{display:inline-block;background:var(--surface2);border-radius:999px;padding:.25em .8em;font-weight:700;margin:.3rem .3rem .3rem 0}
.pill.hot{background:var(--gold);color:#1E1A10}
.spinres{font-family:var(--display);font-weight:800;font-size:2.6rem;min-height:1.3em;margin:.9rem 0 1.1rem;color:var(--sc,var(--ink));transform:scale(.6);opacity:0;transition:transform .35s cubic-bezier(.3,1.6,.5,1),opacity .2s}
.spinres.show{transform:none;opacity:1}

/* question */
.qwrap{width:min(100%,64rem);display:flex;flex-direction:column;gap:1rem}
.qhead{display:flex;align-items:center;gap:.6rem;flex-wrap:wrap}
.catpill{background:var(--cc);color:#fff;border-radius:999px;padding:.35em 1em;font-family:var(--display);font-weight:800;font-size:1.05rem}
.catpill.fun{color:#1E1A10}
.tag{border:2px solid var(--line);border-radius:999px;padding:.22em .8em;font-weight:700;font-size:.9rem}
.tag.hot{border-color:var(--gold);color:var(--gold)}
.forwho{color:var(--muted);font-size:1rem;margin-left:auto}
.forwho b{color:var(--ink)}
.qtext{font-family:var(--body);font-weight:700;font-size:clamp(1.7rem,5vh,3.2rem);line-height:1.2;max-width:36ch;border-left:.4rem solid var(--cc);padding-left:1rem}
.qvis{font-size:clamp(4.5rem,13vh,9rem);line-height:1;margin:-.2rem 0 -.3rem}
.timer{height:.55rem;background:var(--surface2);border-radius:999px;overflow:hidden;flex:1}
.timer i{display:block;height:100%;background:var(--cc);transform-origin:left;transition:transform .2s linear}
.tnum{font-family:var(--display);font-weight:800;font-size:1.2rem;color:var(--muted);min-width:2ch;text-align:right}
.answers{display:grid;grid-template-columns:1fr 1fr;gap:.8rem}
.ans{position:relative;display:flex;align-items:center;gap:.9rem;text-align:left;background:var(--surface);border:3px solid var(--line);border-radius:18px;padding:.7em 1em;min-height:4.8rem;font-size:clamp(1.25rem,2.3vw,1.85rem);font-weight:700;color:var(--ink);transition:border-color .15s,background .15s}
.ans .k{flex:0 0 auto;width:2.1rem;height:2.1rem;border-radius:50%;display:grid;place-items:center;background:var(--surface2);font-family:var(--display);font-weight:800;font-size:1.1rem}
.ans:disabled{cursor:default}
.ans.sel{border-color:var(--you);background:color-mix(in srgb,var(--you) 22%,var(--surface));box-shadow:0 0 0 3px color-mix(in srgb,var(--you) 45%,transparent)}
.ans.sel .k{background:var(--you);color:#111}
.ans.locked{animation:throb .5s ease-in-out infinite alternate}
@keyframes throb{to{box-shadow:0 0 0 .5rem color-mix(in srgb,var(--you) 35%,transparent)}}
.ans.out,.ans.gone{opacity:.25}
.ans.out{text-decoration:line-through}
.ans.right{border-color:var(--good);background:color-mix(in srgb,var(--good) 22%,var(--surface))}
.ans.right .k{background:var(--good);color:#fff}
.ans.wrong{border-color:var(--bad);background:color-mix(in srgb,var(--bad) 18%,var(--surface))}
.ans.wrong .k{background:var(--bad);color:#fff}
.answers.tf .ans{justify-content:center;min-height:19vh;font-family:var(--display);font-size:clamp(2rem,4vw,3.2rem)}
.answers.tf .ans .k{display:none}
.slots{display:flex;align-items:stretch;gap:.5rem;flex-wrap:wrap}
.slots .end{align-self:center;font-weight:700;color:var(--muted);font-size:.95rem}
.slot{flex:1 1 8rem;min-height:3.4rem;border:3px dashed var(--line);border-radius:14px;display:flex;align-items:center;gap:.5rem;padding:.4em .7em;font-weight:700;font-size:clamp(.95rem,1.6vw,1.3rem)}
.slot.full{border-style:solid;border-color:var(--you);background:color-mix(in srgb,var(--you) 16%,var(--surface))}
.slot.ok{border-style:solid;border-color:var(--good);background:color-mix(in srgb,var(--good) 18%,var(--surface))}
.slot.no{border-style:solid;border-color:var(--bad)}
.slot .n{font-family:var(--display);font-weight:800;color:var(--muted)}
.ans .badge{position:absolute;top:-.6rem;right:-.6rem;width:2rem;height:2rem;border-radius:50%;background:var(--you);color:#111;display:grid;place-items:center;font-family:var(--display);font-weight:800}
.ans.placed{color:var(--muted);border-style:dashed;background:var(--bg)}
.controls{display:flex;align-items:center;gap:.8rem;flex-wrap:wrap}
.life{display:flex;align-items:center;gap:.5rem;flex-wrap:wrap}
.life .lab{color:var(--muted);font-weight:700}
.spacer{flex:1}
.lockmsg{font-family:var(--display);font-weight:800;font-size:1.5rem;color:var(--gold)}
.panel{display:flex;align-items:center;gap:1.2rem;flex-wrap:wrap;background:var(--surface);border-radius:20px;padding:.9rem 1.2rem;border:3px solid var(--line)}
.panel.good{border-color:var(--good)}
.panel.bad{border-color:var(--bad)}
.panel.steal{border-color:var(--gold)}
.panel .msg{flex:1 1 18rem}
.panel .msg b{display:block;font-family:var(--display);font-size:1.6rem;font-weight:800;line-height:1.1}
.panel .msg span{color:var(--muted);font-size:1.05rem}
.thieves{display:flex;gap:.6rem;flex-wrap:wrap}
.thief{border:3px solid var(--pc);background:var(--surface2);border-radius:999px;padding:.55em 1.2em;font-family:var(--display);font-weight:800;font-size:1.1rem}
.medalpop{width:4.4rem;height:4.4rem;border-radius:50%;background:var(--cc);display:grid;place-items:center;font-size:2.2rem;flex:0 0 auto;box-shadow:0 0 0 .4rem color-mix(in srgb,var(--cc) 35%,transparent);animation:pop .7s cubic-bezier(.3,1.7,.5,1) both}
@keyframes pop{from{transform:scale(0) rotate(-40deg)}to{transform:none}}

/* pick + lists */
.pickwrap{width:min(100%,60rem);display:flex;flex-direction:column;gap:1.2rem}
.pickwrap h2{font-size:clamp(1.9rem,3.6vw,3rem);font-weight:800;letter-spacing:-.02em}
.pickwrap .sub{max-width:54ch}
.center{text-align:center;align-items:center}
.tiles{display:grid;grid-template-columns:repeat(auto-fit,minmax(10rem,1fr));gap:1rem}
.tiles.n5,.tiles.n6{grid-template-columns:repeat(3,1fr)}
.tile{position:relative;border:0;border-radius:22px;background:var(--cc);color:#fff;aspect-ratio:1/1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:.5rem;font-family:var(--display);font-weight:800;font-size:1.3rem}
.tiles.n5 .tile,.tiles.n6 .tile{aspect-ratio:1.7/1}
.tile.fun{color:#1E1A10}
.tile .ic{font-size:3.2rem}
.tiles.n5 .tile .ic,.tiles.n6 .tile .ic{font-size:2.4rem}
.tile:disabled{opacity:.25}
.tile .own{position:absolute;top:.6rem;right:.8rem;font-size:.8rem;background:rgba(0,0,0,.3);color:#fff;border-radius:999px;padding:.15em .6em}
.opps{display:grid;grid-template-columns:repeat(auto-fit,minmax(15rem,1fr));gap:.9rem}
.opp{display:flex;align-items:center;gap:.8rem;background:var(--surface);border:3px solid var(--pc);border-radius:20px;padding:.8rem 1rem;text-align:left}
.opp b{font-family:var(--display);font-size:1.35rem}
.opp.card{flex-direction:column;align-items:flex-start;cursor:default}
.mbtns{display:flex;gap:.5rem;flex-wrap:wrap}
.mbtn{border:0;border-radius:999px;background:var(--cc);color:#fff;padding:.5em 1em;font-weight:700}
.mbtn.fun{color:#1E1A10}
.score{font-family:var(--display);font-weight:800;font-size:clamp(3rem,7vw,5.5rem);letter-spacing:-.03em;line-height:1}

/* showdown */
.sdtitle{font-family:var(--display);font-weight:800;font-size:clamp(3rem,9vw,7rem);letter-spacing:-.04em;line-height:.9;color:var(--gold)}
.sdq{font-weight:700;font-size:clamp(1.6rem,4.6vh,3rem);line-height:1.2;max-width:30ch}
.sdunit{color:var(--muted);font-size:1.1rem}
.entry{display:grid;grid-template-columns:1fr auto;gap:2rem;align-items:center;width:min(100%,60rem)}
.dots{font-family:var(--display);font-weight:800;font-size:3rem;letter-spacing:.3em;min-height:1.3em;color:var(--gold)}
.pad{display:grid;grid-template-columns:repeat(3,5.2rem);gap:.6rem}
.key{height:4.4rem;border-radius:16px;border:0;background:var(--surface2);color:var(--ink);font-family:var(--display);font-weight:800;font-size:1.8rem}
.key.wide{font-size:1.1rem}
.sdlist{display:flex;flex-direction:column;gap:.4rem;width:min(100%,50rem)}
.sdrev{gap:.7rem}
.sdrev .sdq{font-size:clamp(1.15rem,3.4vh,2rem)}
.board.many .chipt b{font-size:.92rem}
.board.many .chip{padding-right:.55rem}
.sdrow{display:flex;align-items:center;gap:1rem;text-align:left;background:var(--surface);border:3px solid var(--line);border-radius:16px;padding:.25rem 1rem;opacity:0;animation:rise .5s ease-out forwards}
.sdrow b{font-family:var(--display);font-size:1.25rem;flex:1}
.sdrow .g{font-family:var(--display);font-weight:800;font-size:1.4rem}
.sdrow .off{color:var(--muted);min-width:9rem;text-align:right}
.sdrow.top1{border-color:var(--gold);background:color-mix(in srgb,var(--gold) 16%,var(--surface))}
.answerbig{font-family:var(--display);font-weight:800;font-size:clamp(2.4rem,9vh,5rem);color:var(--gold);line-height:1}
.later{opacity:0;animation:rise .5s ease-out forwards}
@keyframes rise{from{opacity:0;transform:translateY(.8rem)}to{opacity:1;transform:none}}

/* win */
.win{text-align:center;display:flex;flex-direction:column;align-items:center;gap:1rem}
.win h2{font-size:clamp(2.6rem,6vw,5rem);font-weight:800;letter-spacing:-.03em}
#confetti{position:fixed;inset:0;pointer-events:none;z-index:5}

/* overlays */
.overlay{position:fixed;inset:0;background:rgba(6,10,24,.7);display:grid;place-items:center;z-index:10;padding:1rem}
.sheet{background:var(--surface);border-radius:24px;padding:1.5rem;width:min(100%,34rem);max-height:90%;overflow:auto;display:flex;flex-direction:column;gap:.6rem}
.sheet h2{font-size:1.7rem;font-weight:800;margin-bottom:.2rem}
.sheet h3{font-size:1rem;color:var(--muted);margin-top:.5rem}
.sheet .ghost,.sheet .btn{width:100%}
.rotate{display:none;position:fixed;inset:0;z-index:30;background:var(--bg);flex-direction:column;align-items:center;justify-content:center;gap:1rem;text-align:center;padding:2rem}
.rotate .ic{font-size:5rem;animation:tilt 1.6s ease-in-out infinite alternate}
@keyframes tilt{from{transform:rotate(0)}to{transform:rotate(-90deg)}}
@media (orientation:portrait){ body.ingame .rotate{display:flex} }
.toast{position:fixed;left:50%;bottom:calc(1.5rem + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:.7em 1.3em;border-radius:999px;font-weight:700;z-index:20;max-width:90vw;text-align:center}

@media (orientation:portrait){
  .turnwrap,.home,.entry{grid-template-columns:1fr;justify-items:center;text-align:center}
  .home p{margin-left:auto;margin-right:auto}
  .home .row{justify-content:center}
  .wheelbox{width:min(80vw,46vh)}
  .tiles,.tiles.n5,.tiles.n6{grid-template-columns:1fr 1fr}
  .answers{grid-template-columns:1fr}
}
@media (prefers-reduced-motion: reduce){ .bob,.medalpop,.ans.locked,.rotate .ic{animation:none} .sdrow,.later{animation-duration:.01s} }
</style>

let ac=null;
function tone(f,d,type='sine',when=0,vol=.12){
  if(!prefs.sound)return;
  try{ac=ac||new (window.AudioContext||window.webkitAudioContext)();if(ac.state==='suspended')ac.resume();
    const t=ac.currentTime+when,o=ac.createOscillator(),g=ac.createGain();
    o.type=type;o.frequency.value=f;g.gain.setValueAtTime(vol,t);g.gain.exponentialRampToValueAtTime(.0001,t+d);
    o.connect(g).connect(ac.destination);o.start(t);o.stop(t+d+.05);}catch(e){}
}
function sfx(k){
  if(k==='good'){tone(660,.15,'triangle');tone(990,.28,'triangle',.12)}
  else if(k==='bad'){tone(240,.3,'square',0,.05);tone(170,.45,'square',.15,.05)}
  else if(k==='medal'){[523,659,784,1047].forEach((f,i)=>tone(f,.3,'triangle',i*.1))}
  else if(k==='land'){tone(880,.12)}
  else if(k==='tap'){tone(520,.05,'sine',0,.05)}
  else if(k==='drum'){for(let i=0;i<10;i++)tone(140+i*8,.06,'triangle',i*.11,.09)}
  else if(k==='sd'){[392,523,659,784].forEach((f,i)=>tone(f,.22,'square',i*.12,.05))}
  else if(k==='win'){[523,659,784,1047,784,1047].forEach((f,i)=>tone(f,.35,'triangle',i*.13))}
}

function arc(r1,r2,a0,a1){
  const rad=a=>(a-90)*Math.PI/180, pt=(r,a)=>[(r*Math.cos(rad(a))).toFixed(2),(r*Math.sin(rad(a))).toFixed(2)];
  const [x0,y0]=pt(r2,a0),[x1,y1]=pt(r2,a1),[x2,y2]=pt(r1,a1),[x3,y3]=pt(r1,a0);
  return `M${x0} ${y0}A${r2} ${r2} 0 0 1 ${x1} ${y1}L${x2} ${y2}A${r1} ${r1} 0 0 0 ${x3} ${y3}Z`;
}
function ringSVG(p,size){

  let s=`<svg class="ring" width="${size}" height="${size}" viewBox="-50 -50 100 100" role="img" aria-label="${medalCount(p)} of ${CATS.length} medals">`;
  CATS.forEach((c,i)=>{
    const a0=i*st+4,a1=(i+1)*st-4,has=p.medals[c.id],f=has?1:p.progress[c.id]/S.target;
    s+=`<path d="${arc(27,47,a0,a1)}" fill="var(--${c.id})" opacity="${has?1:.18}"/>`;
    if(!has&&f>0)s+=`<path d="${arc(27,27+20*f,a0,a1)}" fill="var(--${c.id})" opacity=".9"/>`;
  });
  return s+`<text class="ringn" y="10" text-anchor="middle">${medalCount(p)}</text></svg>`;
}

  if(t==='order'){let items=it.slice(4).map((x,r)=>({t:x,rank:r}));do{items=shuffle(items)}while(items.every((x,i)=>x.rank===i));
    return {type:'order',text:it[1],vis:null,from:it[2],to:it[3],items};}
  const [raw,...ans]=it,order=shuffle([0,1,2,3]),[text,vis]=raw.split('||');
  return {type:'mc',text,vis:vis||null,options:order.map(o=>ans[o]),correct:order.indexOf(0)};
}
function drawQ(cat,level,types){
  types=types||['mc','tf','order'];
  const pool=QB[cat][level],key=cat+'.'+level,ok=i=>types.includes(qtype(pool[i]));
  let used=seen[key]||[],avail=pool.map((_,i)=>i).filter(i=>ok(i)&&!used.includes(i));
  if(!avail.length){used=used.filter(i=>!ok(i));avail=pool.map((_,i)=>i).filter(ok)}
  const idx=avail[Math.floor(Math.random()*avail.length)];
  used.push(idx);seen[key]=used;store.set(SEEN,seen);
  return parseQ(pool[idx]);
}
function askQuestion(ctx){
  const types=ctx.kind==='final'?['mc']:ctx.kind==='steal-medal'?['mc','order']:null;
  S.q={...ctx,...drawQ(ctx.cat,ctx.level,types),sel:null,seq:[],removed:[],disabled:[],locked:false,done:false,ok:null,msg:null,next:null,timeout:false};
  setDeadline();snap=null;S.phase='question';render();
}
function setDeadline(){
  const q=S.q;
  if(S.settings.timer){const secs=S.settings.timer+(q.type==='order'?15:0);q.total=secs*1000;q.deadline=Date.now()+q.total}else q.deadline=null;
}
const isRight=q=>q.type==='order'?q.seq.length===q.items.length&&q.seq.every((ix,pos)=>q.items[ix].rank===pos):q.sel===q.correct;
const rightText=q=>q.type==='order'?q.items.slice().sort((a,b)=>a.rank-b.rank).map(x=>x.t).join(', '):q.options[q.correct];
const canLock=q=>q.type==='order'?q.seq.length===q.items.length:q.sel!==null;

/* ---------- Game setup ---------- */
function newGame(d){
  setCats(d.cats);
  const noun=d.mode==='teams'?'Team':'Player',zero=v=>Object.fromEntries(d.cats.map(id=>[id,v]));
  S={settings:{mode:d.mode,length:d.length,timer:+d.timer},cats:d.cats.slice(),target:d.length==='quick'?2:3,
    players:d.players.map((p,i)=>({id:'p'+i,name:(p.name.trim()||`${noun} ${i+1}`),level:p.level,color:PCOLORS[i],progress:zero(0),medals:zero(false),life:LEVELS[p.level].life})),
    turn:Math.floor(Math.random()*d.players.length),streak:0,turnsTaken:0,phase:'turn',q:null,ch:null,sd:null,pickFor:null,note:null,winner:null};
  view='game';keepAwake();beginTurn();
}
function gain(p,cat,n){
  const c=CAT[cat].name;
  if(p.medals[cat])return {t:`${p.name} already has the ${c} medal.`};
  p.progress[cat]=Math.min(S.target,p.progress[cat]+n);
  if(p.progress[cat]>=S.target){p.medals[cat]=true;return {t:`${p.name} wins the ${c} medal!`,medal:cat}}
  const left=S.target-p.progress[cat];
  return {t:`+${n} ${c}. ${left} more right answer${left>1?'s':''} wins the medal.`};
}
/* medals can only be stolen from players at your level or harder */
function stealTargets(p){
  const out=[];
  S.players.forEach(o=>{if(o.id===p.id||LEVELS[o.level].rank<LEVELS[p.level].rank)return;CATS.forEach(c=>{if(o.medals[c.id]&&!p.medals[c.id])out.push({id:o.id,cat:c.id})})});
  return out;
}
/* missed questions can be stolen by players at the same level or easier */
const thievesFor=q=>S.players.filter(p=>p.id!==q.playerId&&LEVELS[p.level].rank<=LEVELS[q.level].rank);

/* ---------- Answering: select, lock in, reveal ---------- */
function choose(i){
  const q=S.q;if(S.phase!=='question'||q.locked)return;
  if(q.type==='order'){const k=q.seq.indexOf(i);if(k>=0)q.seq.splice(k,1);else q.seq.push(i)}
  else{if(q.removed.includes(i)||q.disabled.includes(i))return;q.sel=q.sel===i?null:i}
  sfx('tap');render();
}
function lockIn(){
  const q=S.q;if(S.phase!=='question'||q.locked||!canLock(q))return;
  q.locked=true;stopTimer();render();sfx('drum');
  clearTimeout(lockTimer);lockTimer=setTimeout(resolve,1300);
}
function resolve(){
  const q=S.q;if(!q||q.done)return;
  q.locked=false;snap=JSON.stringify(S);
  applyResult(isRight(q));
}
function applyResult(ok){
  const q=S.q,who=byId(q.playerId),ans=rightText(q),miss=q.timeout?'Time’s up':'Not this time';
  q.done=true;q.ok=ok;
  if(q.kind==='normal'||q.kind==='double'){
    if(ok){const g=gain(who,q.cat,q.kind==='double'?2:1);S.streak++;q.msg={tone:'good',head:'Correct!',t:g.t,medal:g.medal};q.next=(S.streak<3&&!hasAll(who))?'again':'pass';S.phase='reveal'}
    else if(q.type==='mc'&&thievesFor(q).length){if(q.sel!==null)q.disabled.push(q.sel);q.sel=null;q.missedBy=who.id;q.done=false;q.ok=null;S.phase='steal-offer'}
    else{q.msg={tone:'bad',head:miss,t:`The answer: ${ans}.`};q.next='pass';S.phase='reveal'}
  }else if(q.kind==='steal-open'){
    if(ok){const g=gain(who,q.cat,1);q.msg={tone:'good',head:`${who.name} stole it!`,t:g.t,medal:g.medal}}
    else q.msg={tone:'bad',head:'Nobody got it',t:`The answer: ${ans}.`};
    q.next='pass';S.phase='reveal';
  }else if(q.kind==='steal-medal'){
    const t=byId(q.targetId),c=CAT[q.cat].name;
    if(ok){t.medals[q.cat]=false;t.progress[q.cat]=Math.max(0,S.target-1);who.medals[q.cat]=true;who.progress[q.cat]=S.target;
      q.msg={tone:'good',head:'Medal stolen!',t:`${who.name} takes the ${c} medal from ${t.name}. ${t.name} needs one right answer to win it back.`,medal:q.cat}}
    else q.msg={tone:'bad',head:'Steal failed',t:`${t.name} keeps the ${c} medal. The answer: ${ans}.`};
    q.next='pass';S.phase='reveal';
  }else if(q.kind==='challenge'){
    if(ok)S.ch.scores[who.id]++;S.ch.round++;
    q.msg={tone:ok?'good':'bad',head:ok?'Correct!':miss,t:ok?`${who.name} scores a point.`:`The answer: ${ans}.`};
    q.next='challenge';S.phase='reveal';
  }else if(q.kind==='final'){
    if(ok){S.winner=who.id;q.msg={tone:'good',head:'Champion!',t:`${who.name} answered the final question.`};q.next='win'}
    else{q.msg={tone:'bad',head:'So close',t:`The answer: ${ans}. ${who.name} gets a new final question next turn.`};q.next='pass'}
    S.phase='reveal';
  }
  if(S.phase==='reveal'){sfx(ok?'good':'bad');if(q.msg.medal)setTimeout(()=>sfx('medal'),350)}else sfx('bad');
  render();
}
function startSteal(pid){
  const q=S.q;q.kind='steal-open';q.playerId=pid;q.sel=null;q.locked=false;q.timeout=false;
  setDeadline();snap=null;S.phase='question';render();
}
function noSteal(){const q=S.q;q.done=true;q.ok=false;q.msg={tone:'bad',head:'No steal',t:`The answer: ${rightText(q)}.`};q.next='pass';S.phase='reveal';render()}

/* ---------- Lifelines ---------- */
const canLife=q=>q&&S.phase==='question'&&!q.locked&&q.kind!=='steal-open'&&byId(q.playerId).life>0;
function fifty(){
  const q=S.q;if(!canLife(q)||q.type!=='mc'||q.removed.length)return;
  q.removed=shuffle([0,1,2,3].filter(i=>i!==q.correct&&!q.disabled.includes(i))).slice(0,2);
  if(q.removed.includes(q.sel))q.sel=null;
  byId(q.playerId).life--;sfx('tap');render();
}
function swapQ(){
  const q=S.q;if(!canLife(q))return;
  byId(q.playerId).life--;
  askQuestion({kind:q.kind,cat:q.cat,level:q.level,playerId:q.playerId,targetId:q.targetId});
}

/* ---------- Referee (menu) ---------- */
const canReferee=()=>snap&&S.q&&(S.phase==='reveal'||S.phase==='steal-offer');
function referee(ok){S=JSON.parse(snap);menuOpen=false;applyResult(ok)}
function redo(){
  const old=JSON.parse(snap),q=old.q;S=old;menuOpen=false;
  askQuestion({kind:q.kind,cat:q.cat,level:q.level,playerId:q.playerId,targetId:q.targetId});
}

/* ---------- Turns ---------- */
const showdownEvery=()=>S.players.length*(S.players.length<=2?2:1);
const turnsToShowdown=()=>showdownEvery()-(S.turnsTaken%showdownEvery());
function beginTurn(){const p=cur();S.q=null;S.note=null;if(hasAll(p)){S.pickFor='final';S.phase='pick'}else S.phase='turn';render()}
function nextTurn(){
  S.turn=(S.turn+1)%S.players.length;S.streak=0;S.ch=null;S.q=null;snap=null;S.turnsTaken++;
  if(S.turnsTaken%showdownEvery()===0)startShowdown();else beginTurn();
}
function proceed(){
  const n=S.q&&S.q.next;
  if(n==='again'){S.q=null;snap=null;S.phase='turn';render()}
  else if(n==='pass')nextTurn();
  else if(n==='challenge'){S.q=null;snap=null;if(S.ch.round<S.ch.total){S.phase='challenge-handoff';render()}else resolveChallenge()}
  else if(n==='win'){snap=null;S.phase='win';sfx('win');render()}
}
function landed(seg){
  const p=cur();
  if(CAT[seg]){
    if(p.medals[seg]){S.note=`You already have the ${CAT[seg].name} medal, so pick one you still need.`;S.pickFor='normal';S.phase='pick';return render()}
    return askQuestion({kind:'normal',cat:seg,level:p.level,playerId:p.id});
  }
  if(seg==='pick'||seg==='double'){S.pickFor=seg==='pick'?'normal':'double';S.phase='pick';return render()}
  if(seg==='steal'){
    if(stealTargets(p).length){S.phase='steal-target';return render()}
    S.note='There’s no medal you can steal yet, so pick any category.';S.pickFor='normal';S.phase='pick';return render();
  }
  if(seg==='challenge'){S.phase='challenge-opp';return render()}
}
function pickCat(cat){
  const p=cur(),f=S.pickFor;S.note=null;
  if(f==='normal'||f==='double')askQuestion({kind:f,cat,level:p.level,playerId:p.id});
  else if(f==='final')askQuestion({kind:'final',cat,level:p.level,playerId:p.id});
  else if(f==='challenge'){S.ch.cat=cat;S.phase='challenge-handoff';render()}
  else if(f==='sd'){
    const w=byId(S.sd.cur),g=gain(w,cat,S.sd.pts);toast(g.t);if(g.medal)sfx('medal');else sfx('good');
    sdNextPick();
  }
}
const chPlayer=()=>S.ch.round%2===0?S.ch.a:S.ch.b;
function resolveChallenge(){
  const {a,b,cat}=S.ch,A=byId(a),B=byId(b),sa=S.ch.scores[a],sb=S.ch.scores[b];
  let head,t='';S.ch.medal=null;
  if(sa===sb){head=`Tie, ${sa}–${sb}`;t='Nobody gains or loses anything.'}
  else{
    const W=sa>sb?A:B,L=sa>sb?B:A,g=gain(W,cat,1);head=`${W.name} wins ${Math.max(sa,sb)}–${Math.min(sa,sb)}`;t=g.t;
    if(!L.medals[cat]&&L.progress[cat]>0){L.progress[cat]--;t+=` ${L.name} drops a ${CAT[cat].name} point.`}
    if(g.medal){S.ch.medal=g.medal;setTimeout(()=>sfx('medal'),300)}
  }
  S.ch.head=head;S.ch.result=t;S.phase='challenge-result';render();
}

/* ---------- Showdown: everyone guesses a number, closest wins ---------- */
function startShowdown(){
  const key='sd';let used=seen[key]||[],avail=SHOWDOWN.map((_,i)=>i).filter(i=>!used.includes(i));
  if(!avail.length){used=[];avail=SHOWDOWN.map((_,i)=>i)}
  const idx=avail[Math.floor(Math.random()*avail.length)];used.push(idx);seen[key]=used;store.set(SEEN,seen);
  const [text,answer,unit,lo,hi]=SHOWDOWN[idx],n=S.players.length;
  S.sd={text,answer,unit,lo,hi,order:Array.from({length:n},(_,k)=>S.players[(S.turn+k)%n].id),idx:0,guesses:{},entry:'',queue:[],cur:null,pts:1};
  S.phase='sd-intro';sfx('sd');render();
}
function sdKey(k){
  const sd=S.sd;if(S.phase!=='sd-entry')return;
  if(k==='del')sd.entry=sd.entry.slice(0,-1);
  else if(sd.entry.length<9&&!(sd.entry===''&&k==='0'))sd.entry+=k;
  sfx('tap');render();
}
function sdLock(){
  const sd=S.sd;if(S.phase!=='sd-entry'||sd.entry==='')return;
  sd.guesses[sd.order[sd.idx]]=+sd.entry;sd.entry='';sd.idx++;
  sfx('tap');S.phase=sd.idx<sd.order.length?'sd-pass':'sd-reveal';render();
}
function sdResults(){
  const sd=S.sd,rows=sd.order.map(id=>({id,g:sd.guesses[id],d:Math.abs(sd.guesses[id]-sd.answer)}));
  const best=Math.min(...rows.map(r=>r.d));
  rows.forEach(r=>r.win=r.d===best);
  return {rows:rows.sort((x,y)=>y.d-x.d),best};
}
function sdContinue(){
  const sd=S.sd,{rows,best}=sdResults();
  sd.pts=best===0?2:1;
  sd.queue=rows.filter(r=>r.win&&!hasAll(byId(r.id))).map(r=>r.id);
  sdNextPick();
}
function sdNextPick(){
  const sd=S.sd;
  if(sd.queue.length){sd.cur=sd.queue.shift();S.pickFor='sd';S.phase='pick';render()}
  else{S.sd=null;beginTurn()}
}

/* ---------- Spin ---------- */
function spin(){
  if(spinning||S.phase!=='turn')return;
  spinning=true;
  const W=360/SEGS.length,idx=Math.floor(Math.random()*SEGS.length),center=idx*W+W/2,target=(360-center)%360,now=((wheelRot%360)+360)%360;
  const reduce=matchMedia('(prefers-reduced-motion: reduce)').matches,dur=reduce?900:3600;
  wheelRot+=(reduce?1:5)*360+((target-now+360)%360);
  const w=$('#wheel');w.style.transition=`transform ${dur}ms cubic-bezier(.15,.7,.2,1)`;w.style.transform=`rotate(${wheelRot}deg)`;
  const b=$('[data-act="spin"]');if(b)b.disabled=true;
  tone(300,.05,'sine',0,.04);
  setTimeout(()=>{
    const seg=SEGS[idx],info=CAT[seg]||SPECIAL[seg],r=$('#spinResult');
    if(r){r.textContent=`${info.icon} ${info.name}`;r.style.setProperty('--sc',catColor(seg));r.classList.add('show')}
    sfx('land');
    setTimeout(()=>{spinning=false;landed(seg)},1200);
  },dur);
}

/* ---------- Timer (pauses while the iPad is in portrait) ---------- */
function stopTimer(){clearInterval(timerInt);timerInt=null}
function startTimer(){
  stopTimer();if(!S||S.phase!=='question'||!S.q.deadline||S.q.locked)return;
  const tick=()=>{
    const q=S.q;if(!q||S.phase!=='question'){stopTimer();return}
    if(portrait()||menuOpen)q.deadline+=200;
    const left=q.deadline-Date.now(),bar=$('#tbar'),n=$('#tnum');
    if(bar)bar.style.transform=`scaleX(${Math.max(0,left/q.total)})`;if(n)n.textContent=Math.max(0,Math.ceil(left/1000));
    if(left<=0){stopTimer();if(canLock(q))lockIn();else{q.timeout=true;resolve()}}
  };
  tick();timerInt=setInterval(tick,200);
}

function turnHTML(){
  const p=cur(),soon=turnsToShowdown()===1;
  return `<div class="turnwrap"><div class="wheelbox"><div class="pointer"></div>${wheelSVG()}</div>
  <div style="--pc:${p.color}"><p class="whose">${esc(poss(p.name))} turn</p>
  ${S.streak?`<span class="pill">Bonus spin ${S.streak+1} of 3</span>`:''}${soon?'<span class="pill hot">Showdown after this turn</span>':''}
  <p class="sub">${LEVELS[p.level].name} questions. ${medalCount(p)} of ${CATS.length} medals. ${p.life} lifeline${p.life===1?'':'s'} left.</p>
  <div id="spinResult" class="spinres"></div>
  <button class="btn big" data-act="spin">Spin the wheel</button></div></div>`;
}
function choicesHTML(q,reveal,offer){
  return `<div class="answers ${q.type}">${q.options.map((o,i)=>{
    let cls='ans';
    if(q.disabled.includes(i))cls+=' out';
    if(q.removed.includes(i))cls+=' gone';
    if(reveal){if(i===q.correct)cls+=' right';else if(i===q.sel)cls+=' wrong'}
    else if(q.sel===i){cls+=' sel';if(q.locked)cls+=' locked'}
    const dis=reveal||offer||q.locked||q.disabled.includes(i)||q.removed.includes(i);
    return `<button class="${cls}" data-act="opt" data-i="${i}" ${dis?'disabled':''}><span class="k">${'ABCD'[i]}</span>${esc(o)}</button>`;
  }).join('')}</div>`;
}
function orderHTML(q,reveal){
  if(reveal){
    const sorted=q.items.map((x,i)=>({...x,i})).sort((a,b)=>a.rank-b.rank);
    return `<div class="slots"><span class="end">${esc(q.from)}</span>${sorted.map((x,pos)=>{const good=q.seq[pos]!==undefined&&q.items[q.seq[pos]].rank===pos;
      return `<div class="slot ${good?'ok':'no'}"><span class="n">${good?'✓':'✗'}</span>${esc(x.t)}</div>`}).join('')}<span class="end">${esc(q.to)}</span></div>`;
  }
  const slots=[0,1,2,3].map(pos=>{const ix=q.seq[pos];return ix===undefined?`<div class="slot"><span class="n">${pos+1}</span></div>`:`<div class="slot full"><span class="n">${pos+1}</span>${esc(q.items[ix].t)}</div>`}).join('');
  return `<div class="slots"><span class="end">${esc(q.from)}</span>${slots}<span class="end">${esc(q.to)}</span></div>
  <div class="answers">${q.items.map((x,i)=>{const pos=q.seq.indexOf(i);
    return `<button class="ans ${pos>=0?'placed':''} ${q.locked&&pos>=0?'locked':''}" data-act="opt" data-i="${i}" ${q.locked?'disabled':''}>${pos>=0?`<span class="badge">${pos+1}</span>`:''}${esc(x.t)}</button>`}).join('')}</div>`;
}
function controlsHTML(q){
  if(q.locked)return `<div class="controls"><span class="lockmsg">Locked in…</span></div>`;
  const who=byId(q.playerId),lifeOK=q.kind!=='steal-open';
  const life=lifeOK?`<div class="life"><span class="lab">🛟 ${who.life} left</span>
    <button class="ghost" data-act="fifty" ${who.life>0&&q.type==='mc'&&!q.removed.length?'':'disabled'}>50:50</button>
    <button class="ghost" data-act="swap" ${who.life>0?'':'disabled'}>Swap</button></div>`:'';
  const clear=q.type==='order'&&q.seq.length?'<button class="ghost" data-act="clear">Clear</button>':'';
  return `<div class="controls">${life}<span class="spacer"></span>${clear}<button class="btn go big" data-act="lock" ${canLock(q)?'':'disabled'}>Lock it in</button></div>`;
}
function questionHTML(){
  const q=S.q,c=CAT[q.cat],who=byId(q.playerId),reveal=S.phase==='reveal',offer=S.phase==='steal-offer',live=S.phase==='question';
  const kindTag={double:'Double points','steal-open':'Steal attempt','steal-medal':`Medal steal from ${q.targetId?esc(byId(q.targetId).name):''}`,final:'Final question',
    challenge:S.ch?`Challenge, question ${Math.floor((S.ch.round-(reveal?1:0))/2)+1} of ${S.ch.total/2}`:''}[q.kind];
  const fmtTag={tf:'True or false',order:'Put in order'}[q.type];
  let bottom='';
  if(reveal){
    const m=q.msg,labels={again:'Spin again',pass:`Pass to ${esc(nextName())}`,challenge:S.ch&&S.ch.round>=S.ch.total?'See who won':'Next question',win:'Celebrate'};
    bottom=`<div class="panel ${m.tone}">${m.medal?`<div class="medalpop" style="--cc:var(--${m.medal})">${CAT[m.medal].icon}</div>`:''}
      <div class="msg"><b>${esc(m.head)}</b><span>${esc(m.t)}</span></div><button class="btn big" data-act="next">${labels[q.next]}</button></div>`;
  }else if(offer){
    bottom=`<div class="panel steal"><div class="msg"><b>${esc(byId(q.missedBy).name)} missed. Steal it?</b><span>First to call it gets the iPad. A right answer earns a ${c.name} point.</span></div>
      <div class="thieves">${thievesFor(q).map(p=>`<button class="thief" style="--pc:${p.color}" data-act="thief" data-id="${p.id}">${esc(p.name)}</button>`).join('')}<button class="ghost" data-act="nosteal">No steal</button></div></div>`;
  }else bottom=controlsHTML(q);
  return `<div class="qwrap" style="--cc:var(--${q.cat});--you:${who.color}">
    <div class="qhead"><span class="catpill ${q.cat}">${c.icon} ${c.name}</span>${kindTag?`<span class="tag hot">${kindTag}</span>`:''}${fmtTag?`<span class="tag">${fmtTag}</span>`:''}
    <span class="forwho">For <b>${esc(who.name)}</b>, ${LEVELS[q.level].name} level</span></div>
    ${q.vis?`<div class="qvis" role="img" aria-label="Picture for the question">${q.vis}</div>`:''}
    <h2 class="qtext">${esc(q.text)}</h2>
    ${live&&q.deadline&&!q.locked?`<div style="display:flex;align-items:center;gap:.8rem"><div class="timer"><i id="tbar"></i></div><span class="tnum" id="tnum"></span></div>`:''}
    ${q.type==='order'?orderHTML(q,reveal):choicesHTML(q,reveal,offer)}
    ${bottom}</div>`;
}
function pickHTML(){
  const p=cur(),f=S.pickFor,sdw=f==='sd'?byId(S.sd.cur):null,owner=sdw||p;
  const head={normal:['Pick a category',S.note||`${esc(p.name)} chooses a category they still need.`],
    double:['Double points',`${esc(p.name)}, pick a category. A right answer counts twice.`],
    final:[`${esc(poss(p.name))} final question`,`${esc(p.name)} has every medal. Everyone else: choose the category. Get it right and ${esc(p.name)} wins.`],
    challenge:['Challenge category',`${esc(p.name)} picks the category for the challenge with ${esc(S.ch?byId(S.ch.b).name:'')}.`],
    sd:[`${esc(sdw?sdw.name:'')} wins the showdown!`,`Pick a category for ${S.sd&&S.sd.pts===2?'two free points (exactly right!)':'a free point'}.`]}[f];
  const blockOwned=f==='normal'||f==='double'||f==='sd';
  return `<div class="pickwrap"><h2>${head[0]}</h2><p class="sub">${head[1]}</p>
  <div class="tiles n${CATS.length}">${CATS.map(c=>{const own=owner.medals[c.id];
    return `<button class="tile ${c.id}" style="--cc:var(--${c.id})" data-act="choose" data-c="${c.id}" ${blockOwned&&own?'disabled':''}><span class="ic">${c.icon}</span>${c.name}${f!=='final'&&own?'<span class="own">Medal won</span>':''}</button>`}).join('')}</div></div>`;
}
function stealTargetHTML(){
  const p=cur(),by={};
  stealTargets(p).forEach(x=>(by[x.id]=by[x.id]||[]).push(x.cat));
  return `<div class="pickwrap"><h2>🧲 Steal a medal</h2><p class="sub">${esc(p.name)}, pick a medal you don’t have yet. You’ll get a ${LEVELS[nextLevel(p.level)].name}-level question. Get it right and the medal is yours.</p>
  <div class="opps">${Object.keys(by).map(id=>{const o=byId(id);return `<div class="opp card" style="--pc:${o.color}"><div style="display:flex;align-items:center;gap:.7rem">${ringSVG(o,52)}<b>${esc(o.name)}</b></div>
    <div class="mbtns">${by[id].map(c=>`<button class="mbtn ${c}" style="--cc:var(--${c})" data-act="stealmedal" data-id="${id}" data-c="${c}">${CAT[c].icon} ${CAT[c].name}</button>`).join('')}</div></div>`}).join('')}</div></div>`;
}
function challengeOppHTML(){
  const p=cur(),opps=S.players.filter(o=>o.id!==p.id),n=S.target===2?2:3;
  return `<div class="pickwrap"><h2>⚔️ Challenge</h2><p class="sub">${esc(p.name)}, who do you challenge? You each answer ${n} questions at your own level. The winner gets a point in the category and the loser drops one.</p>
  <div class="opps">${opps.map(o=>`<button class="opp" style="--pc:${o.color}" data-act="opp" data-id="${o.id}">${ringSVG(o,52)}<b>${esc(o.name)}</b></button>`).join('')}</div></div>`;
}
function challengeHandoffHTML(){
  const ch=S.ch,A=byId(ch.a),B=byId(ch.b),who=byId(chPlayer()),c=CAT[ch.cat];
  return `<div class="pickwrap center"><span class="catpill ${ch.cat}" style="--cc:var(--${ch.cat})">${c.icon} ${c.name} challenge</span>
  <p class="score">${esc(A.name)} ${ch.scores[A.id]}–${ch.scores[B.id]} ${esc(B.name)}</p>
  <h2 style="--pc:${who.color}" class="whose">Pass to ${esc(who.name)}</h2>
  <p class="sub">Question ${Math.floor(ch.round/2)+1} of ${ch.total/2}</p>
  <button class="btn big" data-act="chq">Show ${esc(poss(who.name))} question</button></div>`;
}
function challengeResultHTML(){
  const ch=S.ch;
  return `<div class="pickwrap center">${ch.medal?`<div class="medalpop" style="--cc:var(--${ch.medal})">${CAT[ch.medal].icon}</div>`:''}
  <h2>${esc(ch.head)}</h2><p class="sub">${esc(ch.result)}</p><button class="btn big" data-act="pass">Pass to ${esc(nextName())}</button></div>`;
}
const sdQ=sd=>`<p class="sdq">${esc(sd.text)}</p><p class="sdunit">${sd.unit?`Answer in ${esc(sd.unit)}. `:''}Somewhere between ${fmt(sd.lo)} and ${fmt(sd.hi)}.</p>`;
function sdIntroHTML(){
  return `<div class="pickwrap center"><div class="sdtitle">Showdown!</div>
  <p class="sub">Everyone plays. Closest guess wins a free point in any category. Exactly right wins two.</p>
  ${sdQ(S.sd)}<button class="btn big go" data-act="sdstart">Start guessing</button></div>`;
}
function sdPassHTML(){
  const sd=S.sd,who=byId(sd.order[sd.idx]);
  return `<div class="pickwrap center"><p class="sub">Showdown guess ${sd.idx+1} of ${sd.order.length}</p>
  <h2 class="whose" style="--pc:${who.color}">Pass to ${esc(who.name)}</h2>
  <p class="sub">Hold the iPad so nobody can see your fingers. The TV only shows dots.</p>
  <button class="btn big" data-act="sdready">I’m ${esc(who.name)}: enter my guess</button></div>`;
}
function sdEntryHTML(){
  const sd=S.sd,who=byId(sd.order[sd.idx]);
  const keys=['1','2','3','4','5','6','7','8','9','del','0','ok'].map(k=>k==='del'?'<button class="key wide" data-act="key" data-k="del">Delete</button>':k==='ok'?`<button class="key wide" data-act="sdlock" ${sd.entry?'':'disabled'}>Lock in</button>`:`<button class="key" data-act="key" data-k="${k}">${k}</button>`).join('');
  return `<div class="entry" style="--pc:${who.color}"><div><p class="whose" style="font-size:2rem">${esc(poss(who.name))} secret guess</p>${sdQ(sd)}
    <div class="dots" aria-live="polite">${sd.entry?'•'.repeat(sd.entry.length):'&nbsp;'}</div></div><div class="pad">${keys}</div></div>`;
}
function sdRevealHTML(){
  const sd=S.sd,{rows,best}=sdResults(),step=.8;
  return `<div class="pickwrap center sdrev"><p class="sdq">${esc(sd.text)}</p>
  <div class="answerbig later">${fmt(sd.answer)} <span style="font-size:.35em;color:var(--muted)">${esc(sd.unit)}</span></div>
  <div class="sdlist">${rows.map((r,i)=>{const p=byId(r.id);return `<div class="sdrow ${r.win?'top1':''}" style="--pc:${p.color};animation-delay:${(i+1)*step}s"><span class="pc"></span><b>${esc(p.name)}${r.win?' 🏆':''}</b><span class="g">${fmt(r.g)}</span><span class="off">${r.d===0?'Exactly right!':'off by '+fmt(r.d)}</span></div>`}).join('')}</div>
  <div class="later" style="animation-delay:${(rows.length+1)*step}s"><button class="btn big go" data-act="sdcont">${best===0?'Bullseye! Claim two points':'Claim the point'}</button></div></div>`;
}
function winHTML(){
  const w=byId(S.winner);
  return `<div class="win">${WINLOGO}<h2 style="--pc:${w.color}">${esc(w.name)} is the Orca-Mania champion!</h2><div style="display:flex;align-items:center;gap:.8rem">${ringSVG(w,64)}<p class="sub">Every medal and the final question.</p></div>
  <div style="display:flex;gap:.8rem;flex-wrap:wrap;justify-content:center"><button class="btn big" data-act="again">Play again</button><button class="ghost" data-act="setup">Change players</button></div></div>`;
}
function menuHTML(){
  const q=S.q,ref=canReferee();
  return `<div class="overlay" data-act="closemenu"><div class="sheet" data-stop="1"><h2>Game menu</h2>
  <button class="btn" data-act="closemenu">Back to the game</button>
  ${ref?`<h3>Referee</h3>
    ${q.ok===true?'<button class="ghost" data-act="refwrong">Count that answer as wrong</button>':'<button class="ghost" data-act="refright">Count that answer as right</button>'}
    ${q.kind!=='steal-open'?'<button class="ghost" data-act="redo">Mis-tap: replay with a new question</button>':''}`:''}
  <h3>Game</h3>
  <button class="ghost" data-act="rulesgame">How to play</button>
  <button class="ghost" data-act="sound">Sound: ${prefs.sound?'on':'off'}</button>
  <button class="ghost" data-act="endgame" style="border-color:var(--bad);color:var(--bad)">${confirmEnd?'Tap again to end the game':'End game'}</button></div></div>`;
}

/* ---------- Render ---------- */
function turnColor(){
  if(!S||view!=='game')return 'transparent';
  if(S.q&&['question','reveal'].includes(S.phase))return byId(S.q.playerId).color;
  if(S.sd&&['sd-pass','sd-entry'].includes(S.phase))return byId(S.sd.order[S.sd.idx]).color;
  if(S.phase==='pick'&&S.pickFor==='sd')return byId(S.sd.cur).color;
  if(S.phase==='challenge-handoff')return byId(chPlayer()).color;
  if(['sd-intro','sd-reveal','steal-offer'].includes(S.phase))return 'var(--gold)';
  return cur().color;
}
function render(){
  stopTimer();
  const app=$('#app');
  document.body.classList.toggle('ingame',view==='game');
  if(view==='home')app.innerHTML=`<div id="stage">${homeHTML()}</div>`;
  else if(view==='setup')app.innerHTML=`<div id="stage">${setupHTML()}</div>`;
  else if(view==='tv')app.innerHTML=`<div id="stage">${tvHTML()}</div>`;
  else if(view==='rules'||view==='rules-game')app.innerHTML=`<div id="stage">${rulesHTML()}</div>`;
  else{
    const body={turn:turnHTML,question:questionHTML,reveal:questionHTML,'steal-offer':questionHTML,pick:pickHTML,'steal-target':stealTargetHTML,
      'challenge-opp':challengeOppHTML,'challenge-handoff':challengeHandoffHTML,'challenge-result':challengeResultHTML,
      'sd-intro':sdIntroHTML,'sd-pass':sdPassHTML,'sd-entry':sdEntryHTML,'sd-reveal':sdRevealHTML,win:winHTML}[S.phase]();
    app.innerHTML=boardHTML()+`<div id="stage">${body}</div>`+(menuOpen?menuHTML():'');
    if(S.phase==='win'){store.del(SAVE);confetti()}else store.set(SAVE,S);
    if(S.phase==='question')startTimer();
  }
  app.style.setProperty('--turn',turnColor());
}

/* ---------- Confetti ---------- */
function confetti(){
  if(matchMedia('(prefers-reduced-motion: reduce)').matches||$('#confetti'))return;
  const c=document.createElement('canvas');c.id='confetti';document.body.appendChild(c);
  const x=c.getContext('2d'),W=c.width=innerWidth,H=c.height=innerHeight;
  const cols=['#239A5F','#2A86D8','#8E52DC','#F2B12A','#E0457B','#13A3A0','#EE7B22'];
  const ps=Array.from({length:160},()=>({x:Math.random()*W,y:-Math.random()*H*.5,vx:(Math.random()-.5)*3,vy:2+Math.random()*4,r:Math.random()*6.28,s:6+Math.random()*8,c:cols[Math.floor(Math.random()*cols.length)]}));
  const t0=performance.now();
  (function f(t){x.clearRect(0,0,W,H);ps.forEach(p=>{p.x+=p.vx;p.y+=p.vy;p.r+=.1;x.save();x.translate(p.x,p.y);x.rotate(p.r);x.fillStyle=p.c;x.fillRect(-p.s/2,-p.s/4,p.s,p.s/2);x.restore()});
    if(t-t0<4500)requestAnimationFrame(f);else c.remove()})(t0);
}

/* ---------- Events ---------- */
document.addEventListener('input',e=>{if(e.target.classList.contains('pname'))draft.players[+e.target.dataset.i].name=e.target.value});
document.addEventListener('click',e=>{
  const el=e.target.closest('[data-act]');if(!el)return;
  if(el.classList.contains('overlay')&&e.target.closest('[data-stop]'))return;
  if(view==='game')keepAwake();
  const a=el.dataset.act,d=el.dataset;
  switch(a){
    case 'setup':view='setup';render();break;
    case 'home':view='home';render();break;
    case 'rules':view='rules';render();break;
    case 'tv':view='tv';render();break;
    case 'resume':{const s=store.get(SAVE);if(!s)return;S=s;setCats(S.cats);view='game';
      if(S.q){S.q.locked=false;if(S.phase==='question')setDeadline()}
      keepAwake();render();break}
    case 'set':draft[d.k]=d.k==='timer'?+d.v:d.v;render();break;
    case 'lvl':draft.players[+d.i].level=d.l;render();break;
    case 'add':if(draft.players.length<6){draft.players.push({name:'',level:'adult'});render();setTimeout(()=>{const ins=document.querySelectorAll('.pname');ins[ins.length-1].focus()},0)}break;
    case 'rm':draft.players.splice(+d.i,1);render();break;
    case 'cat':{const i=draft.cats.indexOf(d.c);
      if(i>=0){if(draft.cats.length<=4){toast('Keep at least 4 categories.');return}draft.cats.splice(i,1)}
      else{if(draft.cats.length>=6){toast('You can pick up to 6 categories.');return}draft.cats.push(d.c)}
      draft.cats=ALL_CATS.map(c=>c.id).filter(id=>draft.cats.includes(id));render();break}
    case 'start':prefs.lastSetup=draft;store.set(PREFS,prefs);newGame(draft);break;
    case 'spin':spin();break;
    case 'opt':choose(+d.i);break;
    case 'lock':lockIn();break;
    case 'clear':if(S.q&&!S.q.locked){S.q.seq=[];render()}break;
    case 'fifty':fifty();break;
    case 'swap':swapQ();break;
    case 'next':proceed();break;
    case 'thief':startSteal(d.id);break;
    case 'nosteal':noSteal();break;
    case 'choose':pickCat(d.c);break;
    case 'stealmedal':askQuestion({kind:'steal-medal',cat:d.c,level:nextLevel(cur().level),playerId:cur().id,targetId:d.id});break;
    case 'opp':{const n=S.target===2?4:6;S.ch={a:cur().id,b:d.id,cat:null,round:0,total:n,scores:{[cur().id]:0,[d.id]:0}};S.pickFor='challenge';S.phase='pick';render();break}
    case 'chq':{const pid=chPlayer();askQuestion({kind:'challenge',cat:S.ch.cat,level:byId(pid).level,playerId:pid});break}
    case 'pass':nextTurn();break;
    case 'sdstart':S.phase='sd-pass';render();break;
    case 'sdready':S.phase='sd-entry';render();break;
    case 'key':sdKey(d.k);break;
    case 'sdlock':sdLock();break;
    case 'sdcont':sdContinue();break;
    case 'again':newGame({cats:S.cats,mode:S.settings.mode,length:S.settings.length,timer:S.settings.timer,players:S.players.map(p=>({name:p.name,level:p.level}))});break;
    case 'menu':if(spinning||(S.q&&S.q.locked))return;menuOpen=true;confirmEnd=false;render();break;
    case 'closemenu':menuOpen=false;render();break;
    case 'refright':referee(true);break;
    case 'refwrong':referee(false);break;
    case 'redo':redo();break;
    case 'rulesgame':menuOpen=false;view='rules-game';render();break;
    case 'closerules':view='game';render();break;
    case 'sound':prefs.sound=!prefs.sound;store.set(PREFS,prefs);render();break;
    case 'endgame':if(!confirmEnd){confirmEnd=true;render()}else{store.del(SAVE);S=null;snap=null;menuOpen=false;confirmEnd=false;view='home';render()}break;
  }
});
render();
</script>
</body>
</html>
