<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Paint Pals</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🎨</text></svg>">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Gaegu:wght@400;700&family=Nunito:wght@500;700;800;900&display=swap" rel="stylesheet">
<style>
:root{
  --paper:#FBFAFF; --ink:#2E1A47; --soft:#6B5A80; --marker:#D6337A; --sun:#FFC93C;
  --mint:#2EC4A0; --sky:#4FA3F7; --lilac:#EDE6FF; --dot:#D9D0F2;
  --wob:255px 18px 225px 18px/18px 225px 18px 255px;
  --wob2:18px 225px 18px 255px/255px 18px 225px 18px;
}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{margin:0}
body{
  font-family:'Nunito',system-ui,-apple-system,'Segoe UI',sans-serif;color:var(--ink);
  background:var(--paper);
  background-image:radial-gradient(var(--dot) 1.3px,transparent 1.4px);background-size:22px 22px;
  min-height:100vh;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);
  -webkit-tap-highlight-color:transparent;
}
h1,h2,h3,.hand{font-family:'Gaegu','Comic Sans MS','Chalkboard SE',cursive;font-weight:700;margin:0}
p{margin:.3em 0}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible,input:focus-visible,select:focus-visible{outline:3px solid var(--sky);outline-offset:3px}
.btn{border:3px solid var(--ink);border-radius:var(--wob);background:#fff;padding:.5em 1.05em;font-weight:800;
  box-shadow:3px 4px 0 var(--ink);transition:transform .08s,box-shadow .08s}
.btn:active:not(:disabled){transform:translate(2px,3px);box-shadow:1px 1px 0 var(--ink)}
.btn.primary{background:var(--marker);color:#fff}
.btn.sun{background:var(--sun)}
.btn.mint{background:var(--mint)}
.btn.small{padding:.3em .8em;font-size:.9rem;box-shadow:2px 3px 0 var(--ink)}
.btn:disabled{opacity:.45;cursor:not-allowed;box-shadow:none}
.sketch{border:3px solid var(--ink);border-radius:var(--wob);background:#fff}

/* HUD */
.hud{position:sticky;top:0;z-index:20;display:flex;align-items:center;gap:12px;flex-wrap:wrap;
  padding:10px 16px;background:rgba(251,250,255,.94);backdrop-filter:blur(6px);border-bottom:3px solid var(--ink)}
.me{display:flex;align-items:center;gap:6px;background:none;border:none;padding:0}
.me .char{width:44px;height:52px}
.me span.nm{font-family:'Gaegu',cursive;font-size:1.35rem;font-weight:700}
.logo{font-size:2rem;color:var(--marker);letter-spacing:.5px;transform:rotate(-2deg);margin-right:auto;line-height:1}
.stats{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.stat{display:flex;align-items:center;gap:6px;padding:4px 10px;border:2.5px solid var(--ink);border-radius:var(--wob2);background:#fff;font-weight:900}
.coin{width:18px;height:18px;border-radius:50%;background:var(--sun);border:2.5px solid var(--ink);display:inline-block}
.cells{display:flex;gap:2px}
.cells i{display:block;width:12px;height:16px;border:2px solid var(--ink);border-radius:3px;background:#fff;position:relative;overflow:hidden}
.cells i::after{content:"";position:absolute;left:0;bottom:0;width:100%;height:var(--f,0%);background:var(--mint)}
.icon-btn{border:2.5px solid var(--ink);border-radius:50%;width:38px;height:38px;background:#fff;font-size:1.1rem}
.pulse{animation:pulse .6s}
@keyframes pulse{40%{transform:scale(1.25)}}

main{max-width:1180px;margin:0 auto;padding:16px}
.bar{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin-bottom:14px}
.bar h2{font-size:2rem;margin-right:auto}

/* TOWN */
.town-head{display:flex;align-items:flex-end;justify-content:space-between;gap:12px;flex-wrap:wrap;margin:4px 0 10px}
.town-head h2{font-size:2.3rem}
.run{display:flex;align-items:center;gap:8px;font-weight:800;padding:6px 12px;border:2.5px solid var(--ink);border-radius:var(--wob);background:#fff}
.run input{width:20px;height:20px;accent-color:var(--marker)}
.scene{position:relative;padding:18px 10px 0;border:3px solid var(--ink);border-radius:24px 30px 20px 34px/30px 20px 34px 24px;
  background:linear-gradient(#DFF1FF,#F6F1FF 70%);overflow:hidden}
.sun-blob{position:absolute;right:30px;top:16px;width:62px;height:62px;border-radius:50%;background:var(--sun);border:3px solid var(--ink)}
.bldgs{display:flex;flex-wrap:wrap;gap:14px;justify-content:space-around;align-items:stretch;position:relative;z-index:1}
.bldg{flex:1 1 190px;max-width:250px;display:flex;flex-direction:column;align-items:stretch;background:none;border:none;padding:0;text-align:center}
.bldg .roof{display:block;width:100%;height:58px}
.bldg .wall{display:flex;flex-direction:column;align-items:center;gap:8px;margin:-4px 10px 0;padding:12px 10px 0;
  background:#fff;border:3px solid var(--ink);border-bottom:none;border-radius:6px 6px 0 0;min-height:150px;flex:1}
.bldg .sign{font-family:'Gaegu',cursive;font-weight:700;font-size:1.45rem;line-height:1;background:var(--c);color:#fff;
  padding:6px 12px;border:2.5px solid var(--ink);border-radius:var(--wob);text-shadow:0 1px 0 rgba(0,0,0,.25)}
.bldg .what{font-size:.86rem;font-weight:700;color:var(--soft);min-height:2.4em}
.bldg .door{margin-top:auto;width:46px;height:58px;background:var(--c);border:3px solid var(--ink);border-bottom:none;border-radius:24px 24px 0 0;opacity:.85}
.bldg:hover .door{opacity:1}
.bldg:hover .wall{background:#FFFDF2}
.street{position:relative;height:96px;margin:0 -10px;background:#CFC6E4;border-top:3px solid var(--ink)}
.street::before{content:"";position:absolute;left:0;right:0;top:56px;border-top:4px dashed #fff}
.walker{position:absolute;bottom:22px;left:20px;width:70px;height:82px;transition:left 1s linear;z-index:2}
.walker .char{width:70px;height:82px}
.walker.flip .char{transform:scaleX(-1)}
.walker.moving .char{animation:bob .32s infinite}
@keyframes bob{50%{translate:0 -6px}}
.tip{margin-top:12px;color:var(--soft);font-weight:700}
@media (max-width:600px){.bldg{flex:1 1 40%}.bldg .wall{min-height:120px;margin:-4px 4px 0;padding:8px 4px 0}.bldg .sign{font-size:1.15rem}.bldg .what{font-size:.74rem}.bldg .roof{height:40px}.town-head h2{font-size:1.8rem}.logo{font-size:1.6rem}}

/* QUIZ */
.qwrap{max-width:720px;margin:0 auto}
.qcard{padding:22px 22px 26px}
.qmeta{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap;margin-bottom:10px}
.subject{font-weight:900;padding:3px 10px;border-radius:999px;border:2px solid var(--ink);background:var(--lilac);font-size:.9rem}
.streak{font-weight:900;color:var(--marker)}
#qText{font-family:'Nunito',sans-serif;font-weight:900;font-size:1.5rem;line-height:1.3;margin:6px 0 18px}
.choices{display:grid;grid-template-columns:1fr 1fr;gap:12px}
@media (max-width:560px){.choices{grid-template-columns:1fr}}
.choice{text-align:left;font-size:1.12rem;font-weight:800;padding:14px 16px;border:3px solid var(--ink);border-radius:var(--wob);background:#fff;box-shadow:3px 4px 0 var(--ink)}
.choice:hover:not(:disabled){background:#FFF6D6}
.choice.right{background:#C9F5E6}
.choice.wrong{background:#FFD3DF}
.choice:disabled{cursor:default}
.feedback{min-height:1.6em;margin-top:16px;font-weight:700;font-size:1.05rem}
.feedback b.good{color:#118a6b}
.feedback b.bad{color:var(--marker)}
.qfoot{display:flex;justify-content:space-between;align-items:center;margin-top:14px;gap:10px;flex-wrap:wrap}
.qstats{color:var(--soft);font-weight:700}

/* STUDIO */
.studio{border:3px solid var(--ink);border-radius:20px 26px 18px 30px/26px 18px 30px 20px;padding:14px;background:var(--wall,#E9E4F7)}
.studio-wrap{display:grid;grid-template-columns:1fr 290px;gap:14px;align-items:start}
@media (max-width:860px){.studio-wrap{grid-template-columns:1fr}.tool-row{grid-template-columns:repeat(6,1fr)}}
.easel{position:relative;border:4px solid var(--ink);border-radius:6px;background:#fff;box-shadow:6px 7px 0 rgba(46,26,71,.85);line-height:0}
#paint{width:100%;height:auto;aspect-ratio:4/3;display:block;touch-action:none;cursor:crosshair;border-radius:3px}
.overlay{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:12px;text-align:center;
  background:rgba(251,250,255,.93);line-height:1.3;padding:20px;border-radius:3px}
.overlay h3{font-size:2rem}
.overlay .row{display:flex;gap:10px;flex-wrap:wrap;justify-content:center}
.panel{background:#fff;border:3px solid var(--ink);border-radius:var(--wob);padding:12px;display:flex;flex-direction:column;gap:12px}
.panel h3{font-size:1.35rem}
.tool-row{display:grid;grid-template-columns:repeat(4,1fr);gap:6px}
.tool{position:relative;aspect-ratio:1;font-size:1.5rem;border:2.5px solid var(--ink);border-radius:12px;background:#fff;display:grid;place-items:center}
.tool.on{background:var(--sun);box-shadow:inset 0 0 0 2px #fff}
.tool.locked{opacity:.3;filter:grayscale(1);cursor:not-allowed}
.tool .lk{position:absolute;right:2px;bottom:0;font-size:.75rem}
.palette{display:grid;grid-template-columns:repeat(auto-fill,minmax(32px,1fr));gap:6px}
.sw{aspect-ratio:1;border-radius:50%;border:2.5px solid var(--ink);padding:0}
.sw.on{outline:3px solid var(--marker);outline-offset:2px}
.sizer{display:flex;align-items:center;gap:10px;font-weight:800}
.sizer input{flex:1;accent-color:var(--marker)}
.sizer .dotprev{width:34px;height:34px;display:grid;place-items:center}
.sizer .dotprev i{display:block;border-radius:50%;background:var(--ink)}
.acts{display:flex;gap:8px;flex-wrap:wrap}
.acts .btn{flex:1}
.meter{font-size:.88rem;color:var(--soft);font-weight:700;line-height:1.45}
.room{position:relative;aspect-ratio:10/3.2;margin-bottom:14px;border:3px solid var(--ink);border-radius:10px;overflow:hidden;background:var(--room,#CFC3EE)}
.room .wp{position:absolute;inset:0 0 24% 0}
.room .floor{position:absolute;left:0;right:0;bottom:0;height:24%;border-top:3px solid var(--ink);background:repeating-linear-gradient(90deg,#D4A373 0 46px,#C08A5A 46px 49px)}
.room .dec{position:absolute;line-height:0;pointer-events:none}
.room .dec svg{width:100%;height:auto;display:block;overflow:visible}
.frame{position:absolute;top:25%;aspect-ratio:4/3;padding:0;z-index:2;border:4px solid #8B5A2B;outline:2px solid var(--ink);background:#fff;box-shadow:2px 3px 0 rgba(46,26,71,.35)}
.frame img{width:100%;height:100%;object-fit:cover;display:block}
.frame.empty{border:2.5px dashed rgba(46,26,71,.45);outline:none;background:rgba(255,255,255,.35);box-shadow:none}
.frame:not(.empty):hover{transform:scale(1.06)}
.ditems{display:grid;grid-template-columns:repeat(auto-fill,minmax(130px,1fr));gap:10px;margin-top:8px}
.ditem{border:2.5px solid var(--ink);border-radius:14px;padding:8px;display:flex;flex-direction:column;align-items:center;gap:6px;text-align:center;font-weight:800;font-size:.88rem}
.ditem .pv{height:70px;width:100%;display:grid;place-items:center;background:var(--lilac);border-radius:10px}
.ditem .pv svg{max-height:60px;max-width:90%}
.ditem .wpv{height:70px;width:100%;border-radius:10px;border:2px solid var(--ink)}
.ditem .btn{width:100%}
.ditem.owned{background:#F3FFF9}
.hungbig{width:100%;border:6px solid #8B5A2B;outline:3px solid var(--ink);border-radius:2px;margin:8px 0}
.studio-info{display:flex;align-items:center;gap:12px}
.studio-info .char{width:64px;height:76px;flex:none}
.studio-info p{font-size:.92rem;font-weight:700}

/* STORE */
.shop{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:16px}
.item{background:#fff;border:3px solid var(--ink);border-radius:var(--wob);padding:16px;display:flex;flex-direction:column;gap:8px}
.item h3{font-size:1.5rem;line-height:1.05}
.item p{color:var(--soft);font-weight:700;font-size:.92rem;flex:1}
.item .pk{height:92px;border:3px solid var(--ink);border-radius:12px 12px 20px 20px;display:grid;place-items:center;position:relative;overflow:hidden;background:var(--pc)}
.item .pk::before{content:"";position:absolute;left:0;right:0;top:14px;border-top:3px dashed rgba(255,255,255,.8)}
.item .pk .char{width:64px;height:76px;position:relative}
.item .pk .big{font-size:2.5rem;position:relative}
.price{display:flex;align-items:center;gap:6px;font-weight:900}
.section-title{font-size:1.7rem;margin:22px 0 10px}

/* WARDROBE */
.ward{display:grid;grid-template-columns:260px 1fr;gap:16px;align-items:start}
@media (max-width:760px){.ward{grid-template-columns:1fr}}
.preview{background:#fff;border:3px solid var(--ink);border-radius:var(--wob);padding:16px;text-align:center;position:sticky;top:90px}
.preview .char{width:180px;height:210px}
.preview h3{font-size:1.8rem}
.grid-c{display:grid;grid-template-columns:repeat(auto-fill,minmax(104px,1fr));gap:10px}
.cslot{background:#fff;border:2.5px solid var(--ink);border-radius:14px;padding:6px 4px;display:flex;flex-direction:column;align-items:center;gap:2px;font-weight:800;font-size:.85rem}
.cslot .char{width:72px;height:84px}
.cslot.on{background:#FFF1C2;box-shadow:inset 0 0 0 3px var(--sun)}
.cslot.locked{background:#F1EEF7;color:#9C93AC;cursor:default}
.cslot.locked .char{filter:brightness(0) opacity(.18)}
.tag{font-size:.7rem;font-weight:900;padding:1px 7px;border-radius:999px;border:1.5px solid var(--ink)}
.r-common{background:#EDE6FF}.r-rare{background:#BFE0FF}.r-epic{background:#E3C8FF}
.r-legendary{background:linear-gradient(120deg,#FFE27A,#FFB3D9,#B5F0FF)}

/* MODAL */
.modal{position:fixed;inset:0;z-index:50;background:rgba(46,26,71,.55);display:grid;place-items:center;padding:16px}
.sheet{width:min(640px,100%);max-height:90vh;overflow:auto;padding:22px;background:#fff;border:3px solid var(--ink);border-radius:var(--wob);box-shadow:6px 8px 0 var(--ink)}
.sheet h2{font-size:2.1rem;line-height:1.05;margin-bottom:6px}
.sheet .row{display:flex;gap:10px;flex-wrap:wrap;margin-top:16px}
.sheet input[type=text]{font:inherit;font-weight:800;font-size:1.2rem;padding:10px 12px;border:3px solid var(--ink);border-radius:12px;width:100%}
.loop{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin:14px 0}
@media (max-width:520px){.loop{grid-template-columns:1fr 1fr}}
.loop div{border:2.5px solid var(--ink);border-radius:var(--wob2);padding:10px 8px;text-align:center;font-weight:800;font-size:.9rem;background:var(--lilac)}
.loop div span{display:block;font-size:1.7rem}
.cards{display:flex;gap:12px;flex-wrap:wrap;justify-content:center;margin:16px 0;perspective:900px}
.card{width:150px;height:200px;border:none;background:none;padding:0}
.card .inner{position:relative;width:100%;height:100%;transition:transform .55s;transform-style:preserve-3d}
.card.flipped .inner{transform:rotateY(180deg)}
.face{position:absolute;inset:0;backface-visibility:hidden;-webkit-backface-visibility:hidden;border:3px solid var(--ink);border-radius:16px;
  display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px;padding:10px;text-align:center}
.face.back{background:var(--marker);background-image:radial-gradient(rgba(255,255,255,.35) 2px,transparent 2.5px);background-size:16px 16px}
.face.back span{font-family:'Gaegu',cursive;font-weight:700;font-size:4rem;color:#fff}
.face.front{transform:rotateY(180deg);font-weight:800}
.face .char{width:90px;height:105px}
.face .swatch{width:72px;height:72px;border-radius:50%;border:3px solid var(--ink)}
.face .big{font-size:3rem}
.face small{font-size:.75rem;font-weight:900}
.appraise{display:grid;grid-template-columns:200px 1fr;gap:16px;align-items:start}
@media (max-width:560px){.appraise{grid-template-columns:1fr}}
.appraise img{width:100%;border:3px solid var(--ink);border-radius:6px}
.lines{list-style:none;margin:0;padding:0;font-weight:700}
.lines li{display:flex;justify-content:space-between;gap:10px;padding:4px 0;border-bottom:2px dotted #CFC6E4}
.lines li.total{border-bottom:none;font-weight:900;font-size:1.25rem;color:var(--marker)}
.buyer{display:flex;align-items:center;gap:10px;margin-bottom:8px;font-weight:800}
.buyer .bfav{width:22px;height:22px;border-radius:50%;border:2px solid var(--ink);display:inline-block;vertical-align:middle}
.gallery{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:12px;margin-top:10px}
.gallery figure{margin:0;background:#fff;border:2.5px solid var(--ink);border-radius:8px;padding:6px}
.gallery img{width:100%;display:block;border-radius:4px}
.gallery figcaption{font-size:.8rem;font-weight:800;margin-top:4px}
.setting{margin:14px 0}
.setting label{font-weight:800}
.seg{display:flex;gap:6px;flex-wrap:wrap;margin-top:6px}
.seg button{border:2.5px solid var(--ink);border-radius:999px;background:#fff;padding:5px 14px;font-weight:800}
.seg button.on{background:var(--sun)}
.checks{display:flex;gap:14px;flex-wrap:wrap;margin-top:6px;font-weight:700}
.checks input{accent-color:var(--marker);width:18px;height:18px;vertical-align:-3px}

.toast{position:fixed;left:50%;bottom:calc(22px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);z-index:60;
  background:var(--ink);color:#fff;padding:12px 18px;border-radius:14px;font-weight:800;max-width:90vw;text-align:center;box-shadow:0 6px 0 rgba(0,0,0,.2)}

@media (prefers-reduced-motion:reduce){
  *{animation:none!important;transition:none!important}
}
</style>
</head>
<body>

<header class="hud">
  <button class="me" id="meBtn" aria-label="Change your look"><span id="hudChar"></span><span class="nm" id="hudName"></span></button>
  <h1 class="logo">Paint Pals</h1>
  <div class="stats">
    <div class="stat" title="Coins"><span class="coin"></span><b id="coins">0</b></div>
    <div class="stat" id="energyStat" title="Energy (max 300)">⚡<div class="cells" id="cells"><i></i><i></i><i></i></div><b id="energy">0</b></div>
    <div class="stat" title="Blank canvases">🖼️<b id="canv">0</b></div>
    <button class="icon-btn" id="gear" aria-label="Grown-up settings">⚙️</button>
  </div>
</header>

<main>
  <!-- TOWN -->
  <section id="town" class="screen">
    <div class="town-head">
      <h2>Paint Town</h2>
      <label class="run"><input type="checkbox" id="runToggle"> Run (faster, costs 3 ⚡ instead of 1)</label>
    </div>
    <div class="scene" id="scene">
      <div class="sun-blob" aria-hidden="true"></div>
      <div class="bldgs">
        <button class="bldg" data-dest="quiz" style="--c:#4FA3F7">
          <svg class="roof" viewBox="0 0 200 60" preserveAspectRatio="none" aria-hidden="true"><path d="M8 58 L100 6 L192 58Z" fill="#4FA3F7" stroke="#2E1A47" stroke-width="3" stroke-linejoin="round" vector-effect="non-scaling-stroke"/></svg>
          <span class="wall"><span class="sign">Quiz Library</span><span class="what">Answer questions to earn energy. Walking here is always free.</span><span class="door"></span></span>
        </button>
        <button class="bldg" data-dest="store" style="--c:#2EC4A0">
          <svg class="roof" viewBox="0 0 200 60" preserveAspectRatio="none" aria-hidden="true"><path d="M8 58 L100 6 L192 58Z" fill="#2EC4A0" stroke="#2E1A47" stroke-width="3" stroke-linejoin="round" vector-effect="non-scaling-stroke"/></svg>
          <span class="wall"><span class="sign">Art Store</span><span class="what">Buy canvases and open packs.</span><span class="door"></span></span>
        </button>
        <button class="bldg" data-dest="studio" style="--c:#D6337A">
          <svg class="roof" viewBox="0 0 200 60" preserveAspectRatio="none" aria-hidden="true"><path d="M8 58 L100 6 L192 58Z" fill="#D6337A" stroke="#2E1A47" stroke-width="3" stroke-linejoin="round" vector-effect="non-scaling-stroke"/></svg>
          <span class="wall"><span class="sign">My Studio</span><span class="what">Paint, sell paintings and upgrade your studio.</span><span class="door"></span></span>
        </button>
        <button class="bldg" data-dest="wardrobe" style="--c:#8F5CFF">
          <svg class="roof" viewBox="0 0 200 60" preserveAspectRatio="none" aria-hidden="true"><path d="M8 58 L100 6 L192 58Z" fill="#8F5CFF" stroke="#2E1A47" stroke-width="3" stroke-linejoin="round" vector-effect="non-scaling-stroke"/></svg>
          <span class="wall"><span class="sign">Wardrobe</span><span class="what">Pick your character and hat.</span><span class="door"></span></span>
        </button>
      </div>
      <div class="street" id="street"><div class="walker" id="walker"></div></div>
    </div>
    <p class="tip" id="townTip"></p>
  </section>

  <!-- QUIZ -->
  <section id="quiz" class="screen" hidden>

let state = load();
function load(){
  const d = defaults();
  try{
    const raw = localStorage.getItem(SAVE_KEY);
    if(!raw) return d;
    const s = JSON.parse(raw);
    return {...d, ...s, stats:{...d.stats,...(s.stats||{})}, settings:{...d.settings,...(s.settings||{})}};
  }catch(e){ return d; }
}
function save(){
  try{ localStorage.setItem(SAVE_KEY, JSON.stringify(state)); }
  catch(e){
    // storage full: drop oldest sold thumbnails and try again
    while(state.sold.length > 4){ state.sold.pop(); try{ localStorage.setItem(SAVE_KEY, JSON.stringify(state)); return; }catch(_){} }
  }
}

      const A=g*m1, B=g*m2;
      return mc(`What is the greatest common factor (GCF) of ${A} and ${B}?`, num(g), nums(g,[lcm(A,B), g*2, Math.min(A,B), m1*m2]),
        `${A} = ${g} × ${m1} and ${B} = ${g} × ${m2}. The biggest number that divides both is ${g}.`);
    }
    let A=pick([4,6,8,9,10,12,15]), B=pick([3,4,6,8,10,12,14]); if(A===B) B+=2;
    const L=lcm(A,B);
    return mc(`What is the least common multiple (LCM) of ${A} and ${B}?`, num(L), nums(L,[A*B===L?L+A:A*B, gcd(A,B), L*2, L+B]),
      `Count by ${A}s and ${B}s until they meet: the first shared number is ${L}.`);
  },
  mean(s){
    for(;;){
      const m=R(10,40), xs=[R(m-10,m+10),R(m-10,m+10),R(m-10,m+10),R(m-10,m+10)];
      const last = 5*m - xs.reduce((p,v)=>p+v,0); if(last<1 || last>99) continue;
      xs.push(last); shuffle(xs); const sorted=[...xs].sort((p,q)=>p-q);
      return mc(`What is the mean (average) of ${xs.join(', ')}?`, num(m), nums(m,[sorted[2], 5*m, m+3, m-3]),
        `Add them up: ${5*m}. Divide by 5 numbers: ${5*m} ÷ 5 = ${m}.`);
    }
  },
  ratio(s){
    let a=R(1,5), b=R(2,7); while(a===b || gcd(a,b)!==1){ a=R(1,5); b=R(2,7); }
    const k=R(2,8), ans=a*k;
    return mc(`The ratio of red paint to blue paint is ${a}:${b}. If you use ${b*k} cups of blue, how many cups of red do you need?`,
      num(ans), nums(ans,[b*k, a+k, ans+a, b*k-(b-a)]), `${b*k} ÷ ${b} = ${k} batches, and ${a} × ${k} = ${ans} cups of red.`);
  },
  volume(s){
    const l=R(2,9), w=R(2,8), h=R(2,7), ans=l*w*h;
    return mc(`A box is ${l} cm long, ${w} cm wide and ${h} cm tall. What is its volume?`, `${ans} cubic cm`,
      [`${l+w+h} cubic cm`, `${l*w} cubic cm`, `${2*(l*w+l*h+w*h)} cubic cm`, `${ans+l} cubic cm`], `Volume = length × width × height = ${l} × ${w} × ${h} = ${ans} cubic cm.`);
  }
};

function makeQuestion(){
  const st = state.settings, s = st.grade - 4; // grade 5→1, 6→2, 7→3
  const pool = [];
  if(st.math) pool.push('math','math');
  if(st.geo) pool.push('geo');
  if(st.sci) pool.push('sci');
  if(!pool.length) pool.push('math');
  const subj = pick(pool);
  if(subj==='math'){ const g = pick(MATH_BY_GRADE[s]); return {...MATH[g](s), subject:'Math'}; }
  if(subj==='geo'){
    if(Math.random()<.55){
      const tierMax = s===1 ? 2 : 3, list = CAPITALS.filter(c=>c[2]<=tierMax), it = pick(list);
      const others = shuffle(list.filter(c=>c!==it)).slice(0,3);
      if(Math.random()<.7) return {...mc(`What is the capital of ${it[0]}?`, it[1], others.map(o=>o[1]), `${it[1]} is the capital of ${it[0]}.`), subject:'Capitals'};
      const cap = s => s.charAt(0).toUpperCase()+s.slice(1);
      return {...mc(`${it[1]} is the capital of which country?`, cap(it[0]), others.map(o=>cap(o[0])), `${it[1]} is the capital of ${it[0]}.`), subject:'Capitals'};
    }
    const f = pick(GEO_FACTS); return {...mc(f[0], f[1], f[2], f[3]), subject:'Geography'};
  }
  const f = pick(SCIENCE); return {...mc(f[0], f[1], f[2], f[3]), subject:'Science'};
}

let townSpot = null, walking = false;
function renderTown(){
  $('#walker').innerHTML = charSVG(state.char, state.hat);
  placeWalker(townSpot, false);
  const tips = [
    state.energy < 1 ? 'You’re out of energy. Visit the Quiz Library to power up.' : null,
    state.canvases < 1 && !state.wip ? 'No blank canvases left. The Art Store sells them.' : null,
    state.wip ? 'You have a painting in progress in your studio.' : null
  ].filter(Boolean);

}
function bldgX(dest){
  const st = $('#street').getBoundingClientRect(), b = $(`.bldg[data-dest="${dest}"] .door`).getBoundingClientRect();
  return b.left - st.left + b.width/2 - 35;
}
function placeWalker(dest, animate){
  const w = $('#walker');
  w.style.transition = animate ? w.style.transition : 'none';
  w.style.left = (dest ? bldgX(dest) : 20) + 'px';
  if(!animate) requestAnimationFrame(()=>w.style.transition='');
}
$$('.bldg').forEach(b=>b.addEventListener('click', ()=>walkTo(b.dataset.dest)));
function walkTo(dest){
  if(walking) return;
  const run = $('#runToggle').checked, cost = run ? 3 : 1, free = dest==='quiz';
  if(!free && state.energy < cost){
    toast(state.energy < 1 ? 'You need energy to walk there. Answer questions at the Quiz Library first.' : 'Not enough energy to run. Uncheck Run to walk instead.');
    bump('#energyStat'); return;
  }
  if(state.energy >= cost){ state.energy -= cost; save(); renderHUD(); }
  const w = $('#walker'), from = parseFloat(w.style.left)||20, to = bldgX(dest), dist = Math.abs(to-from);
  const speed = run ? 700 : 320, dur = Math.max(.25, dist/speed);
  w.classList.toggle('flip', to < from);
  w.classList.add('moving');
  w.style.transition = `left ${dur}s linear`;
  w.style.left = to+'px';
  walking = true;
  setTimeout(()=>{ walking=false; w.classList.remove('moving'); townSpot = dest; show(dest); }, dur*1000 + 120);
}
window.addEventListener('resize', ()=>{ if(current==='town') placeWalker(townSpot,false); });

let curQ = null, streak = 0;
function nextQuestion(){
  curQ = makeQuestion();
  $('#qSubject').textContent = curQ.subject;
  $('#qText').textContent = curQ.q;
  $('#feedback').innerHTML = '';
  $('#nextQ').hidden = true;
  $('#streak').textContent = streak>=2 ? `Streak: ${streak} in a row` : '';
  const st = state.stats;
  $('#qStats').textContent = st.answered ? `${st.correct} of ${st.answered} right so far` : 'Each right answer = 100 energy';
  const box = $('#choices'); box.innerHTML = '';
  curQ.choices.forEach(c=>{
    const b = document.createElement('button'); b.className='choice'; b.textContent=c;
    b.addEventListener('click', ()=>answer(b, c)); box.appendChild(b);
  });
}
function answer(btn, choice){
  $$('.choice').forEach(b=>{ b.disabled = true; if(b.textContent===curQ.a) b.classList.add('right'); });
  state.stats.answered++;
  const fb = $('#feedback');
  if(choice===curQ.a){
    streak++; state.stats.correct++; state.stats.bestStreak = Math.max(state.stats.bestStreak, streak);
    let gain = ENERGY_PER_Q, bonus = '';
    if(streak % 5 === 0){ gain += 50; bonus = ` Streak bonus: +50 for ${streak} in a row!`; }
    const before = state.energy;
    state.energy = Math.min(ENERGY_MAX, state.energy + gain);
    const got = Math.round(state.energy - before);
    fb.innerHTML = got>0 ? `<b class="good">Correct! +${got} energy.</b>${bonus}` : `<b class="good">Correct!</b> Your energy is full (300 max). Time to go paint!`;
    bump('#energyStat');
  } else {
    streak = 0; btn.classList.add('wrong');
    fb.innerHTML = `<b class="bad">Not quite.</b> The answer is <b>${esc(curQ.a)}</b>. ${esc(curQ.explain)}`;
  }
  save(); renderHUD();
  $('#nextQ').hidden = false; $('#nextQ').focus({preventScroll:true});
  $('#streak').textContent = streak>=2 ? `Streak: ${streak} in a row` : '';
}
$('#nextQ').addEventListener('click', nextQuestion);

function refreshOverlay(){
  const ov = $('#paintOverlay');

    ov.hidden = false;

      ov.innerHTML = `<h3>Ready for a new painting?</h3><p>This uses 1 of your ${state.canvases} blank canvas${state.canvases>1?'es':''}.</p>

      $('#newPaint').onclick = startPainting;
    } else {
      ov.innerHTML = `<h3>No blank canvases</h3><p>Buy more canvases at the Art Store, or get some in a Supply Pack.</p>
        <div class="row"><button class="btn mint" id="goStore">Go to the Art Store</button></div>`;
      $('#goStore').onclick = ()=>{ townSpot='store'; show('store'); };

  }

    ov.hidden = false;
    ov.innerHTML = `<h3>Out of energy!</h3><p>Answer questions to keep painting. Your painting will wait for you.</p>
      <div class="row"><button class="btn primary" id="goQuiz">Answer questions</button><button class="btn" id="sellNow">Sell it as it is</button></div>`;

  if(state.canvases < 1) return;
  state.canvases--; painting = true; clearCanvas(); pStats = freshStats(); undoStack = [];
  saveWip(true); renderHUD(); refreshOverlay();
  if(state.stats.paintings===0 && state.energy>0) toast('Draw with your finger or mouse. Energy drains while you paint.');
}

function updateSizePreview(){ const d = Math.max(4, Math.min(34, size*0.6)); const i = $('#dotPrev'); i.style.width = i.style.height = d+'px'; }

function pos(e){ const r = cv.getBoundingClientRect(); return {x:(e.clientX-r.left)*W/r.width, y:(e.clientY-r.top)*H/r.height}; }
function snapshot(){ undoStack.push(ctx.getImageData(0,0,W,H)); if(undoStack.length>12) undoStack.shift(); }
$('#undoBtn').addEventListener('click', ()=>{ if(!painting) return; const s = undoStack.pop(); if(s){ ctx.putImageData(s,0,0); saveWip(); } else toast('Nothing to undo.'); });

cv.addEventListener('pointerdown', e=>{
  if(!painting) return;
  if(state.energy <= 0){ refreshOverlay(); return; }
  e.preventDefault(); cv.setPointerCapture(e.pointerId);
  snapshot(); drawing = true; last = pos(e); stampAcc = 0; lastActive = performance.now();
  pStats.strokes++; if(tool!=='eraser'){ pStats.tools.add(tool); pStats.colors.add(tool==='rainbow' ? 'rainbow' : color); }
  if(tool==='bucket'){ floodFill(last.x, last.y, color); drawing = false; saveWip(); updateMeter(); return; }
  if(tool==='star' || tool==='heart'){ stamp(last.x,last.y); }
  else drawSeg(last, last);
});
cv.addEventListener('pointermove', e=>{
  if(!drawing) return;
  const p = pos(e); drawSeg(last, p); last = p; lastActive = performance.now();
});
const endStroke = ()=>{ if(drawing){ drawing=false; saveWip(); updateMeter(); } };
cv.addEventListener('pointerup', endStroke);
cv.addEventListener('pointercancel', endStroke);

function line(a,b,width,style,cap='round',alpha=1){
  ctx.save(); ctx.globalAlpha=alpha; ctx.strokeStyle=style; ctx.lineWidth=width; ctx.lineCap=cap; ctx.lineJoin='round';
  ctx.beginPath(); ctx.moveTo(a.x,a.y); ctx.lineTo(b.x,b.y); ctx.stroke(); ctx.restore();
}
function along(a,b,stepPx,fn){
  const d = Math.hypot(b.x-a.x, b.y-a.y), n = Math.max(1, Math.ceil(d/stepPx));
  for(let i=0;i<=n;i++){ const t=i/n; fn(a.x+(b.x-a.x)*t, a.y+(b.y-a.y)*t); }
}
function drawSeg(a,b){
  switch(tool){
    case 'pencil': line(a,b,Math.max(1.5,size*0.3),color); break;
    case 'brush': line(a,b,size,color); break;
    case 'eraser': line(a,b,size*1.6,'#FFFFFF'); break;
    case 'marker': line(a,b,size*1.7,color,'square',0.28); break;
    case 'rainbow': hue=(hue+5)%360; line(a,b,size,`hsl(${hue} 90% 58%)`); break;
    case 'crayon':
      ctx.save(); ctx.fillStyle=color;
      along(a,b,2,(x,y)=>{ for(let i=0;i<5;i++){ ctx.globalAlpha=.35+Math.random()*.5; const r=size/2; ctx.fillRect(x+(Math.random()-.5)*r*2, y+(Math.random()-.5)*r*2, 2, 2); } });
      ctx.restore(); break;
    case 'spray':
      ctx.save(); ctx.fillStyle=color;
      along(a,b,6,(x,y)=>{ const r=size*1.4; for(let i=0;i<size*1.2;i++){ const ang=Math.random()*Math.PI*2, d=Math.random()*r; ctx.globalAlpha=.6; ctx.fillRect(x+Math.cos(ang)*d, y+Math.sin(ang)*d, 1.6, 1.6); } });
      ctx.restore(); break;
    case 'glitter': {
      const cols=[color,'#FFD60A','#FFFFFF','#FF9CEE','#00D9FF','#E9B949'];
      ctx.save();
      along(a,b,8,(x,y)=>{ for(let i=0;i<3;i++){ const px=x+(Math.random()-.5)*size*2, py=y+(Math.random()-.5)*size*2, r=1+Math.random()*3.5;
        ctx.fillStyle=pick(cols); ctx.globalAlpha=.9; sparkle(px,py,r); } });
      ctx.restore(); break; }
    case 'star': case 'heart': {
      const d = Math.hypot(b.x-a.x,b.y-a.y); stampAcc += d;
      const gap = Math.max(18, size*2.2);
      if(stampAcc >= gap){ stampAcc = 0; stamp(b.x,b.y); }
      break; }
  }
}
function sparkle(x,y,r){
  ctx.beginPath(); ctx.moveTo(x,y-r*2); ctx.lineTo(x+r*.6,y-r*.6); ctx.lineTo(x+r*2,y); ctx.lineTo(x+r*.6,y+r*.6);
  ctx.lineTo(x,y+r*2); ctx.lineTo(x-r*.6,y+r*.6); ctx.lineTo(x-r*2,y); ctx.lineTo(x-r*.6,y-r*.6); ctx.closePath(); ctx.fill();
}
function stamp(x,y){
  const r = Math.max(8, size*1.1);
  ctx.save(); ctx.fillStyle=color; ctx.strokeStyle=INK; ctx.lineWidth=Math.max(1.5,r/9);
  ctx.beginPath();
  if(tool==='star'){
    for(let i=0;i<10;i++){ const ang=-Math.PI/2+i*Math.PI/5, rr=i%2?r*.45:r; ctx.lineTo(x+Math.cos(ang)*rr, y+Math.sin(ang)*rr); }
  } else {
    ctx.moveTo(x, y+r*.9);
    ctx.bezierCurveTo(x-r*1.4, y-r*.1, x-r*.7, y-r*1.1, x, y-r*.35);
    ctx.bezierCurveTo(x+r*.7, y-r*1.1, x+r*1.4, y-r*.1, x, y+r*.9);
  }
  ctx.closePath(); ctx.fill(); ctx.stroke(); ctx.restore();
}
function hexRGB(h){ const n=parseInt(h.slice(1),16); return [n>>16&255, n>>8&255, n&255]; }
function floodFill(x0,y0,hex){
  x0=Math.floor(x0); y0=Math.floor(y0); if(x0<0||y0<0||x0>=W||y0>=H) return;
  const img = ctx.getImageData(0,0,W,H), d = img.data, i0=(y0*W+x0)*4;
  const tr=d[i0], tg=d[i0+1], tb=d[i0+2], [fr,fg,fb]=hexRGB(hex);
  if(Math.abs(tr-fr)<6 && Math.abs(tg-fg)<6 && Math.abs(tb-fb)<6) return;
  const tol=48, seen=new Uint8Array(W*H);
  const match = p => { const i=p*4; return Math.abs(d[i]-tr)<=tol && Math.abs(d[i+1]-tg)<=tol && Math.abs(d[i+2]-tb)<=tol; };
  const stack=[[x0,y0]];
  while(stack.length){
    let [x,y]=stack.pop(), p=y*W+x;
    while(x>=0 && !seen[p] && match(p)){ x--; p--; }
    x++; p++;
    let up=false, down=false;
    while(x<W && !seen[p] && match(p)){
      seen[p]=1; const i=p*4; d[i]=fr; d[i+1]=fg; d[i+2]=fb; d[i+3]=255;
      if(y>0){ const q=p-W; if(!seen[q] && match(q)){ if(!up){ stack.push([x,y-1]); up=true; } } else up=false; }
      if(y<H-1){ const q=p+W; if(!seen[q] && match(q)){ if(!down){ stack.push([x,y+1]); down=true; } } else down=false; }
      x++; p++;
    }
  }
  ctx.putImageData(img,0,0);
}

let wipTimer;
function saveWip(now){
  if(!painting) return;
  const doit = ()=>{
    state.wip = cv.toDataURL('image/jpeg', .88);
    state.wipStats = {colors:[...pStats.colors], tools:[...pStats.tools], strokes:pStats.strokes, seconds:Math.round(pStats.seconds)};
    save();
  };
  clearTimeout(wipTimer);
  if(now) doit(); else wipTimer = setTimeout(doit, 700);
}
function updateMeter(){
  if(!painting){ $('#paintMeter').textContent=''; return; }
  const secs = Math.round(pStats.seconds), mins = state.settings.minutes;
  const left = Math.floor(state.energy / (100/(mins*60)));
  $('#paintMeter').innerHTML = `Colors used: ${pStats.colors.size} · Tools used: ${pStats.tools.size} · Time painting: ${fmtTime(secs)}<br>
    Energy left for about ${fmtTime(left)} of painting.`;
}
function fmtTime(s){ s=Math.max(0,Math.round(s)); const m=Math.floor(s/60); return m ? `${m}m ${s%60}s` : `${s}s`; }

// Energy drains while you are actively painting (it pauses when you stop for a moment)
let prevTick = performance.now(), meterTick = 0;
setInterval(()=>{
  const now = performance.now(), dt = (now - prevTick)/1000; prevTick = now;
  if(current!=='studio' || !painting) return;
  const active = drawing || (now - lastActive < 1200);
  if(!active || state.energy<=0) return;
  const rate = 100 / (state.settings.minutes*60);
  state.energy = Math.max(0, state.energy - rate*dt);
  pStats.seconds += dt;
  renderEnergyOnly();
  if(++meterTick % 5 === 0) updateMeter();
  if(state.energy <= 0){ drawing = false; saveWip(true); refreshOverlay(); toast('Out of energy! Answer questions to keep painting.'); }
}, 200);
function renderEnergyOnly(){
  $('#energy').textContent = Math.floor(state.energy);
  $$('#cells i').forEach((c,i)=>{ const f=Math.max(0,Math.min(100,state.energy-i*100)); c.style.setProperty('--f', f+'%'); });
}

/* ---------- Selling ---------- */
function coverage(){
  const d = ctx.getImageData(0,0,W,H).data; let n=0, t=0;
  for(let y=0;y<H;y+=5) for(let x=0;x<W;x+=5){ const i=(y*W+x)*4; t++; if(d[i]+d[i+1]+d[i+2] < 735) n++; }
  return n/t;
}
let offer = null;
function startSell(){
  if(!painting){ toast('Start a painting first.'); return; }
  const cov = coverage();
  if(pStats.strokes < 4 || cov < 0.02 || pStats.seconds < 20){ toast('Buyers want to see a bit more. Keep painting for at least 20 seconds!'); return; }
  const S = STUDIOS[state.studio];
  const nColors = Math.min(12, pStats.colors.size), nTools = pStats.tools.size, secs = Math.round(pStats.seconds);
  const lines = [
    ['Base price', 15],
    [`Colors used: ${nColors} × 6`, nColors*6],
    [`Tools used: ${nTools} × 8`, nTools*8],
    [`Canvas covered: ${Math.round(cov*100)}%`, Math.round(cov*40)],
    [`Time spent painting: ${fmtTime(secs)} (max 2 min)`, Math.min(60, Math.round(secs/2))]
  ];
  let sub = lines.reduce((p,l)=>p+l[1],0);
  const buyer = pick(BUYERS);
  const favPool = state.colors.filter(h=>h!=='#FFFFFF');
  const fav = Math.random()<.5 && pStats.colors.size ? pick([...pStats.colors].filter(c=>c!=='rainbow').concat(favPool)) : pick(favPool);
  const mood = Math.round((0.9 + Math.random()*0.25)*100)/100;
  const nDecor = shownDecor().length;
  offer = {lines, sub, buyer, fav, favHit: pStats.colors.has(fav), mult:S.mult, nDecor, cozy: Math.round((1+COZY*nDecor)*100)/100, studioName:S.name, mood, haggled:false, img: cv.toDataURL('image/jpeg',.8)};
  calcOffer(); renderSell();
}
function calcOffer(){
  let v = offer.sub * offer.mult * offer.cozy; if(offer.favHit) v *= 1.25; v *= offer.mood; if(offer.haggle) v *= offer.haggle;
  offer.price = Math.max(5, Math.round(v));
}
function renderSell(note=''){
  const o = offer;
  const rows = o.lines.map(l=>`<li><span>${esc(l[0])}</span><span>+${l[1]}</span></li>`).join('') +
    `<li><span>Subtotal</span><span>${o.sub}</span></li>` +
    `<li><span>${esc(o.studioName)} bonus</span><span>×${o.mult}</span></li>` +
    (o.nDecor ? `<li><span>Cozy studio (${o.nDecor} decoration${o.nDecor>1?'s':''})</span><span>×${o.cozy}</span></li>` : '') +
    (o.favHit ? `<li><span>You used their favorite color!</span><span>×1.25</span></li>` : '') +
    `<li><span>Buyer’s mood today</span><span>×${o.mood}</span></li>` +
    (o.haggle ? `<li><span>After asking for more</span><span>×${o.haggle}</span></li>` : '') +
    `<li class="total"><span>Offer</span><span>${o.price} coins</span></li>`;
  openModal(`<h2>${esc(o.buyer)} wants your painting!</h2>
    <div class="buyer">Their favorite color: <span class="bfav" style="background:${o.fav}"></span> ${esc(colorName(o.fav))} ${o.favHit?'(you used it!)':''}</div>
    <div class="appraise"><img src="${o.img}" alt="Your painting"><ul class="lines">${rows}</ul></div>
    ${note?`<p style="margin-top:10px;font-weight:800">${note}</p>`:''}
    <div class="row"><button class="btn primary" id="sellYes">Sell for ${o.price} coins</button>
      <button class="btn sun" id="haggle" ${o.haggled?'disabled':''}>Ask for more</button>
      <button class="btn" id="sellNo">Keep painting</button></div>
    <div class="row" style="margin-top:10px;align-items:center"><button class="btn mint" id="hangIt" ${wallFull()?'disabled':''}>Hang it on my wall instead</button>
      <span style="font-weight:700;color:var(--soft)">${wallFull() ? 'Your wall is full. Sell or take down a painting first, or upgrade your studio for more spots.' : `You can sell it from your wall later for ${o.price} coins.`}</span></div>`);
  $('#hangIt').onclick = hangPainting;
  $('#sellYes').onclick = completeSale;
  $('#sellNo').onclick = ()=>{ closeModal(); refreshOverlay(); };
  $('#haggle').onclick = ()=>{
    offer.haggled = true;
    if(Math.random() < .55){ offer.haggle = 1.25; calcOffer(); renderSell(`${o.buyer} agreed to pay more!`); }
    else { offer.haggle = 0.85; calcOffer(); renderSell(`${o.buyer} was a little grumpy and lowered the offer.`); }
  };
}
function thumb(w,h,q){ const t=document.createElement('canvas'); t.width=w; t.height=h; t.getContext('2d').drawImage(cv,0,0,w,h); return t.toDataURL('image/jpeg',q); }
function finishPainting(){ painting = false; state.wip = null; state.wipStats = null; pStats = freshStats(); undoStack = []; clearCanvas(); }
function recordSale(img, price, buyer){
  state.sold.unshift({img, price, buyer, t:Date.now()});
  if(state.sold.length>24) state.sold.length = 24;
  state.coins += price; state.stats.paintings++; state.stats.earned += price;
}
function completeSale(){
  const o = offer;
  recordSale(thumb(240,180,.72), o.price, o.buyer);
  finishPainting(); save(); renderHUD();
  openModal(`<h2>Sold!</h2><p style="font-size:1.15rem;font-weight:800">${esc(o.buyer)} paid <b>${o.price} coins</b> for your painting.</p>
    <p>You’ve earned ${state.stats.earned} coins from ${state.stats.paintings} painting${state.stats.paintings>1?'s':''}.</p>
    <div class="row"><button class="btn primary" id="okSold">Back to the studio</button></div>`);
  $('#okSold').onclick = ()=>{ closeModal(); enterStudio(); };
  bump('#coins');
}
$('#sellBtn').addEventListener('click', startSell);

/* ---------- Wall & decorations ---------- */
const wallFull = () => state.hung.length >= STUDIOS[state.studio].slots;
const shownDecor = () => Object.keys(DECOR).filter(k=>state.decor[k]===true);
function hangPainting(){
  if(wallFull()) return;
  state.hung.push({img:thumb(320,240,.8), value:offer.price, t:Date.now()});
  finishPainting(); save(); renderHUD(); closeModal(); enterStudio();
  toast('Your painting is hanging on your wall! Tap it any time to sell it.');
}
function renderRoom(){
  const S = STUDIOS[state.studio], n = S.slots, fw = Math.min(10, 60/n - 1.6), x0 = 24, span = 60;
  let frames = '';
  for(let i=0;i<n;i++){
    const left = (x0 + span*(i+.5)/n - fw/2).toFixed(2), p = state.hung[i];
    frames += p ? `<button class="frame" data-hung="${i}" style="left:${left}%;width:${fw}%;border-color:${S.frame}" aria-label="Painting on your wall, worth ${p.value} coins"><img src="${p.img}" alt=""></button>`
                : `<span class="frame empty" style="left:${left}%;width:${fw}%" title="Empty spot on your wall"></span>`;
  }
  const decs = shownDecor().map(k=>`<div class="dec" style="${DECOR[k].pos};z-index:${DECOR[k].z||3}">${DECOR[k].svg}</div>`).join('');
  const wp = WALLPAPERS[state.wallpaper] || WALLPAPERS.plain;
  $('#room').innerHTML = `<div class="wp"></div><div class="floor"></div>${frames}${decs}
    <div class="dec" style="left:46%;bottom:4%;width:7%;z-index:5">${charSVG(state.char, state.hat)}</div>`;
  $('#room .wp').style.background = wp.css;
  $$('#room [data-hung]').forEach(b=>b.onclick = ()=>openHung(+b.dataset.hung));
}
function openHung(i){
  const p = state.hung[i]; if(!p) return;
  openModal(`<h2>On your wall</h2><img class="hungbig" src="${p.img}" alt="Your painting" style="border-color:${STUDIOS[state.studio].frame}">
    <p style="font-weight:800">A collector will pay ${p.value} coins for this one.</p>
    <div class="row"><button class="btn primary" id="hSell">Sell for ${p.value} coins</button><button class="btn" id="hDown">Take it down</button><button class="btn" id="hClose">Keep it up</button></div>`);
  $('#hClose').onclick = closeModal;
  $('#hSell').onclick = ()=>{
    const buyer = pick(BUYERS); recordSale(p.img, p.value, buyer); state.hung.splice(i,1); save(); renderHUD(); closeModal(); enterStudio();
    toast(`${buyer} bought it for ${p.value} coins!`); bump('#coins');
  };
  $('#hDown').onclick = ()=>{ if(confirm('Take this painting down? It will be gone for good.')){ state.hung.splice(i,1); save(); closeModal(); enterStudio(); } };
}
$('#decorBtn').addEventListener('click', openDecorate);
function openDecorate(){
  const lvl = state.studio;
  const dItems = Object.entries(DECOR).map(([k,d])=>{
    const owned = state.decor[k] !== undefined, shown = state.decor[k] === true;
    let btn;
    if(owned) btn = `<button class="btn small" data-toggle="${k}">${shown?'Put away':'Show it'}</button>`;
    else if(lvl < d.lvl) btn = `<button class="btn small" disabled>Needs ${STUDIOS[d.lvl].name}</button>`;
    else btn = `<button class="btn small primary" data-buy="${k}" ${state.coins<d.price?'disabled':''}>Buy for ${d.price}</button>`;
    return `<div class="ditem ${owned?'owned':''}"><div class="pv">${d.svg}</div><span>${d.name}</span>${btn}</div>`;
  }).join('');
  const wItems = Object.entries(WALLPAPERS).map(([k,w])=>{
    const owned = state.wallpapers.includes(k), on = state.wallpaper===k;
    const btn = on ? `<button class="btn small" disabled>On the wall</button>`
      : owned ? `<button class="btn small" data-wp="${k}">Use it</button>`
      : `<button class="btn small primary" data-buywp="${k}" ${state.coins<w.price?'disabled':''}>Buy for ${w.price}</button>`;
    return `<div class="ditem ${owned?'owned':''}"><div class="wpv" data-wpk="${k}"></div><span>${w.name}</span>${btn}</div>`;
  }).join('');
  openModal(`<h2>Decorate your studio</h2>
    <p>Every decoration on display makes your paintings sell for ${Math.round(COZY*100)}% more. You have <b>${Math.floor(state.coins)} coins</b>.</p>
    <h3 class="section-title">Decorations</h3><div class="ditems">${dItems}</div>
    <h3 class="section-title">Wallpaper</h3><div class="ditems">${wItems}</div>
    <div class="row"><button class="btn" id="decDone">Done</button></div>`);
  $$('[data-wpk]').forEach(d=>{ d.style.background = WALLPAPERS[d.dataset.wpk].css; d.style.backgroundColor = STUDIOS[lvl].room; });
  const redo = ()=>{ save(); renderHUD(); enterStudio(); const y=$('#sheet').scrollTop; openDecorate(); $('#sheet').scrollTop=y; };
  $$('[data-buy]').forEach(b=>b.onclick = ()=>{ const d=DECOR[b.dataset.buy]; if(state.coins<d.price) return; state.coins-=d.price; state.decor[b.dataset.buy]=true; toast(`${d.name} added to your studio!`); redo(); });
  $$('[data-toggle]').forEach(b=>b.onclick = ()=>{ const k=b.dataset.toggle; state.decor[k] = !state.decor[k]; redo(); });
  $$('[data-buywp]').forEach(b=>b.onclick = ()=>{ const k=b.dataset.buywp, w=WALLPAPERS[k]; if(state.coins<w.price) return; state.coins-=w.price; state.wallpapers.push(k); state.wallpaper=k; redo(); });
  $$('[data-wp]').forEach(b=>b.onclick = ()=>{ state.wallpaper=b.dataset.wp; redo(); });
  $('#decDone').onclick = closeModal;
}
$('#galleryBtn').addEventListener('click', ()=>{
  const s = state.sold;
  openModal(`<h2>Sold paintings</h2>${s.length ? `<p>Your ${s.length} most recent sales.</p><div class="gallery">${s.map(p=>`<figure><img src="${p.img}" alt="Sold painting"><figcaption>${p.price} coins · ${esc(p.buyer)}</figcaption></figure>`).join('')}</div>` : '<p>No sales yet. Finish a painting and press Sell painting.</p>'}
    <div class="row"><button class="btn" id="closeG">Close</button></div>`);

$('#upgradeBtn').addEventListener('click', ()=>{
  const nx = STUDIOS[state.studio+1]; if(!nx) return;

  $$('[data-pack]').forEach(b=>b.onclick = ()=>openPack(b.dataset.pack));
}
function rollRarity(){ let r=Math.random()*100; for(const [k,w] of Object.entries(RARITY_W)){ if((r-=w)<0) return k; } return 'common'; }
function newColors(n){
  const left = shuffle(COLORS.filter(c=>!state.colors.includes(c.hex)));
  const out = [];
  for(let i=0;i<n;i++){
    const c = left[i];
    if(c){ state.colors.push(c.hex); out.push({kind:'color', hex:c.hex, name:c.name}); }
    else { state.coins+=25; out.push({kind:'coins', n:25, why:'You have every color!'}); }
  }
  return out;
}
function rarityPick(keys, cat){
  const want = rollRarity(), order = ['legendary','epic','rare','common'];
  for(let i=order.indexOf(want); i<order.length; i++){ const opts = keys.filter(k=>cat[k].rarity===order[i]); if(opts.length) return pick(opts); }
  return pick(keys);
}
function openPack(id){
  const P = PACKS.find(p=>p.id===id); if(state.coins < P.price) return;
  state.coins -= P.price;
  let rewards = [];
  if(id==='colors') rewards = newColors(3);
  else if(id==='supplies'){
    state.canvases += 3; rewards.push({kind:'canvas', n:3});
    const left = Object.keys(TOOLS).filter(k=>!state.tools.includes(k) && !TOOLS[k].free);
    if(left.length && Math.random() < .5){ const k = rarityPick(left, TOOLS); state.tools.push(k); rewards.push({kind:'tool', id:k, rarity:TOOLS[k].rarity}); }
    else rewards.push({kind:'coins', n:15, why:'Bonus coins'});
  }
  else if(id==='style'){
    const k = rarityPick(Object.keys(HATS).filter(h=>!HATS[h].start), HATS);
    if(state.hats.includes(k)){ state.coins+=30; rewards.push({kind:'dupe', hat:k, n:30, rarity:HATS[k].rarity}); }
    else { state.hats.push(k); rewards.push({kind:'hat', id:k, rarity:HATS[k].rarity}); }
    rewards.push(...newColors(1));
  }
  else {
    const keys = Object.keys(CHARS).filter(c=>CHARS[c].theme===P.theme), k = rarityPick(keys, CHARS);
    if(state.chars.includes(k)){ state.coins+=40; rewards.push({kind:'dupe', char:k, n:40, rarity:CHARS[k].rarity}); }
    else { state.chars.push(k); rewards.push({kind:'char', id:k, rarity:CHARS[k].rarity}); }
    rewards.push(...newColors(1));
  }
  save(); renderHUD();
  showRewards(P.name, rewards);
}
function rewardFace(r){
  const tag = r.rarity ? `<span class="tag r-${r.rarity}">${r.rarity}</span>` : '';
  switch(r.kind){
    case 'color': return `<span class="swatch" style="background:${r.hex}"></span><b>${esc(r.name)}</b><small>New color</small>`;
    case 'canvas': return `<span class="big">🖼️</span><b>${r.n} canvases</b><small>Blank canvases</small>`;
    case 'tool': return `<span class="big">${TOOLS[r.id].icon}</span><b>${TOOLS[r.id].name}</b>${tag}<small>New tool!</small>`;
    case 'char': return `${charSVG(r.id,'none')}<b>${CHARS[r.id].name}</b>${tag}<small>New character!</small>`;
    case 'hat': return `${charSVG(state.char, r.id)}<b>${HATS[r.id].name}</b>${tag}<small>New look!</small>`;
    case 'dupe': return `${r.char ? charSVG(r.char,'none') : charSVG(state.char, r.hat)}<b>${r.char?CHARS[r.char].name:HATS[r.hat].name}</b><small>Already have it: +${r.n} coins</small>`;
    case 'coins': return `<span class="coin" style="width:56px;height:56px;border-width:4px"></span><b>+${r.n} coins</b><small>${esc(r.why||'')}</small>`;
  }
  return '';
}
function showRewards(title, rewards){
  openModal(`<h2>${esc(title)}</h2><p>Tap each card to flip it.</p>
    <div class="cards">${rewards.map((r,i)=>`<button class="card" data-i="${i}" aria-label="Flip card ${i+1}"><div class="inner">
      <div class="face back"><span>?</span></div><div class="face front ${r.rarity?'r-'+r.rarity:'r-common'}">${rewardFace(r)}</div></div></button>`).join('')}</div>
    <div class="row"><button class="btn primary" id="collect">Collect</button><button class="btn" id="again">Back to the store</button></div>`);
  $$('.card').forEach(c=>c.onclick = ()=>c.classList.add('flipped'));
  const done = ()=>{ $$('.card').forEach(c=>c.classList.add('flipped')); closeModal(); renderStore(); };
  $('#collect').onclick = done; $('#again').onclick = done;
}

/* ---------------- WARDROBE ---------------- */
function renderWardrobe(){
  const total = Object.keys(CHARS).length;
  const charSlots = Object.entries(CHARS).map(([k,c])=>{
    const own = state.chars.includes(k);
    return `<button class="cslot ${own?'':'locked'} ${state.char===k?'on':''}" ${own?`data-char="${k}"`:'disabled'}>
      ${charSVG(k,'none')}<span>${own?c.name:'???'}</span><span class="tag r-${c.rarity}">${own?c.rarity:(THEMES[c.theme]||'')}</span></button>`;
  }).join('');
  const hatSlots = Object.entries(HATS).map(([k,h])=>{
    const own = state.hats.includes(k);
    return `<button class="cslot ${own?'':'locked'} ${state.hat===k?'on':''}" ${own?`data-hat="${k}"`:'disabled'}>
      ${charSVG(state.char, k)}<span>${own?h.name:'???'}</span>${h.rarity?`<span class="tag r-${h.rarity}">${own?h.rarity:'Style Pack'}</span>`:''}</button>`;
  }).join('');
  $('#wardBody').innerHTML = `<div class="ward">
    <div class="preview">${charSVG(state.char, state.hat)}<h3>${esc(state.name||'You')} as ${CHARS[state.char].name}</h3>
      <p style="font-weight:700;color:var(--soft)">${state.chars.length} of ${total} characters collected</p></div>
    <div><h3 class="section-title" style="margin-top:0">Characters</h3><div class="grid-c">${charSlots}</div>
      <h3 class="section-title">Hats and accessories</h3><div class="grid-c">${hatSlots}</div></div></div>`;
  $$('[data-char]').forEach(b=>b.onclick = ()=>{ state.char=b.dataset.char; save(); renderHUD(); renderWardrobe(); });
  $$('[data-hat]').forEach(b=>b.onclick = ()=>{ state.hat=b.dataset.hat; save(); renderHUD(); renderWardrobe(); });
}

/* ---------------- SETTINGS (grown-ups) ---------------- */
$('#gear').addEventListener('click', openSettings);
function openSettings(){
  const st = state.settings;
  const seg = (key, vals, label) => vals.map(v=>`<button data-k="${key}" data-v="${v}" class="${st[key]==v?'on':''}">${label(v)}</button>`).join('');
  openModal(`<h2>Grown-up settings</h2>
    <div class="setting"><label>Question level</label><div class="seg">${seg('grade',[5,6,7],v=>`Grade ${v}`)}</div></div>
    <div class="setting"><label>Subjects</label><div class="checks">
      <label><input type="checkbox" data-sub="math" ${st.math?'checked':''}> Math</label>
      <label><input type="checkbox" data-sub="geo" ${st.geo?'checked':''}> Geography and capitals</label>
      <label><input type="checkbox" data-sub="sci" ${st.sci?'checked':''}> Science</label></div></div>
    <div class="setting"><label>100 energy lasts for</label><div class="seg">${seg('minutes',[3,5],v=>`${v} minutes of painting`)}</div></div>
    <div class="setting"><label>Artist name</label><input type="text" id="nameIn" maxlength="16" value="${esc(state.name)}"></div>
    <p style="color:var(--soft);font-weight:700;margin-top:10px">Progress so far: ${state.stats.correct} of ${state.stats.answered} questions right, best streak ${state.stats.bestStreak}, ${state.stats.paintings} paintings sold.</p>
    <div class="row"><button class="btn primary" id="setDone">Done</button><button class="btn" id="resetBtn">Start over</button></div>`);
  $$('.seg button').forEach(b=>b.onclick = ()=>{ st[b.dataset.k] = +b.dataset.v; save(); openSettings(); });
  $$('[data-sub]').forEach(c=>c.onchange = ()=>{ st[c.dataset.sub] = c.checked; save(); });
  $('#setDone').onclick = ()=>{ const n = $('#nameIn').value.trim(); if(n) state.name = n; save(); renderHUD(); closeModal(); if(current==='quiz') nextQuestion(); };
  $('#resetBtn').onclick = ()=>{
    if(confirm('Start over? This erases all coins, paintings, characters and colors.')){
      localStorage.removeItem(SAVE_KEY); state = defaults(); painting=false; clearCanvas(); closeModal(); welcome();
    }
  };
}

/* ---------------- WELCOME ---------------- */
function welcome(){
  openModal(`<h2>Welcome to Paint Pals!</h2>
    <p>Earn coins by making paintings and selling them.</p>
    <div class="loop">
      <div><span>📚</span>Answer questions to get energy</div>
      <div><span>🎨</span>Use energy to paint</div>
      <div><span>🪙</span>Sell paintings for coins</div>
      <div><span>🎁</span>Spend coins on packs and upgrades</div>
    </div>
    <p>You start with 3 blank canvases, a pencil, a brush and 8 colors.</p>
    <div class="setting"><label for="nameIn">What’s your artist name?</label><input type="text" id="nameIn" maxlength="16" placeholder="Type your name"></div>
    <div class="row"><button class="btn primary" id="startBtn">Let’s paint!</button></div>`);
  const go = ()=>{ state.name = $('#nameIn').value.trim() || 'Artist'; save(); closeModal(); show('town'); };
  $('#startBtn').onclick = go;
  $('#nameIn').addEventListener('keydown', e=>{ if(e.key==='Enter') go(); });
  setTimeout(()=>$('#nameIn').focus(), 50);
}
$('#modal').addEventListener('click', e=>{ if(e.target.id==='modal' && state.name) closeModal(); });
document.addEventListener('keydown', e=>{ if(e.key==='Escape' && !$('#modal').hidden && state.name) closeModal(); });
window.addEventListener('beforeunload', ()=>{ if(current==='studio') saveWip(true); else save(); });
document.addEventListener('visibilitychange', ()=>{ if(document.hidden){ if(current==='studio') saveWip(true); else save(); } });

/* ---------------- START ---------------- */
show('town');
if(!state.name) welcome();
</script>
</body>
