<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Arcade">
<title>Sloeber Studio Arcade</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>👾</text></svg>">
<link href="https://fonts.googleapis.com/css2?family=Nunito:wght@700;900&display=swap" rel="stylesheet">
<style>
  body {
    margin: 0; padding: 0; font-family: 'Nunito', sans-serif;
    background: linear-gradient(135deg, #1B2340, #2E1A47);
    color: white; overflow: hidden;
    -webkit-user-select: none; user-select: none;
    -webkit-tap-highlight-color: transparent;
  }
  .container {
    padding: env(safe-area-inset-top, 20px) 20px env(safe-area-inset-bottom, 20px);
    height: 100vh; box-sizing: border-box; display: flex; flex-direction: column;
    max-width: 900px; margin: 0 auto;
  }
  header { text-align: center; margin-bottom: 24px; }
  h1 { font-size: 3rem; margin: 10px 0 5px; text-shadow: 0 4px 0 rgba(0,0,0,0.3); }
  .subtitle { color: #A8B1CA; font-size: 1.2rem; margin: 0; font-weight: 700; }
  .grid {
    display: grid; grid-template-columns: repeat(2, 1fr); gap: 20px;
    flex: 1; overflow-y: auto; padding-bottom: 20px;
  }
  .card {
    background: white; color: #1D2340; border-radius: 24px;
    padding: 20px; text-decoration: none; display: flex; flex-direction: column;
    align-items: center; justify-content: center; text-align: center;
    box-shadow: 0 8px 0 rgba(0,0,0,0.2); transition: transform 0.1s, box-shadow 0.1s;
  }
  .card:active { transform: translateY(6px); box-shadow: 0 2px 0 rgba(0,0,0,0.2); }
  .icon { font-size: 4.5rem; margin-bottom: 10px; line-height: 1; }
  .card h2 { margin: 0 0 5px; font-size: 1.8rem; }
  .card p { margin: 0; color: #56607E; font-size: 1.05rem; font-weight: 700; }
  
  .badge {
    display: inline-block; padding: 4px 12px; border-radius: 12px;
    font-size: 0.9rem; font-weight: 900; margin-bottom: 10px;
  }
  .badge.mika { background: #FFB3D1; color: #D6337A; }
  .badge.miro { background: #A9DEF9; color: #1D6FE0; }
  .badge.coop { background: #FFD6BA; color: #E63946; }

  .card.paint { border: 5px solid #D6337A; }
  .card.dragon { border: 5px solid #ff8a1f; }
  .card.glimmer { border: 5px solid #16C5B0; }
  .card.passport { border: 5px solid #2F6EA5; }
</style>
</head>
<body>
  <div class="container">
    <header>
      <h1>👾 Sloeber Studio Arcade</h1>
      <p class="subtitle">Tap a game to start playing!</p>
    </header>
    <div class="grid">
      <a href="paint-pals.html" class="card paint" onclick="playSfx()">
        <span class="badge mika">Mika</span>
        <div class="icon">🎨</div>
        <h2>Paint Pals</h2>
        <p>6th Grade Art & Trivia</p>
      </a>
      <a href="dragon-math-quest.html" class="card dragon" onclick="playSfx()">
        <span class="badge miro">Miro</span>
        <div class="icon">🚀</div>
        <h2>Dragon Math Quest</h2>
        <p>Space Math Adventure</p>
      </a>
      <a href="glimmer-quest.html" class="card glimmer" onclick="playSfx()">
        <span class="badge miro">Miro</span>
        <div class="icon">💎</div>
        <h2>Glimmer Quest</h2>
        <p>Monster Catching</p>
      </a>
      <a href="passport-race.html" class="card passport" onclick="playSfx()">
        <span class="badge coop">Co-op</span>
        <div class="icon">🌍</div>
        <h2>Passport Race</h2>
        <p>Global Trivia Race</p>
      </a>
    </div>
  </div>
  <script>
    const ac = new (window.AudioContext || window.webkitAudioContext)();
    function playSfx() {
      if (ac.state === 'suspended') ac.resume();
      const o = ac.createOscillator(), g = ac.createGain();
      o.type = 'triangle'; o.frequency.value = 520;
      g.gain.setValueAtTime(0, ac.currentTime);
      g.gain.linearRampToValueAtTime(0.15, ac.currentTime + 0.05);
      g.gain.linearRampToValueAtTime(0, ac.currentTime + 0.15);
      o.connect(g); g.connect(ac.destination);
      o.start(); o.stop(ac.currentTime + 0.2);
    }
  </script>
</body>
</html>
