<title>Kotoba · Word game</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600;700&family=M+PLUS+Rounded+1c:wght@400;700;800&display=swap" rel="stylesheet">
<style>
:root{
  --paper:#F6F8FD; --grid:#D3DDF2; --ink:#1E2A4A; --ink-soft:#56617E;
  --matcha:#4F8F44; --yuzu:#E2B13C; --slate:#8C94A8; --sakura:#E86A92;
  --tile-bg:#FFFFFF; --tile-line:#B9C5E2; --key:#E3E9F6; --key-ink:#1E2A4A;
  --sheet:#FFFFFF; --shadow:0 10px 30px rgba(30,42,74,.18);
  --on-correct:#FFFFFF; --on-present:#1E2A4A; --on-absent:#FFFFFF;
  color-scheme:light;
  box-sizing:border-box;
  --safe-t:env(safe-area-inset-top,0px); --safe-b:env(safe-area-inset-bottom,0px);
  --safe-l:env(safe-area-inset-left,0px); --safe-r:env(safe-area-inset-right,0px);
  /* key heights scale with screen height: iPhone SE up to Pro Max / iPad */
  --key-h:clamp(42px, 7.2vh, 58px);
  --jkey-h:clamp(32px, 5.3vh, 48px);
}
@media (prefers-color-scheme:dark){
  :root{
    --paper:#141A2C; --grid:#232D49; --ink:#EEF1FA; --ink-soft:#A8B1CC;
    --matcha:#5FA653; --yuzu:#D9A82E; --slate:#4A5370; --sakura:#F07EA2;
    --tile-bg:#1B2338; --tile-line:#3A4669; --key:#2A3452; --key-ink:#EEF1FA;
    --sheet:#1D2540; --shadow:0 10px 30px rgba(0,0,0,.5);
    --on-present:#1B1B1B; color-scheme:dark;
  }
}
*,*::before,*::after{box-sizing:inherit}
html{height:100%;-webkit-text-size-adjust:100%;text-size-adjust:100%;touch-action:manipulation}
html,body{margin:0;overflow:hidden}
body{
  position:fixed;inset:0; /* no rubber-band scrolling or accidental page drag on iPhone */
  -webkit-touch-callout:none;-webkit-user-select:none;user-select:none;
  background-color:var(--paper);
  background-image:
    linear-gradient(var(--grid) 1px, transparent 1px),
    linear-gradient(90deg, var(--grid) 1px, transparent 1px);
  background-size:28px 28px;
  color:var(--ink);
  font-family:"M PLUS Rounded 1c","Hiragino Maru Gothic ProN","Yu Gothic",system-ui,sans-serif;
  -webkit-tap-highlight-color:transparent;
  overscroll-behavior:none;
}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible{outline:3px solid var(--sakura);outline-offset:2px}

.app{
  height:100%;max-width:560px;margin:0 auto;
  padding:calc(var(--safe-t) + 6px) calc(var(--safe-r) + 8px) calc(var(--safe-b) + 6px) calc(var(--safe-l) + 8px);
  display:flex;flex-direction:column;gap:6px;
}
button{touch-action:manipulation}

/* header */
header{display:flex;align-items:center;justify-content:space-between;gap:10px}
.title{position:relative;display:flex;align-items:baseline;gap:8px;padding:2px 10px}
.title::before{ /* washi tape */
  content:"";position:absolute;inset:6px -4px 2px -4px;z-index:-1;
  background:repeating-linear-gradient(135deg,var(--sakura) 0 8px,color-mix(in srgb,var(--sakura) 75%,#fff) 8px 16px);
  opacity:.35;transform:rotate(-1.5deg);border-radius:2px;
}
.title h1{margin:0;font-family:Fredoka,"M PLUS Rounded 1c",sans-serif;font-weight:700;font-size:27px;letter-spacing:.5px}
.title span{font-weight:800;font-size:15px;color:var(--ink-soft)}
.head-btns{display:flex;gap:6px}
.icon-btn{border:2px solid var(--tile-line);background:var(--tile-bg);border-radius:12px;min-width:44px;height:40px;padding:0 12px;font-size:15px;font-weight:700}
.head-btns{align-items:center}
.streak{font-weight:800;font-size:14px;color:var(--ink-soft);white-space:nowrap}

/* controls */
.controls{display:flex;flex-wrap:nowrap;gap:6px;align-items:center}
.controls .seg{flex:0 1 auto}
.seg{display:inline-flex;background:var(--tile-bg);border:2px solid var(--tile-line);border-radius:14px;padding:3px;gap:2px}
.seg button{border:0;background:transparent;border-radius:10px;min-height:34px;padding:0 11px;font-weight:700;font-size:14px;color:var(--ink-soft);white-space:nowrap}
.short{display:none}
.seg button[aria-pressed="true"]{background:var(--ink);color:var(--paper)}
.seg .tag{font-size:11px;opacity:.75;margin-left:2px}

.level{font-size:13px;color:var(--ink-soft);display:flex;align-items:center;gap:8px;min-height:18px;white-space:nowrap;overflow:hidden}
.bar{flex:0 1 110px;min-width:50px;height:8px;border-radius:8px;background:var(--key);overflow:hidden}
.bar i{display:block;height:100%;background:var(--matcha);border-radius:8px;transition:width .4s}

/* board */
.board-wrap{flex:1;display:flex;align-items:center;justify-content:center;min-height:0;overflow:hidden}
.board{
  --cols:5;--gap:6px;
  --tile:44px;
  display:grid;gap:var(--gap);
}
.row{display:grid;grid-template-columns:repeat(var(--cols),var(--tile));gap:var(--gap)}
.row.shake{animation:shake .4s}
.tile{
  width:var(--tile);height:var(--tile);
  display:flex;align-items:center;justify-content:center;
  background:var(--tile-bg);border:2px solid var(--tile-line);border-radius:9px;
  font-family:Fredoka,"M PLUS Rounded 1c",sans-serif;font-weight:600;
  font-size:calc(var(--tile) * .52);text-transform:uppercase;line-height:1;
}
.ja .tile{font-family:"M PLUS Rounded 1c",sans-serif;font-weight:800;font-size:calc(var(--tile) * .5)}
.tile.filled{border-color:var(--ink);animation:pop .1s}
.tile[data-s]{border-color:transparent}
.tile[data-s="correct"]{background:var(--matcha);color:var(--on-correct)}
.tile[data-s="present"]{background:var(--yuzu);color:var(--on-present)}
.tile[data-s="absent"]{background:var(--slate);color:var(--on-absent)}
.tile.flip{animation:flip .45s ease both}
.row.win .tile{animation:hop .5s ease both}

/* message + clue */
.under{min-height:36px;display:flex;align-items:center;justify-content:center;gap:10px;text-align:center}
.clue-btn{border:2px dashed var(--sakura);background:transparent;border-radius:12px;min-height:36px;padding:0 14px;font-weight:700;font-size:14px;color:var(--ink)}
.clue{font-size:14.5px;line-height:1.4;max-height:4.4em;overflow:auto;max-width:46ch;background:var(--tile-bg);border-left:4px solid var(--sakura);border-radius:8px;padding:6px 12px;text-align:left}

/* keyboard */
.kb{display:flex;flex-direction:column;gap:7px;padding-bottom:2px;user-select:none;-webkit-user-select:none;touch-action:manipulation}
.kb .krow{display:flex;gap:5px;justify-content:center}
.key{
  flex:1;min-width:0;height:var(--key-h);border:0;border-radius:8px;padding:0;
  background:var(--key);color:var(--key-ink);
  font-family:Fredoka,sans-serif;font-weight:600;font-size:18px;text-transform:uppercase;
  display:flex;flex-direction:column;align-items:center;justify-content:center;gap:1px;
}
.key.wide{flex:1.6;font-size:13px;text-transform:none}
.key.down{filter:brightness(.82);transform:translateY(1px)}
.key[data-s="correct"]{background:var(--matcha);color:var(--on-correct)}
.key[data-s="present"]{background:var(--yuzu);color:var(--on-present)}
.key[data-s="absent"]{background:var(--slate);color:var(--on-absent);opacity:.8}
.spacer{flex:1;visibility:hidden}
.ja .key{height:var(--jkey-h);font-family:"M PLUS Rounded 1c",sans-serif;font-weight:800;font-size:18px;border-radius:8px}
.ja .key small{font-family:Fredoka,sans-serif;font-weight:500;font-size:10px;opacity:.7;text-transform:none;line-height:1}
.ja .kb{gap:5px}
.ja .kb .krow{gap:4px}
.ja .key.wide{font-size:13px}
.ja .key.mod{font-size:20px}

/* toast */
.toast{position:fixed;left:50%;top:calc(var(--safe-t) + 96px);transform:translateX(-50%);
  background:var(--ink);color:var(--paper);padding:9px 16px;border-radius:10px;font-weight:700;font-size:15px;
  opacity:0;pointer-events:none;transition:opacity .2s;z-index:30}
.toast.show{opacity:1}

/* result sheet */
.scrim{position:fixed;inset:0;background:rgba(20,26,44,.35);display:none;align-items:flex-end;justify-content:center;z-index:20}
.scrim.open{display:flex}
.sheet{
  width:min(560px,100%);background:var(--sheet);border-radius:22px 22px 0 0;box-shadow:var(--shadow);
  padding:22px calc(22px + var(--safe-r)) calc(18px + var(--safe-b)) calc(22px + var(--safe-l));
  max-height:calc(100% - var(--safe-t) - 20px);overflow:auto;-webkit-user-select:text;user-select:text;
  animation:rise .3s ease both;
}
.sheet .verdict{margin:0 0 6px;font-size:15px;font-weight:700;color:var(--ink-soft)}
.sheet .word{margin:0;font-family:Fredoka,"M PLUS Rounded 1c",sans-serif;font-weight:700;font-size:44px;letter-spacing:2px;text-transform:uppercase;line-height:1.1}
.sheet.jaw .word{font-family:"M PLUS Rounded 1c",sans-serif;font-weight:800;letter-spacing:4px}
.sheet .reading{margin:4px 0 0;font-size:16px;color:var(--ink-soft);font-weight:700}
.sheet .def{margin:12px 0 0;font-size:17px;line-height:1.55;max-width:48ch}
.sheet .stats{margin:14px 0 0;font-size:14px;color:var(--ink-soft)}
.sheet .actions{display:flex;gap:10px;margin-top:18px}
.btn{border:0;border-radius:14px;min-height:50px;padding:0 18px;font-weight:800;font-size:16px}
.btn.main{flex:1;background:var(--ink);color:var(--paper)}
.btn.alt{background:var(--key);color:var(--key-ink)}

/* settings sheet */
.set-row{display:flex;flex-direction:column;gap:6px;margin-top:14px}
.set-row label{font-weight:700;font-size:15px}
.set-row p{margin:0;font-size:13px;color:var(--ink-soft);line-height:1.4}
.result{
  width:100%;border-radius:18px;padding:14px 18px 14px;max-height:none;overflow:visible;
  border:2px solid var(--tile-line);box-shadow:none;
}
[hidden]{display:none!important}
.result .verdict{margin:0 0 2px;font-size:14px}
.result .word-line{display:flex;align-items:baseline;gap:12px;flex-wrap:wrap}
.result .word{font-size:34px}
.result .reading{margin:0}
.result .def{margin:6px 0 0;font-size:16px;line-height:1.45}
.result .stats{margin:8px 0 0;font-size:13px}
.result .actions{margin-top:12px}
.sheet h2{margin:0;font-family:Fredoka,sans-serif;font-size:24px}

@keyframes pop{50%{transform:scale(1.08)}}
@keyframes flip{0%{transform:rotateX(0)}50%{transform:rotateX(90deg)}100%{transform:rotateX(0)}}
@keyframes hop{40%{transform:translateY(-14px)}}
@keyframes shake{20%,60%{transform:translateX(-6px)}40%,80%{transform:translateX(6px)}}
@keyframes rise{from{transform:translateY(40px);opacity:0}}
@media (prefers-reduced-motion:reduce){
  .tile.flip,.row.win .tile,.row.shake,.tile.filled,.sheet{animation:none!important}
}
@media (max-width:430px){
  .tag{display:none}
  .ja .long{display:none} .ja .short{display:inline;font-size:16px}
}
@media (max-width:380px){ .title h1{font-size:23px} .title span{font-size:13px} .seg button{padding:0 8px} .icon-btn{padding:0 9px} }
/* short screens (iPhone SE, or Safari with toolbars) */
@media (max-height:700px){ .app{gap:4px} .level{min-height:16px;font-size:12.5px} }
/* landscape on a phone: keep it playable */
@media (orientation:landscape) and (max-height:500px){
  :root{--key-h:34px;--jkey-h:26px}
  .level,.under{display:none}
  .ja .key small{display:none}
}
</style>
</head>
<body>
<div class="app" id="app">
  <header>
    <div class="title"><h1>Kotoba</h1><span>ことば</span></div>
    <div class="head-btns">
      <span class="streak" id="streak"></span>
      <button class="icon-btn" id="skipBtn" title="Give up and show the word">Skip</button>
      <button class="icon-btn" id="setBtn" aria-label="Settings">⚙︎</button>
    </div>
  </header>

  <div class="controls">
    <div class="seg" id="langSeg" role="group" aria-label="Language">
      <button data-v="en">English</button>
      <button data-v="ja">日本語</button>
    </div>
    <div class="seg" id="lenSeg" role="group" aria-label="Word length"></div>
    <div class="seg" id="scriptSeg" role="group" aria-label="Japanese script">
      <button data-v="h"><span class="long">ひらがな</span><span class="short">あ</span></button>
      <button data-v="k"><span class="long">カタカナ</span><span class="short">ア</span></button>
    </div>
  </div>

  <div class="level" id="level"></div>

  <div class="board-wrap"><div class="board" id="board"></div></div>

  <div class="under" id="under"></div>

  <div class="kb" id="kb"></div>

  <section class="sheet result" id="resultSheet" hidden aria-live="polite">
    <p class="verdict" id="resVerdict"></p>
    <div class="word-line"><p class="word" id="resWord"></p><p class="reading" id="resReading"></p></div>
    <p class="def" id="resDef"></p>
    <p class="stats" id="resStats"></p>
    <div class="actions">
      <button class="btn main" id="nextBtn">Next word</button>
    </div>
  </section>
</div>

<div class="toast" id="toast" role="status" aria-live="polite"></div>


<div class="scrim" id="setScrim">
  <div class="sheet" role="dialog" aria-modal="true" aria-labelledby="setTitle">
    <h2 id="setTitle">Settings</h2>
    <div class="set-row">
      <label>English word difficulty</label>
      <div class="seg" id="diffSeg">
        <button data-v="auto">Auto</button>
        <button data-v="1">Easy</button>
        <button data-v="2">Medium</button>
        <button data-v="3">Hard</button>
      </div>
      <p>Auto starts with easy words and moves up a level as you keep solving them.</p>
    </div>
    <div class="set-row">
      <label>Romaji on Japanese keys</label>
      <div class="seg" id="romajiSeg">
        <button data-v="on">Show</button>
        <button data-v="off">Hide</button>
      </div>
      <p>Small letters under each kana, like か (ka). Hide them once you know the keys by heart.</p>
    </div>
    <div class="set-row">
      <label>Progress</label>
      <div><button class="btn alt" id="resetBtn">Reset all progress</button></div>
    </div>
    <div class="actions"><button class="btn main" id="closeSet">Done</button></div>
  </div>
</div>

<script>
/* =========================================================
   WORD BANKS
   English: word|kid-friendly definition. Tier 1 everyday,
   tier 2 school vocabulary, tier 3 stretch words.
   Japanese: kana|romaji|meaning. No small kana (ゃゅょっ).
   ========================================================= */
const EN_RAW = {
5:{1:`

const saveS = ()=>store.set('kotoba-settings',S);
const saveP = ()=>store.set('kotoba-progress',P);

/* levels for English auto mode: wins needed to reach each level */
const LV = [0, 4, 10]; // level 1 at 0 pts, level 2 at 4, level 3 at 10
const tierFromPts = p => p>=LV[2]?3:p>=LV[1]?2:1;

const poolKey = ()=> S.lang==='en' ? `en${S.enLen}` : `ja${S.script}${S.jaLen}`;
const prog = ()=> (P[poolKey()] ||= {pts:0,wins:0,played:0,streak:0,best:0,used:[]});
const curLen = ()=> S.lang==='en' ? S.enLen : S.jaLen;
const curTier = ()=> S.diff==='auto' ? tierFromPts(prog().pts) : +S.diff;

/* ---------- game state ---------- */
const ROWS = 6;
let G = null;
let busy = false;

function pick(){
  const pr = prog();
  let list, tier=null;
  if (S.lang==='en'){ tier = curTier(); list = EN[S.enLen][tier]; }
  else list = JA[S.script][S.jaLen];
  let fresh = list.filter(x=>!pr.used.includes(x.w));
  if (!fresh.length){ pr.used = pr.used.filter(w=>!list.some(x=>x.w===w)); fresh = list.slice(); }
  const e = fresh[Math.floor(Math.random()*fresh.length)];
  return {...e, tier};
}

function newGame(){
  const rs=document.getElementById('resultSheet'); if(rs && !rs.hidden){ rs.hidden=true; kbEl.hidden=false; underEl.hidden=false; }
  const entry = pick();
  G = { entry, ans:Array.from(entry.w), rows:[], cur:[], done:false, clue:false, keys:{} };
  busy=false;
  render();
}

/* ---------- evaluation (handles repeated letters) ---------- */
function evaluate(guess, ans){
  const res = Array(ans.length).fill('absent'), left = {};
  ans.forEach((c,i)=>{ if(guess[i]===c) res[i]='correct'; else left[c]=(left[c]||0)+1; });
  guess.forEach((c,i)=>{ if(res[i]!=='correct' && left[c]>0){ res[i]='present'; left[c]--; } });
  return res;
}
const RANK = {absent:1,present:2,correct:3};

/* ---------- DOM ---------- */
const $ = id=>document.getElementById(id);
const app=$('app'), boardEl=$('board'), kbEl=$('kb'), underEl=$('under');

function render(){
  app.classList.toggle('ja', S.lang==='ja');
  document.documentElement.lang = S.lang==='ja'?'ja':'en';
  renderControls(); renderLevel(); renderKeyboard(); renderUnder(); renderBoard();
  const pr = prog();
  $('streak').textContent = pr.streak>0 ? `🔥 ${pr.streak}` : '';
}

function seg(el, val){ el.querySelectorAll('button').forEach(b=>b.setAttribute('aria-pressed', String(b.dataset.v===String(val)))); }

function renderControls(){
  seg($('langSeg'), S.lang);
  const lens = S.lang==='en' ? [5,6,7] : [3,4];
  const unit = S.lang==='en' ? 'letters' : 'kana';
  $('lenSeg').innerHTML = lens.map(n=>`<button data-v="${n}">${n}<span class="tag">${n===lens[0]?' '+unit:''}</span></button>`).join('');
  seg($('lenSeg'), curLen());
  $('scriptSeg').style.display = S.lang==='ja' ? '' : 'none';
  seg($('scriptSeg'), S.script);
  seg($('diffSeg'), S.diff);
  seg($('romajiSeg'), S.romaji?'on':'off');
}

function renderLevel(){
  const pr = prog(), el = $('level');
  if (S.lang==='ja'){
    el.innerHTML = `Words solved in this set: <b>${pr.wins}</b>`;
    return;
  }
  if (S.diff!=='auto'){
    el.textContent = `Fixed at ${['','Easy','Medium','Hard'][S.diff]} words. Switch to Auto in settings to level up.`;
    return;
  }
  const t = tierFromPts(pr.pts);
  if (t===3){ el.innerHTML = `<b>Level 3</b>, the hardest words. Total solved: ${pr.wins}`; return; }
  const lo = LV[t-1], hi = LV[t], pct = Math.round((pr.pts-lo)/(hi-lo)*100), need = hi-pr.pts;
  el.innerHTML = `<b>Level ${t}</b><span class="bar"><i style="width:${pct}%"></i></span>${need} more ${need===1?'win':'wins'} to Level ${t+1}`;
}

function renderBoard(){
  const L = G.ans.length;
  boardEl.style.setProperty('--cols', L);
  let html='';
  for (let r=0;r<ROWS;r++){
    html += `<div class="row" data-r="${r}">`;
    const done = G.rows[r];
    for (let c=0;c<L;c++){
      if (done) html += `<div class="tile" data-s="${done.res[c]}">${done.g[c]}</div>`;
      else if (r===G.rows.length && G.cur[c]) html += `<div class="tile filled">${G.cur[c]}</div>`;
      else html += `<div class="tile"></div>`;
    }
    html += `</div>`;
  }
  boardEl.innerHTML = html;
  fitBoard();
}
function fitBoard(){
  const wrap = boardEl.parentElement, L = G.ans.length, gap = 6;
  const w = wrap.clientWidth, hgt = wrap.clientHeight;
  const t = Math.floor(Math.min(64, (w - gap*(L-1))/L, (hgt - gap*(ROWS-1))/ROWS));
  boardEl.style.setProperty('--tile', Math.max(24,t)+'px');
}
addEventListener('resize', ()=>G&&fitBoard());
if (window.visualViewport) visualViewport.addEventListener('resize', ()=>G&&fitBoard());
addEventListener('orientationchange', ()=>setTimeout(()=>G&&fitBoard(),250));
document.fonts && document.fonts.ready.then(()=>G&&fitBoard());

function updateCurrentRow(){
  const row = boardEl.querySelector(`.row[data-r="${G.rows.length}"]`);
  if (!row) return;
  [...row.children].forEach((t,i)=>{
    const ch = G.cur[i]||''; 
    if (t.textContent!==ch){ t.textContent=ch; t.classList.toggle('filled', !!ch); }
  });
}

function keyBtn(ch, label, extra=''){
  const s = G.keys[S.lang==='ja'?toBase(ch):ch];
  return `<button class="key ${extra}" data-k="${ch}" ${s?`data-s="${s}"`:''}>${label}</button>`;
}

function renderKeyboard(){
  let html='';
  if (S.lang==='en'){
    const rows=['qwertyuiop','asdfghjkl','zxcvbnm'];
    rows.forEach((r,i)=>{
      html += `<div class="krow">`;
      if (i===2) html += `<button class="key wide" data-k="ENTER">Enter</button>`;
      for (const ch of r) html += keyBtn(ch, ch);
      if (i===2) html += `<button class="key wide" data-k="BACK" aria-label="Delete">⌫</button>`;
      html += `</div>`;
    });
  } else {
    const kata = S.script==='k';
    for (const row of GOJUON){
      html += `<div class="krow">`;
      for (const cell of row){
        if (!cell){ html += `<span class="key spacer"></span>`; continue; }
        const h = cell[0], rom = cell.slice(1), ch = kata?toK(h):h;
        html += keyBtn(ch, `${ch}${S.romaji?`<small>${rom}</small>`:''}`);
      }
      html += `</div>`;
    }
    const n = kata?'ン':'ん';
    html += `<div class="krow">
      ${keyBtn(n, `${n}${S.romaji?'<small>n</small>':''}`)}
      <button class="key mod" data-k="DAKU" aria-label="Add dakuten">゛<small>ka→ga</small></button>
      <button class="key mod" data-k="HANDAKU" aria-label="Add handakuten">゜<small>ha→pa</small></button>
      ${kata?`<button class="key mod" data-k="ー" aria-label="Long vowel mark">ー<small>long</small></button>`:''}
      <button class="key wide" data-k="BACK" aria-label="Delete">⌫</button>
      <button class="key wide" data-k="ENTER">Enter</button>
    </div>`;
  }
  kbEl.innerHTML = html;
}

function renderUnder(){
  if (G.done){ underEl.innerHTML=''; return; }
  if (G.clue){
    const e=G.entry;
    underEl.innerHTML = `<div class="clue">${S.lang==='en' ? e.d : `Meaning: <b>${e.m}</b>`}</div>`;
  } else {
    underEl.innerHTML = `<button class="clue-btn" id="clueBtn">${S.lang==='en'?'Show the definition as a clue':'Show the English meaning'}</button>`;
  }
}

/* ---------- input ---------- */
function press(k){
  if (!G || G.done || busy) return;
  const L = G.ans.length;
  if (k==='ENTER') return submit();
  if (k==='BACK'){ G.cur.pop(); return updateCurrentRow(); }
  if (k==='DAKU' || k==='HANDAKU'){
    const last = G.cur[G.cur.length-1]; if (!last) return;
    const kata = last!==toH(last), h = toH(last);
    let out = h, i;
    if (k==='DAKU'){
      if ((i=BASE_V.indexOf(h))>=0) out=VOICED[i];
      else if ((i=VOICED.indexOf(h))>=0) out=BASE_V[i];
      else if ((i=SEMI.indexOf(h))>=0) out=VOICED[BASE_V.indexOf(BASE_P[i])];
    } else {
      if ((i=BASE_P.indexOf(h))>=0) out=SEMI[i];
      else if ((i=SEMI.indexOf(h))>=0) out=BASE_P[i];
      else if ((i=VOICED.indexOf(h))>=0 && BASE_P.includes(BASE_V[i])) out=SEMI[BASE_P.indexOf(BASE_V[i])];
    }
    if (out===h){ toast(S.lang==='ja'?'That kana has no ゛ or ゜ version':''); return; }
    G.cur[G.cur.length-1] = kata?toK(out):out;
    return updateCurrentRow();
  }
  if (G.cur.length>=L) return;
  G.cur.push(k); updateCurrentRow();
}

function shake(){
  const row = boardEl.querySelector(`.row[data-r="${G.rows.length}"]`);
  if(!row) return; row.classList.remove('shake'); void row.offsetWidth; row.classList.add('shake');
}

function submit(){
  const L = G.ans.length;
  if (G.cur.length<L){ toast(S.lang==='en'?'Not enough letters':'Not enough kana'); return shake(); }
  const g = G.cur.slice(), res = evaluate(g, G.ans);
  G.rows.push({g,res}); G.cur=[];
  const rIdx = G.rows.length-1;
  const row = boardEl.querySelector(`.row[data-r="${rIdx}"]`);
  const reduce = matchMedia('(prefers-reduced-motion: reduce)').matches;
  const step = reduce?0:260;
  busy = true;
  [...row.children].forEach((t,i)=>{
    setTimeout(()=>{
      t.classList.add('flip');
      setTimeout(()=>{ t.dataset.s=res[i]; t.classList.remove('filled'); }, reduce?0:200);
    }, i*step);
  });
  setTimeout(()=>{
    g.forEach((c,i)=>{ const k = S.lang==='ja'?toBase(c):c; if(S.lang==='ja' && k!==toH(c) && res[i]==='absent') return; if((RANK[res[i]]||0)>(RANK[G.keys[k]]||0)) G.keys[k]=res[i]; });
    renderKeyboard();
    busy=false;
    const win = res.every(x=>x==='correct');
    if (win){ row.classList.add('win'); finish(true); }
    else if (G.rows.length>=ROWS) finish(false);
  }, L*step + (reduce?0:250));
}

function finish(win){
  G.done = true;
  const pr = prog();
  const beforeTier = tierFromPts(pr.pts);
  pr.played++;
  if (!pr.used.includes(G.entry.w)) pr.used.push(G.entry.w);
  if (win){
    pr.wins++; pr.streak++; pr.best=Math.max(pr.best,pr.streak);
    if (S.lang==='en' && S.diff==='auto') pr.pts++;
  } else {
    pr.streak=0;
    if (S.lang==='en' && S.diff==='auto'){ const floor = LV[beforeTier-1]; pr.pts=Math.max(floor, pr.pts-1); }
  }
  saveP();
  const levelUp = S.lang==='en' && S.diff==='auto' && tierFromPts(pr.pts)>beforeTier;
  renderUnder(); renderLevel();
  $('streak').textContent = pr.streak>0 ? `🔥 ${pr.streak}` : '';
  setTimeout(()=>showResult(win, levelUp), win?700:300);
}

const CHEERS = ['Genius!','Brilliant!','Excellent!','Great job!','Nice work!','Phew, got it!'];
function showResult(win, levelUp){
  const e = G.entry, n = G.rows.length, pr = prog();
  const ja = S.lang==='ja';
  $('resultSheet').classList.toggle('jaw', ja);
  $('resVerdict').textContent = win ? `${CHEERS[n-1]} Solved in ${n} ${n===1?'guess':'guesses'}.${G.clue?' (with a clue)':''}` : 'Good try. The word was';
  $('resWord').textContent = e.w;
  $('resReading').textContent = ja ? e.r : '';
  $('resReading').style.display = ja ? '' : 'none';
  $('resDef').innerHTML = ja ? `Means <b>${e.m}</b>` : e.d;
  $('resStats').textContent = (levelUp ? `Level up! You're now on Level ${tierFromPts(pr.pts)}. ` : '') + `Streak ${pr.streak}, best ${pr.best}, solved ${pr.wins} of ${pr.played}.`;
  kbEl.hidden = true; underEl.hidden = true;
  $('resultSheet').hidden = false;
  fitBoard();
}


let tt;
function toast(msg){ if(!msg) return; const t=$('toast'); t.textContent=msg; t.classList.add('show'); clearTimeout(tt); tt=setTimeout(()=>t.classList.remove('show'),1400); }

/* ---------- events ---------- */
let downKey=null;
kbEl.addEventListener('pointerdown', e=>{
  const b=e.target.closest('[data-k]'); if(!b) return;
  e.preventDefault();
  b.classList.add('down'); downKey=b;
  press(b.dataset.k);
});
let holdT=null;
kbEl.addEventListener('pointerdown', e=>{ const b=e.target.closest('[data-k="BACK"]'); clearTimeout(holdT); if(b) holdT=setTimeout(()=>{ if(G&&!G.done&&!busy){ G.cur=[]; updateCurrentRow(); } },500); });
['pointerup','pointercancel','pointerleave'].forEach(t=>kbEl.addEventListener(t, ()=>clearTimeout(holdT)));
const release=()=>{ if(downKey){ downKey.classList.remove('down'); downKey=null; } };
['pointerup','pointercancel','pointerleave'].forEach(t=>kbEl.addEventListener(t, release));
kbEl.addEventListener('contextmenu', e=>e.preventDefault());
document.addEventListener('keydown', e=>{
  if (e.metaKey||e.ctrlKey||e.altKey) return;
  if (!$('resultSheet').hidden){ if(e.key==='Enter'){ e.preventDefault(); next(); } return; }
  if ($('setScrim').classList.contains('open')){ if(e.key==='Escape') $('setScrim').classList.remove('open'); return; }
  if (e.key==='Enter'){ e.preventDefault(); press('ENTER'); }
  else if (e.key==='Backspace') press('BACK');
  else if (S.lang==='en' && /^[a-z]$/i.test(e.key)) press(e.key.toLowerCase());
});
underEl.addEventListener('click', e=>{ if(e.target.closest('#clueBtn')){ G.clue=true; renderUnder(); fitBoard(); } });

function next(){ $('resultSheet').hidden = true; kbEl.hidden = false; underEl.hidden = false; newGame(); }
$('nextBtn').onclick = next;

$('langSeg').onclick = e=>{ const b=e.target.closest('button'); if(!b||b.dataset.v===S.lang) return; S.lang=b.dataset.v; saveS(); newGame(); };
$('lenSeg').onclick = e=>{ const b=e.target.closest('button'); if(!b) return; const v=+b.dataset.v; if(v===curLen()) return; if(S.lang==='en') S.enLen=v; else S.jaLen=v; saveS(); newGame(); };
$('scriptSeg').onclick = e=>{ const b=e.target.closest('button'); if(!b||b.dataset.v===S.script) return; S.script=b.dataset.v; saveS(); newGame(); };
$('diffSeg').onclick = e=>{ const b=e.target.closest('button'); if(!b||b.dataset.v===S.diff) return; S.diff=b.dataset.v; saveS(); renderControls(); renderLevel(); if(!G.rows.length) newGame(); };
$('romajiSeg').onclick = e=>{ const b=e.target.closest('button'); if(!b) return; S.romaji=b.dataset.v==='on'; saveS(); renderControls(); renderKeyboard(); };
$('setBtn').onclick = ()=>$('setScrim').classList.add('open');
$('closeSet').onclick = ()=>$('setScrim').classList.remove('open');
$('setScrim').onclick = e=>{ if(e.target.id==='setScrim') $('setScrim').classList.remove('open'); };
$('resetBtn').onclick = ()=>{ if(confirm('Reset all levels, streaks and used words?')){ P={}; saveP(); $('setScrim').classList.remove('open'); newGame(); } };
$('skipBtn').onclick = ()=>{
  if (!G || G.done || busy) return;
  if (!G.rows.length){ newGame(); toast('New word'); return; }
  finish(false);
};

newGame();
</script>
</body>
</html>
